<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b5ed7">
<title>Kvantum Bank</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f2f7ff;--bg-2:#e8f1ff;--surface:#fff;--surface-2:#f7faff;
  --line:#dfe9fa;--line-2:#ebf2fd;
  --text:#081b3a;--text-2:#3d5d85;--muted:#7a94b5;
  --blue:#0b5ed7;--blue-2:#1878f5;--blue-3:#4d9bff;--blue-soft:#e3efff;
  --navy:#031b45;
  --green:#0fa86a;--green-soft:#e3f8ee;
  --red:#ef4444;--red-soft:#ffe9ea;
  --gold:#e8b84b;--gold-soft:#fff6de;
  --purple:#8b5cf6;--purple-soft:#f0ebff;
  --shadow:0 8px 30px rgba(11,94,215,.08);
  --shadow-lg:0 22px 55px rgba(3,27,69,.16);
  --radius:16px;--radius-lg:22px;
  --ease:cubic-bezier(.22,.9,.3,1);
  --dur:.28s;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#050d1f;--bg-2:#0a1830;--surface:#0c1b35;--surface-2:#0f2344;
  --line:#1a2f52;--line-2:#152744;
  --text:#eaf2ff;--text-2:#a9c1e0;--muted:#6b88ab;
  --blue:#3d8dff;--blue-2:#5ba2ff;--blue-3:#8bc0ff;--blue-soft:#0f2a52;
  --navy:#020d24;
  --green:#28c98b;--green-soft:#0d3123;
  --red:#ff6b6b;--red-soft:#3a1414;
  --gold:#f0c668;--gold-soft:#3a2d10;
  --purple:#a78bfa;--purple-soft:#2a1d52;
  --shadow:0 8px 30px rgba(0,0,0,.4);
  --shadow-lg:0 22px 55px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;user-select:none;transition:background var(--dur) var(--ease);
}
input,textarea{user-select:text}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:16px;height:16px}
.icon.lg{width:24px;height:24px}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--bg);z-index:300;display:grid;
  place-items:center;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{width:70px;height:70px;border-radius:20px;
  background:linear-gradient(135deg,var(--blue-2),var(--navy));display:grid;
  place-items:center;color:#fff;font-weight:800;font-size:30px;
  box-shadow:0 20px 40px rgba(11,94,215,.35);animation:breathe 1.6s ease infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:radial-gradient(1000px 600px at 8% -10%,var(--blue-soft),transparent 55%),
    radial-gradient(800px 550px at 100% 110%,var(--blue-soft),transparent 50%),
    linear-gradient(180deg,var(--bg),var(--bg-2))}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);
  border-radius:26px;padding:32px 28px;box-shadow:var(--shadow-lg);
  animation:authIn .55s var(--ease)}
@keyframes authIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.auth-mark{width:54px;height:54px;border-radius:16px;flex:none;
  background:linear-gradient(135deg,var(--blue-2),var(--navy));display:grid;
  place-items:center;color:#fff;font-weight:800;font-size:26px;
  box-shadow:0 14px 30px rgba(11,94,215,.35)}
.auth-brand h1{font-size:21px;letter-spacing:-.5px;font-weight:800}
.auth-brand p{font-size:12.5px;color:var(--muted);margin-top:4px}

.tg-login{width:100%;padding:14px;border-radius:14px;
  background:linear-gradient(135deg,#2aabee,#229ed9);color:#fff;font-weight:700;
  font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 24px rgba(42,171,238,.35);transition:all var(--dur) var(--ease);
  margin-bottom:16px}
.tg-login:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(42,171,238,.45)}
.tg-login:disabled{opacity:.5;cursor:not-allowed}
.tg-divider{display:flex;align-items:center;gap:12px;margin:16px 0;
  font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
.tg-divider::before,.tg-divider::after{content:'';flex:1;height:1px;background:var(--line)}

.switch{display:flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:14px;padding:4px;margin-bottom:18px;position:relative}
.switch-btn{flex:1;padding:11px;border-radius:11px;font-size:14px;font-weight:600;
  color:var(--muted);transition:all var(--dur) var(--ease);position:relative;z-index:2}
.switch-btn.active{color:var(--blue)}
.switch-slider{position:absolute;top:4px;left:4px;width:calc(50% - 4px);
  height:calc(100% - 8px);background:var(--surface);border-radius:11px;
  box-shadow:var(--shadow);transition:transform var(--dur) var(--ease);z-index:1}
.switch[data-mode="register"] .switch-slider{transform:translateX(100%)}

.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:13px 15px;border:1.5px solid var(--line);
  border-radius:13px;font-size:15px;background:var(--surface-2);
  transition:all var(--dur) var(--ease);outline:none;color:var(--text)}
.field input:focus{border-color:var(--blue-2);background:var(--surface);
  box-shadow:0 0 0 4px rgba(24,120,245,.13)}
.error{color:var(--red);font-size:12.5px;min-height:16px;margin-bottom:6px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}

/* BUTTONS */
.btn{border-radius:13px;padding:12px 20px;font-size:14px;font-weight:600;
  transition:all var(--dur) var(--ease);display:inline-flex;align-items:center;
  justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn-primary{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;
  box-shadow:0 10px 24px rgba(11,94,215,.28),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);
  box-shadow:0 16px 32px rgba(11,94,215,.38)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-outline{background:var(--surface);border:1.5px solid var(--line);color:var(--blue)}
.btn-outline:hover:not(:disabled){border-color:var(--blue-2);background:var(--surface-2)}
.btn-ghost{color:var(--muted);padding:9px 12px}
.btn-ghost:hover{color:var(--blue);background:var(--surface-2)}
.btn-danger{background:var(--red-soft);color:var(--red);border:1.5px solid transparent}
.btn-gold{background:linear-gradient(135deg,#f0c668,#e8b84b);color:#4a2f00;
  box-shadow:0 10px 24px rgba(232,184,75,.35)}
.btn-gold:hover:not(:disabled){transform:translateY(-2px);
  box-shadow:0 16px 32px rgba(232,184,75,.45)}
.btn-block{width:100%}
.btn-sm{padding:8px 13px;font-size:12.5px;border-radius:10px}
.btn-lg{padding:15px 24px;font-size:15px;border-radius:15px}

/* APP */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid var(--line);
  padding-top:var(--safe-top)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-mark{width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--blue-2),var(--navy));display:grid;
  place-items:center;color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 8px 18px rgba(11,94,215,.3)}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text b{font-size:13px;letter-spacing:.6px;font-weight:800}
.brand-text span{font-size:8px;letter-spacing:3px;color:var(--blue-2);
  font-weight:700;margin-top:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.balance-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:6px 12px}
.balance-chip span{font-size:9.5px;color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.5px}
.balance-chip b{font-size:14px;color:var(--blue);font-variant-numeric:tabular-nums}
.icon-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  color:var(--text-2);transition:all var(--dur) var(--ease);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--blue)}
.badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;
  background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;
  place-items:center;padding:0 4px;border:2px solid var(--surface)}
.avatar{width:36px;height:36px;border-radius:11px;color:#fff;display:grid;
  place-items:center;font-weight:700;font-size:15px;flex:none;overflow:hidden}

.content{max-width:1200px;width:100%;margin:0 auto;padding:18px 16px 100px;flex:1}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + var(--safe-bot));
  display:flex;justify-content:space-around;gap:2px}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;border-radius:12px;color:var(--muted);font-size:10px;font-weight:600;
  transition:all var(--dur) var(--ease);position:relative;min-width:0}
.bnav-btn .icon{width:22px;height:22px}
.bnav-btn.active{color:var(--blue)}
.bnav-btn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:24px;height:3px;background:var(--blue);border-radius:0 0 3px 3px}
.bnav-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* PAGE */
.page-in{animation:pageIn .4s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stagger>*{animation:pageIn .5s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:0s}
.stagger>*:nth-child(2){animation-delay:.05s}
.stagger>*:nth-child(3){animation-delay:.1s}
.stagger>*:nth-child(4){animation-delay:.15s}
.stagger>*:nth-child(5){animation-delay:.2s}

.page-head{margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:flex-end;
  justify-content:space-between;gap:12px}
.page-head h2{font-size:22px;letter-spacing:-.5px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:5px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);transition:all var(--dur) var(--ease)}
.card:hover{box-shadow:0 14px 34px rgba(11,94,215,.11);transform:translateY(-2px)}
.muted{color:var(--muted)}
.small{font-size:12px}

/* HERO */
.hero{background:
  radial-gradient(900px 400px at 90% -30%,rgba(77,155,255,.42),transparent 60%),
  radial-gradient(600px 300px at 10% 130%,rgba(24,120,245,.35),transparent 60%),
  linear-gradient(120deg,#0a44a8 0%,#0b5ed7 40%,#031b45 100%);
  border-radius:22px;padding:22px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);margin-bottom:16px}
.hero::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at 70% 50%,#000,transparent 78%)}
.hero::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 68%);
  top:-180px;right:-100px}
.hero-inner{position:relative;z-index:2}
.hero-label{font-size:11px;opacity:.78;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.hero-balance{font-size:38px;font-weight:800;letter-spacing:-1.8px;margin:6px 0 4px;
  font-variant-numeric:tabular-nums}
.hero-sub{font-size:12.5px;opacity:.85;line-height:1.5}
.hero-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.hero-actions .btn{background:rgba(255,255,255,.14);color:#fff;
  border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(6px);padding:9px 14px;
  font-size:12.5px}
.hero-actions .btn:hover{background:rgba(255,255,255,.24)}
.hero-actions .btn.solid{background:#fff;color:var(--blue);border-color:#fff}

/* TAP-TO-EARN */
.tapper{position:relative;display:flex;flex-direction:column;align-items:center;
  gap:14px;padding:8px 0 4px}
.tap-coin{position:relative;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#ffe082,#f0b429 45%,#b8860b 80%);
  box-shadow:
    0 15px 40px rgba(240,180,41,.4),
    inset 0 -8px 20px rgba(0,0,0,.18),
    inset 0 8px 16px rgba(255,255,255,.5);
  display:grid;place-items:center;color:#4a2f00;font-weight:800;font-size:52px;
  cursor:pointer;transition:transform .08s;
  animation:coinPulse 3s ease infinite;
  will-change:transform;
}
@keyframes coinPulse{0%,100%{box-shadow:0 15px 40px rgba(240,180,41,.4),
  inset 0 -8px 20px rgba(0,0,0,.18),inset 0 8px 16px rgba(255,255,255,.5)}
  50%{box-shadow:0 20px 55px rgba(240,180,41,.55),
  inset 0 -8px 20px rgba(0,0,0,.18),inset 0 8px 16px rgba(255,255,255,.5)}}
.tap-coin:active{transform:scale(.94)}
.tap-coin::before{content:'';position:absolute;inset:14px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.5)}
.tap-coin::after{content:'₽';position:absolute;font-size:80px;
  color:rgba(74,47,0,.15);font-weight:900;pointer-events:none}
.tap-value{font-size:13px;color:var(--muted);font-weight:600}
.combo{font-size:14px;font-weight:800;color:var(--gold);min-height:20px;
  transition:all .3s var(--ease)}
.combo.fire{font-size:18px;text-shadow:0 0 12px rgba(232,184,75,.6);
  animation:comboPop .4s var(--ease)}
@keyframes comboPop{0%{transform:scale(.7)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.energy-wrap{width:100%;max-width:340px;margin-top:4px}
.energy-bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;
  border:1px solid var(--line)}
.energy-bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ffb340,#f59e0b);
  transition:width .3s var(--ease)}
.energy-lbl{display:flex;justify-content:space-between;font-size:11.5px;
  color:var(--muted);font-weight:600;margin-bottom:6px}
.tap-hint{font-size:11.5px;color:var(--muted);text-align:center;max-width:340px;line-height:1.5}

/* DAILY STREAK */
.streak{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.streak::-webkit-scrollbar{display:none}
.day{min-width:64px;flex:1;background:var(--surface-2);border:1.5px solid var(--line);
  border-radius:12px;padding:10px 6px;text-align:center;transition:all var(--dur) var(--ease)}
.day.done{background:linear-gradient(135deg,var(--green-soft),color-mix(in srgb,var(--green-soft) 70%,var(--surface)));
  border-color:transparent;color:var(--green)}
.day.today{border-color:var(--blue-2);background:var(--blue-soft);color:var(--blue);
  animation:dayPulse 1.6s ease infinite}
@keyframes dayPulse{0%,100%{box-shadow:0 0 0 0 rgba(24,120,245,.35)}
  50%{box-shadow:0 0 0 8px rgba(24,120,245,0)}}
.day .num{font-size:10px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.day .amt{font-size:12px;font-weight:800;margin-top:4px}
.day .ic{margin-bottom:4px}

/* ACHIEVEMENTS */
.ach{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:8px;
  transition:all var(--dur) var(--ease)}
.ach:hover{transform:translateX(3px)}
.ach.done{background:linear-gradient(135deg,var(--green-soft),color-mix(in srgb,var(--green-soft) 80%,var(--surface)));
  border-color:transparent}
.ach-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);color:var(--blue);flex:none;border:1px solid var(--line)}
.ach.done .ach-ico{background:var(--surface);color:var(--green)}
.ach-ico .icon{width:22px;height:22px}
.ach-body{flex:1;min-width:0}
.ach-body b{font-size:13.5px;font-weight:700;display:block}
.ach-body p{font-size:11.5px;color:var(--muted);margin-top:3px}
.ach-progress{height:5px;background:var(--surface);border-radius:99px;
  margin-top:6px;overflow:hidden;border:1px solid var(--line-2)}
.ach-progress i{display:block;height:100%;background:var(--blue);
  border-radius:99px;transition:width .5s var(--ease)}
.ach.done .ach-progress i{background:var(--green)}
.ach-reward{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
.ach.done .ach-reward{color:var(--green)}

/* RANK / LEADERBOARD */
.rank-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:13px;
  transition:all var(--dur) var(--ease);margin-bottom:4px}
.rank-row:hover{background:var(--surface-2)}
.rank-row.me{background:var(--blue-soft);border:1px solid var(--blue-2)}
.rank-pos{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  font-weight:800;font-size:13px;background:var(--surface-2);color:var(--muted);flex:none}
.rank-row:nth-child(1) .rank-pos{background:linear-gradient(135deg,#f0c668,#b8860b);color:#fff}
.rank-row:nth-child(2) .rank-pos{background:linear-gradient(135deg,#d1d5db,#6b7280);color:#fff}
.rank-row:nth-child(3) .rank-pos{background:linear-gradient(135deg,#d97706,#92400e);color:#fff}
.rank-name{flex:1;font-weight:700;font-size:13.5px}
.rank-val{font-weight:800;font-size:13.5px;color:var(--blue);
  font-variant-numeric:tabular-nums}

/* MISSIONS */
.mission{display:flex;gap:12px;align-items:center;padding:12px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:8px}
.mission .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  background:var(--purple-soft);color:var(--purple);flex:none}
.mission .body{flex:1;min-width:0}
.mission .body b{font-size:13px;display:block}
.mission .body p{font-size:11.5px;color:var(--muted);margin-top:2px}
.mission .rw{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}

/* REFERRAL */
.ref-card{background:linear-gradient(135deg,var(--purple-soft),var(--blue-soft));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;
  overflow:hidden}
.ref-card::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.15),transparent 70%);
  top:-100px;right:-80px}
.ref-link{display:flex;gap:8px;margin-top:12px;position:relative;z-index:2}
.ref-link input{flex:1;padding:11px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--surface);font-size:12.5px;font-family:monospace;outline:none;
  color:var(--text);min-width:0}

/* GIFTS */
.gift-item{display:flex;gap:12px;align-items:center;padding:13px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:8px}
.gift-item .ic{width:42px;height:42px;border-radius:12px;background:var(--gold-soft);
  color:var(--gold);display:grid;place-items:center;flex:none}
.gift-item .body{flex:1;min-width:0}
.gift-item .body b{font-size:13.5px;display:block}
.gift-item .body span{font-size:11.5px;color:var(--muted)}
.gift-item .amt{font-size:14px;font-weight:800;color:var(--gold);
  font-variant-numeric:tabular-nums}

/* STATS */
.stat{display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle,rgba(24,120,245,.08),transparent 70%);
  top:-40px;right:-30px;pointer-events:none}
.stat .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:var(--blue-soft);color:var(--blue);margin-bottom:4px}
.stat .ico .icon{width:17px;height:17px}
.stat .val{font-size:20px;font-weight:800;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600}

/* CARDS (realistic) */
.cards-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cc-wrap{display:flex;flex-direction:column;gap:12px}
.cc{position:relative;aspect-ratio:1.586;border-radius:18px;padding:20px 22px;
  color:#fff;overflow:hidden;box-shadow:0 20px 40px rgba(3,27,69,.35),
  inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease);
  display:flex;flex-direction:column;justify-content:space-between}
.cc:hover{transform:translateY(-4px) rotateX(3deg) rotateY(-2deg);
  box-shadow:0 30px 60px rgba(3,27,69,.45)}
.cc::before{content:'';position:absolute;inset:0;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 22px),
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.14),transparent 45%);
  pointer-events:none}
.cc::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);
  top:-130px;right:-90px;pointer-events:none}
.cc.classic{background:linear-gradient(135deg,#0a44a8,#1878f5 45%,#031b45)}
.cc.gold{background:linear-gradient(135deg,#7a5a12,#c99b3a 40%,#3d2c05)}
.cc.platinum{background:linear-gradient(135deg,#1e2530,#3c4759 45%,#0a0d15)}
.cc.quantum{background:linear-gradient(115deg,#0a44a8,#1878f5 30%,#4d9bff 50%,#0a44a8 70%,#031b45);
  background-size:200% 200%;animation:qShift 8s ease infinite}
@keyframes qShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.cc-brand{font-weight:800;letter-spacing:2.6px;font-size:13px}
.cc-brand small{display:block;font-size:8px;letter-spacing:2.8px;opacity:.7;font-weight:600;margin-top:2px}
.cc-contactless{width:22px;height:22px;opacity:.85}
.cc-mid{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.cc-chip{width:42px;height:32px;border-radius:6px;position:relative;
  background:linear-gradient(135deg,#f5d78e,#c99b3a 45%,#8b6517);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),inset 0 1px 2px rgba(255,255,255,.5)}
.cc-chip::before{content:'';position:absolute;inset:0;border-radius:6px;
  background-image:linear-gradient(90deg,transparent 48%,rgba(0,0,0,.35) 48% 52%,transparent 52%),
    linear-gradient(0deg,transparent 42%,rgba(0,0,0,.35) 42% 46%,transparent 46%),
    linear-gradient(0deg,transparent 58%,rgba(0,0,0,.35) 58% 62%,transparent 62%)}
.cc-num{font-size:18px;letter-spacing:2.4px;font-weight:600;position:relative;z-index:2;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.cc-num .grp{margin-right:12px}
.cc-holo{position:absolute;right:18px;bottom:56px;width:32px;height:32px;border-radius:50%;
  background:conic-gradient(from 0deg,#ffb1cc,#ffe082,#a7f3d0,#a5b4fc,#f0abfc,#ffb1cc);
  opacity:.65;box-shadow:inset 0 0 8px rgba(0,0,0,.15);z-index:2}
.cc-holo::after{content:'';position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%)}
.cc-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative;z-index:2}
.cc-holder,.cc-exp{display:flex;flex-direction:column;gap:3px;min-width:0}
.cc-holder span,.cc-exp span{font-size:8px;opacity:.7;letter-spacing:.7px;
  text-transform:uppercase;font-weight:700}
.cc-holder b,.cc-exp b{font-size:11.5px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cc-bal{font-size:12.5px;color:var(--muted);flex:1;min-width:110px}
.cc-bal b{color:var(--text);font-size:14px;font-variant-numeric:tabular-nums}

/* JOBS */
.job-card{text-align:center;display:flex;flex-direction:column;gap:7px}
.job-icon{width:54px;height:54px;margin:0 auto 4px;border-radius:15px;
  background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;
  transition:transform .4s var(--ease)}
.job-icon .icon{width:26px;height:26px}
.job-card:hover .job-icon{transform:scale(1.08) rotate(-4deg)}
.job-card h3{font-size:15px;font-weight:700}
.job-card .cd{font-size:12px;color:var(--blue);font-weight:600;min-height:16px}
.job-card.locked{opacity:.65}
.lock{font-size:12px;color:var(--muted);font-weight:600;padding:10px;
  background:var(--surface-2);border-radius:11px;display:flex;align-items:center;
  justify-content:center;gap:6px}

/* BUSINESS */
.biz-card{display:flex;flex-direction:column;gap:10px}
.biz-head{display:flex;align-items:center;gap:12px}
.biz-ico{width:46px;height:46px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,var(--blue-soft),color-mix(in srgb,var(--blue-soft) 60%,var(--surface)));
  color:var(--blue);display:grid;place-items:center;transition:transform .4s var(--ease)}
.biz-ico .icon{width:22px;height:22px}
.biz-head h3{font-size:15px;font-weight:700}
.biz-head p{font-size:11.5px;color:var(--muted);margin-top:2px}
.biz-lvl{display:flex;gap:3px;margin-left:auto}
.biz-lvl i{width:12px;height:5px;border-radius:2px;background:var(--line)}
.biz-lvl i.on{background:linear-gradient(90deg,var(--blue-2),var(--blue))}
.biz-acc{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;
  padding:10px 14px;font-size:12.5px;display:flex;justify-content:space-between;
  align-items:center}
.biz-acc b{color:var(--blue);font-size:14px;font-variant-numeric:tabular-nums}
.biz-acc.pulse{border-color:var(--blue-2);background:var(--blue-soft)}
.biz-row{display:flex;gap:6px;flex-wrap:wrap}
.biz-row .btn{flex:1;min-width:0;padding:9px 12px;font-size:12px}
.emp-list{display:flex;flex-direction:column;gap:5px}
.emp{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line-2);font-size:12px}
.emp.hired{background:var(--green-soft);border-color:transparent}
.emp .icon{width:15px;height:15px;color:var(--blue)}
.emp.hired .icon{color:var(--green)}
.emp b{font-weight:700}
.emp .price{margin-left:auto;font-weight:700;color:var(--blue);font-size:11.5px}
.emp.hired .price{color:var(--green)}

/* LISTS */
.list{padding:5px}
.row{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;
  transition:all var(--dur) var(--ease)}
.row:hover{background:var(--surface-2);transform:translateX(3px)}
.row+.row{border-top:1px solid var(--line-2)}
.row-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.row-icon .icon{width:17px;height:17px}
.row-icon.plus{background:var(--green-soft);color:var(--green)}
.row-icon.minus{background:var(--red-soft);color:var(--red)}
.row-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row-main b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main span{font-size:11px;color:var(--muted)}
.row-amount{font-weight:700;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row-amount.plus{color:var(--green)}
.row-amount.minus{color:var(--red)}

.empty{text-align:center;padding:44px 20px;color:var(--muted);
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.empty .icon{width:40px;height:40px;opacity:.4;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.6}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(3,27,69,.5);backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:100;padding:16px;
  padding-bottom:calc(16px + var(--safe-bot));animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);border-radius:22px;padding:26px;width:100%;
  max-width:400px;box-shadow:var(--shadow-lg);animation:modalIn .32s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.modal-box h3{font-size:16px;margin-bottom:16px;font-weight:700}
.modal-box input{width:100%;padding:14px 16px;border:1.5px solid var(--line);
  border-radius:13px;font-size:16px;outline:none;background:var(--surface-2);
  transition:all var(--dur) var(--ease);color:var(--text)}
.modal-box input:focus{border-color:var(--blue-2);background:var(--surface);
  box-shadow:0 0 0 4px rgba(24,120,245,.13)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}

/* TOASTS */
.toasts{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(76px + var(--safe-bot));display:flex;flex-direction:column;
  gap:8px;z-index:200;pointer-events:none;max-width:calc(100vw - 24px);
  align-items:center}
.toast{background:var(--surface);border:1px solid var(--line);
  padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);animation:toastIn .3s var(--ease);
  display:flex;align-items:center;gap:9px;pointer-events:auto;max-width:100%}
.toast .icon{width:17px;height:17px;color:var(--blue)}
.toast.ok{border-left:4px solid var(--green)}
.toast.ok .icon{color:var(--green)}
.toast.err{border-left:4px solid var(--red)}
.toast.err .icon{color:var(--red)}
.toast.out{opacity:0;transform:translateY(12px);transition:all .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:none}}

/* MONEY FLOAT */
.money-float{position:fixed;pointer-events:none;font-weight:800;font-size:22px;
  color:var(--green);z-index:250;text-shadow:0 2px 10px rgba(15,168,106,.4);
  animation:floatUp 1.4s var(--ease) forwards}
.money-float.neg{color:var(--red)}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}
  25%{opacity:1;transform:translateY(-20px) scale(1.15)}
  100%{opacity:0;transform:translateY(-100px) scale(1)}}

/* CASE REWARD */
.case-reward{text-align:center;padding:22px}
.case-box{width:100px;height:100px;margin:0 auto 16px;border-radius:20px;
  background:linear-gradient(135deg,#f0c668,#b8860b);display:grid;place-items:center;
  color:#fff;box-shadow:0 20px 50px rgba(232,184,75,.5);
  animation:caseShake .6s var(--ease) infinite alternate}
@keyframes caseShake{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.06)}}
.case-box .icon{width:48px;height:48px}
.case-title{font-size:15px;font-weight:700;margin-bottom:6px}
.case-amount{font-size:34px;font-weight:800;color:var(--gold);letter-spacing:-1px;
  margin:8px 0 4px;font-variant-numeric:tabular-nums}
.case-sub{font-size:12.5px;color:var(--muted)}

/* NOTIF PANEL */
.notif-panel{position:fixed;top:calc(56px + var(--safe-top));right:16px;
  width:340px;max-width:calc(100vw - 32px);max-height:70vh;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);
  z-index:60;display:flex;flex-direction:column;overflow:hidden;
  animation:notifIn .28s var(--ease)}
@keyframes notifIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.notif-head{padding:13px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between}
.notif-head h4{font-size:13.5px;font-weight:700}
.notif-list{overflow-y:auto;flex:1;padding:5px}
.notif-item{padding:10px 13px;border-radius:11px;display:flex;gap:10px;align-items:flex-start}
.notif-item:hover{background:var(--surface-2)}
.notif-item .icon{width:17px;height:17px;margin-top:2px;color:var(--blue);flex:none}
.notif-item .body{flex:1;min-width:0}
.notif-item .body b{font-size:12.5px;font-weight:600;display:block}
.notif-item .body span{font-size:11px;color:var(--muted);display:block;margin-top:2px;line-height:1.5}
.notif-item .body em{font-size:10px;color:var(--muted);font-style:normal;
  display:block;margin-top:3px;opacity:.7}
.notif-empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:12.5px}

/* SETTINGS */
.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line-2)}
.set-row:last-child{border-bottom:none}
.set-row .icon{color:var(--blue);width:18px;height:18px}
.set-row .lbl{flex:1;font-size:13px;font-weight:600}
.set-row .lbl small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.toggle{width:42px;height:25px;border-radius:13px;background:var(--line);
  position:relative;transition:background var(--dur) var(--ease);flex:none}
.toggle::after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;
  background:#fff;top:3px;left:3px;transition:transform var(--dur) var(--ease);
  box-shadow:0 2px 5px rgba(0,0,0,.2)}
.toggle.on{background:var(--blue-2)}
.toggle.on::after{transform:translateX(17px)}
.avatar-grid{display:flex;gap:6px;flex-wrap:wrap}
.av-pick{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:16px;cursor:pointer;
  transition:all var(--dur) var(--ease);border:2px solid transparent}
.av-pick:hover{transform:scale(1.08)}
.av-pick.sel{border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(24,120,245,.2)}
.lang-grid{display:flex;gap:6px}
.lang-btn{padding:7px 13px;border-radius:10px;background:var(--surface-2);
  border:1.5px solid var(--line);font-size:12px;font-weight:700;
  transition:all var(--dur) var(--ease)}
.lang-btn.active{background:var(--blue-soft);border-color:var(--blue-2);color:var(--blue)}

/* MODAL FULL (case) */
.modal-full{background:var(--surface);border-radius:24px;padding:0;width:100%;
  max-width:360px;box-shadow:var(--shadow-lg);overflow:hidden;
  animation:modalIn .35s var(--ease)}

/* RESPONSIVE */
@media (max-width:480px){
  .brand-text{display:none}
  .content{padding:14px 12px 100px}
  .hero-balance{font-size:32px}
  .hero{padding:18px}
  .cc-num{font-size:15px;letter-spacing:2px}
  .cc{padding:16px 18px}
  .cc-chip{width:36px;height:28px}
  .cc-holder b,.cc-exp b{font-size:10.5px}
  .cards-grid{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .card{padding:14px}
  .tap-coin{width:160px;height:160px}
  .tap-coin::after{font-size:70px}
  .bnav-btn{font-size:9px}
  .bnav-btn .icon{width:20px;height:20px}
}
@media (min-width:900px){
  .bottom-nav{display:none}
  .content{padding-bottom:40px}
}
</style>

/* ========== Crypto ========== */
async function sha256(str){
  try{
    const buf = new TextEncoder().encode(str);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; }
    return 'fb'+Math.abs(h).toString(16);
  }
}

/* ========== Sound ========== */
let actx = null;
function beep(freq, dur, type, vol){
  if(!settings.sound) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.value = vol||.05;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur||.12));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (dur||.12));
  }catch(e){}
}

           maxBalance:0, maxStreak:0, maxLevel:1},

    // Gifts created

function ensureUserFields(u){
  u.stats = u.stats || {worksCount:0, taps:0, bizCount:0, cardsCount:0, transfersCount:0,
    maxBalance:0, maxStreak:0, maxLevel:1};
  u.achievements = u.achievements || {};
  u.tap = u.tap || {energy:100, energyMax:100, combo:0, lastTap:0, lastEnergyRegen:Date.now()};
  u.giftsSent = u.giftsSent || [];
  u.giftsClaimed = u.giftsClaimed || [];
  u.notifications = u.notifications || [];
  u.events = u.events || [];
  u.refCode = u.refCode || Math.random().toString(36).slice(2,8);
  u.referrals = u.referrals || [];
  u.balanceHistory = u.balanceHistory || [{t:Date.now(), v:u.balance}];
  u.streak = u.streak || 0;
  u.streakWeekStart = u.streakWeekStart || 0;
}
function pushNotif(u, title, body, icon){
  u.notifications.unshift({id:'n'+Date.now()+Math.random().toString(16).slice(2,6),
    title, body, icon:icon||'i-info', t:Date.now(), read:false});
  if(u.notifications.length>60) u.notifications.length = 60;
  if(currentUser === Object.keys(db.users).find(k=>db.users[k]===u)) updateBell();
}
function recordBalance(u){
  const now = Date.now();
  u.balanceHistory.push({t:now, v:u.balance});
  if(u.balanceHistory.length>200) u.balanceHistory.shift();
  if(u.balance > (u.stats.maxBalance||0)) u.stats.maxBalance = u.balance;
}
function addMoney(u, amount, title, opts){
  opts = opts||{};
  u.balance += amount;
  if(amount>0 && opts.countEarned!==false) u.totalEarned = (u.totalEarned||0)+amount;
  u.history.unshift({t:Date.now(), title, amount});
  if(u.history.length>300) u.history.length = 300;
  recordBalance(u);
}
function bumpStat(u, key, by){
  u.stats[key] = (u.stats[key]||0) + (by||1);
}
function checkLevelUp(u){
  const lvl = getLevel(u);
  const prevLvl = u.stats.maxLevel || 1;
  if(lvl > prevLvl){
    u.stats.maxLevel = lvl;
    for(let i = prevLvl+1; i <= lvl; i++){
      // Grant case
      setTimeout(()=>showCaseReward(u, i), 200);
    }
    return true;
  }
  return false;
}
function checkAchievements(u){
  const newly = [];
  ACHS.forEach(a => {
    if(u.achievements[a.id]) return;
    const cur = u.stats[a.field] || 0;
    if(cur >= a.goal){
      newly.push(a);
    }
  });
  return newly;
}
function grantAchievement(u, a){
  u.achievements[a.id] = Date.now();
  addMoney(u, a.reward, 'Достижение: ' + a.name);
  pushNotif(u, t('newAchievement'), a.name + ' +' + fmt(a.reward), 'i-trophy');
}

/* ========== Tap game ========== */
function updateEnergy(u, now){
  const tap = u.tap;
  const regenRate = 5; // per second
  const elapsed = (now - tap.lastEnergyRegen) / 1000;
  if(elapsed > 0){
    tap.energy = Math.min(tap.energyMax, tap.energy + elapsed * regenRate);
    tap.lastEnergyRegen = now;
  }
}
function doTap(){
  const u = getUser(); if(!u) return;
  const now = Date.now();
  updateEnergy(u, now);
  if(u.tap.energy < 1){
    S.err(); haptic('rigid');
    return;
  }
  u.tap.energy -= 1;
  // Combo: taps within 1.2s
  if(now - u.tap.lastTap < 1200) u.tap.combo = Math.min(5, u.tap.combo + 1);
  else u.tap.combo = 1;
  u.tap.lastTap = now;

  const lvl = getLevel(u);
  const base = 5 + lvl * 2;
  const comboMult = 1 + (u.tap.combo-1) * 0.5; // ×1 to ×3
  const amount = Math.round(base * comboMult);
  addMoney(u, amount, 'Тап-заработок');
  bumpStat(u, 'taps');
  saveDB();

  // Float animation
  const cx = window.innerWidth/2 + rand(-60,60);
  const cy = window.innerHeight/2 - 40 + rand(-40,40);
  moneyFloat(amount, cx, cy);

  S.tap();
  haptic('light');

  // Update UI tap value
  const tapValEl = document.getElementById('tapValue');
  if(tapValEl) tapValEl.textContent = '+' + fmt(amount);
  const comboEl = document.getElementById('comboEl');
  if(comboEl){
    if(u.tap.combo >= 3){
      comboEl.textContent = '🔥 COMBO ×' + u.tap.combo;
      comboEl.classList.add('fire');
      S.combo();
    }else if(u.tap.combo > 1){
      comboEl.textContent = 'COMBO ×' + u.tap.combo;
      comboEl.classList.remove('fire');
    }else{
      comboEl.textContent = '';
      comboEl.classList.remove('fire');
    }
  }
  updateEnergyUI(u);
  updateTopBalance();
  // Achievement & level check
  const newA = checkAchievements(u);
  newA.forEach(a => { grantAchievement(u, a); toast(t('newAchievement') + ' ' + a.name, 'ok'); });
  if(checkLevelUp(u)) saveDB();
}
function updateEnergyUI(u){
  updateEnergy(u, Date.now());
  const bar = document.getElementById('energyBar');
  const lbl = document.getElementById('energyLbl');
  if(bar) bar.style.width = (u.tap.energy / u.tap.energyMax * 100) + '%';
  if(lbl) lbl.textContent = Math.floor(u.tap.energy) + ' / ' + u.tap.energyMax;
  if(!bar) return;
}

function updateTopBalance(){
  const u = getUser(); if(!u) return;
  const el = document.getElementById('balanceTop');
  animateBalance(el, lastBalance, u.balance, 400);
  lastBalance = u.balance;
}
function animateBalance(el, from, to, dur){
  if(balanceAnim.raf) cancelAnimationFrame(balanceAnim.raf);
  const start = performance.now();
  const step = now => {
    const p = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = fmt(from + (to-from)*eased);
    if(p<1) balanceAnim.raf = requestAnimationFrame(step);
    else balanceAnim.raf = null;
  };
  balanceAnim.raf = requestAnimationFrame(step);
}
function renderApp(animate){
  const u = getUser();

  ensureUserFields(u);

}

/* ---------- BUSINESS ---------- */
function bizDef(id){ return BUSINESSES.find(b=>b.id===id); }
function bizAccum(b, now){
  const def = bizDef(b.type); if(!def) return 0;
  const lvlMult = 1 + 0.35*(b.level-1);
  const empMult = b.employees.marketer ? 1.25 : 1;
  let periods = Math.floor((now - b.lastCollect) / def.period);
  const maxP = Math.floor((12*3600000)/def.period);
  if(periods > maxP) periods = maxP;
  return Math.round(periods * def.income * lvlMult * empMult);
}
function upgradeCost(b){
  const def = bizDef(b.type);
  return Math.round(def.cost * Math.pow(1.7, b.level-1));
}
function viewBusiness(u){
  const now = Date.now();
  const totalAcc = u.businesses.reduce((s,b)=>s+bizAccum(b,now),0);

/* ---------- Daily streak ---------- */
function claimDaily(){
  const u = getUser(); if(!u) return;
  const today = dayKey(Date.now());
  const lastKey = u.lastDaily ? dayKey(u.lastDaily) : null;
  if(lastKey === today){ toast(t('dailyWait'),'err'); return; }
  // Check if yesterday
  const yest = dayKey(Date.now() - 86400000);
  if(lastKey === yest) u.streak = Math.min(7, (u.streak||0) + 1);
  else u.streak = 1;
  u.streak = Math.max(1, Math.min(7, u.streak));
  const dayIdx = u.streak - 1;
  const amount = STREAK[dayIdx] || STREAK[0];
  u.lastDaily = Date.now();
  addMoney(u, amount, t('streak') + ' ' + t('day') + ' ' + u.streak);
  if(u.streak > (u.stats.maxStreak||0)) u.stats.maxStreak = u.streak;
  saveDB(); renderApp(false);
  moneyFloat(amount);
  toast('+'+fmt(amount) + ' 🔥', 'ok');
  S.cash(); hapticNotify('success');
}

/* ---------- Achievements ---------- */
function claimAchOne(id){
  const u = getUser(); if(!u) return;
  const a = ACHS.find(x=>x.id===id); if(!a) return;
  if(u.achievements[a.id]) return;
  const cur = u.stats[a.field] || 0;
  if(cur < a.goal) return;
  grantAchievement(u, a);
  saveDB(); renderApp(false);
  toast(t('newAchievement') + ' ' + a.name, 'ok'); S.levelUp();
}
function claimAllAch(){
  const u = getUser(); if(!u) return;
  const list = checkAchievements(u);
  if(!list.length) return;
  let total = 0;
  list.forEach(a => { u.achievements[a.id] = Date.now(); total += a.reward; });
  addMoney(u, total, t('achievements'));
  saveDB(); renderApp(false);
  moneyFloat(total);
  toast('+' + fmt(total), 'ok'); S.levelUp();
}

/* ---------- Work ---------- */
function doWork(id){
  const u = getUser();
  const job = JOBS.find(j=>j.id===id); if(!job) return;
  if(getLevel(u) < job.minLevel){ toast(t('errLevel'),'err'); S.err(); return; }
  const now = Date.now();
  if(now - (u.lastWork[id]||0) < job.cd){ toast(t('errCooldown'),'err'); S.err(); return; }
  const amount = rand(job.pay[0], job.pay[1]);
  u.lastWork[id] = now;
  addMoney(u, amount, job.name);
  bumpStat(u, 'worksCount');
  const newA = checkAchievements(u);
  newA.forEach(a => { grantAchievement(u, a); });
  checkLevelUp(u);
  saveDB(); renderApp(false);
  moneyFloat(amount);
  toast('+'+fmt(amount),'ok'); S.cash(); hapticNotify('success');
}

/* ---------- Cards ---------- */
function openNewCard(){
  const u = getUser();
  if(u.cards.length >= 6){ toast(t('limitCards'),'err'); return; }
  // Choose best affordable type
  let chosen = CARD_TYPES[0];
  for(const ct of CARD_TYPES) if(u.balance >= ct.cost) chosen = ct;
  if(chosen.cost > u.balance){ toast(t('errFunds'),'err'); S.err(); return; }
  if(chosen.cost > 0){
    confirmDlg('Выпуск карты ' + chosen.name, 'Стоимость: ' + fmt(chosen.cost)).then(ok => {
      if(!ok) return;
      finalizeCard(u, chosen);
    });
  }else{
    finalizeCard(u, chosen);
  }
}
function finalizeCard(u, chosen){
  if(u.balance < chosen.cost){ toast(t('errFunds'),'err'); return; }
  if(chosen.cost>0) u.balance -= chosen.cost;
  let num = chosen.prefix;
  while(num.length < 16) num += Math.floor(Math.random()*10);
  num = num.replace(/(.{4})/g,'$1 ').trim();
  const d = new Date();
  const expiry = String(d.getMonth()+1).padStart(2,'0') + '/' + String((d.getFullYear()+4)%100).padStart(2,'0');
  u.cards.push({
    id:'c'+Date.now()+Math.random().toString(16).slice(2,6),
    type:chosen.id, number:num, expiry,
    cvv:String(rand(100,999)), cvvRevealed:false,
    balance:0, created:Date.now()
  });
  bumpStat(u, 'cardsCount');
  addMoney(u, 0, 'Выпущена карта ' + chosen.name, {countEarned:false});
  const newA = checkAchievements(u);
  newA.forEach(a => grantAchievement(u, a));
  saveDB(); renderApp(false);
  toast(t('okCard'),'ok'); S.ok(); hapticNotify('success');
}
async function cardTopup(id){
  const u = getUser();
  const c = u.cards.find(x=>x.id===id); if(!c) return;
  const amt = await askAmount(t('topup'));
  if(amt===null) return;
  if(!(amt>0)){ toast(t('errAmount'),'err'); S.err(); return; }
  if(amt > u.balance){ toast(t('errFunds'),'err'); S.err(); return; }
  u.balance -= amt; c.balance += amt;
  addMoney(u, 0, t('topup')+' •'+c.number.slice(-4), {countEarned:false});
  saveDB(); renderApp(false); toast(t('topup'),'ok'); S.cash();
}
async function cardWithdraw(id){
  const u = getUser();
  const c = u.cards.find(x=>x.id===id); if(!c) return;
  const amt = await askAmount(t('withdraw'));
  if(amt===null) return;
  if(!(amt>0)){ toast(t('errAmount'),'err'); S.err(); return; }
  if(amt > c.balance){ toast(t('errFunds'),'err'); S.err(); return; }
  c.balance -= amt; u.balance += amt;
  addMoney(u, 0, t('withdraw')+' •'+c.number.slice(-4), {countEarned:false});
  saveDB(); renderApp(false); toast(t('withdraw'),'ok'); S.cash();
}
function cardDelete(id){
  const u = getUser();
  const i = u.cards.findIndex(x=>x.id===id); if(i<0) return;
  confirmDlg('Удалить карту?', '•' + u.cards[i].number.slice(-4) + ' · Остаток вернётся на счёт').then(ok => {
    if(!ok) return;
    u.balance += u.cards[i].balance;
    u.cards.splice(i,1);
    saveDB(); renderApp(false);
  });
}

/* ---------- Business ---------- */
function buyBiz(type){
  const u = getUser();
  const def = bizDef(type); if(!def) return;
  if(u.balance < def.cost){ toast(t('errFunds'),'err'); S.err(); return; }
  u.balance -= def.cost;
  u.businesses.push({
    id:'b'+Date.now()+Math.random().toString(16).slice(2,5),
    type, level:1, boughtAt:Date.now(), lastCollect:Date.now(),
    employees:{manager:false,marketer:false,security:false}
  });
  bumpStat(u, 'bizCount');
  addMoney(u, 0, 'Открыт: ' + def.name, {countEarned:false});
  const newA = checkAchievements(u);
  newA.forEach(a => grantAchievement(u, a));
  saveDB(); renderApp(false);
  toast(def.name + ' ✓','ok'); S.ok(); hapticNotify('success');
}
function upgradeBiz(id){
  const u = getUser();
  const b = u.businesses.find(x=>x.id===id); if(!b || b.level >= 5) return;
  const cost = upgradeCost(b);
  if(u.balance < cost){ toast(t('errFunds'),'err'); S.err(); return; }
  u.balance -= cost;
  b.level += 1;
  addMoney(u, 0, 'Улучшено до Lv.' + b.level, {countEarned:false});
  saveDB(); renderApp(false);
  toast('Lv.' + b.level + ' ✓','ok'); S.ok();
}
function hireEmp(bid, empId){
  const u = getUser();
  const b = u.businesses.find(x=>x.id===bid); if(!b) return;
  const e = EMPLOYEES.find(x=>x.id===empId); if(!e) return;
  if(b.employees[empId]) return;
  if(u.balance < e.cost){ toast(t('errFunds'),'err'); S.err(); return; }
  u.balance -= e.cost;
  b.employees[empId] = true;
  addMoney(u, 0, e.name + ' нанят', {countEarned:false});
  saveDB(); renderApp(false);
  toast(e.name + ' ✓','ok'); S.ok();
}
function collectBiz(id){
  const u = getUser();
  const b = u.businesses.find(x=>x.id===id); if(!b) return;
  const now = Date.now();
  const def = bizDef(b.type);
  let periods = Math.floor((now - b.lastCollect)/def.period);
  const maxP = Math.floor((12*3600000)/def.period);
  if(periods > maxP) periods = maxP;
  if(periods <= 0){ toast(t('errCooldown'),'err'); return; }
  const lvlMult = 1 + 0.35*(b.level-1);
  const empMult = b.employees.marketer ? 1.25 : 1;
  const amount = Math.round(periods * def.income * lvlMult * empMult);
  b.lastCollect += periods * def.period;
  addMoney(u, amount, 'Доход: ' + def.name);
  saveDB(); renderApp(false);
  moneyFloat(amount);
  toast('+'+fmt(amount),'ok'); S.cash();
}
function collectAll(){
  const u = getUser();
  const now = Date.now();
  let total = 0;
  u.businesses.forEach(b => {
    const def = bizDef(b.type);
    let periods = Math.floor((now - b.lastCollect)/def.period);
    const maxP = Math.floor((12*3600000)/def.period);
    if(periods > maxP) periods = maxP;
    if(periods > 0){
      const lvlMult = 1 + 0.35*(b.level-1);
      const empMult = b.employees.marketer ? 1.25 : 1;
      total += Math.round(periods * def.income * lvlMult * empMult);
      b.lastCollect += periods * def.period;
    }
  });
  if(total <= 0){ toast(t('errCooldown'),'err'); return; }
  addMoney(u, total, 'Доход со всех бизнесов');
  saveDB(); renderApp(false);
  moneyFloat(total); toast('+'+fmt(total),'ok'); S.cash();
}

/* ---------- Transfer ---------- */
function doTransfer(){
  const u = getUser();
  const loginEl = document.getElementById('trLogin');
  const amtEl = document.getElementById('trAmount');
  const errBox = document.getElementById('trError');
  if(!loginEl||!amtEl) return;
  errBox.textContent = '';
  const login = loginEl.value.trim().toLowerCase();
  const amount = parseFloat(amtEl.value);
  if(!login){ errBox.textContent = t('errUser'); return; }
  if(login === currentUser){ errBox.textContent = t('errSelf'); S.err(); return; }
  const to = db.users[login];
  if(!to){ errBox.textContent = t('errUser'); S.err(); return; }
  if(!(amount>0)){ errBox.textContent = t('errAmount'); S.err(); return; }
  if(amount > u.balance){ errBox.textContent = t('errFunds'); S.err(); return; }
  u.balance -= amount;
  u.history.unshift({t:Date.now(), title:'→ ' + to.login, amount:-amount});
  recordBalance(u);
  to.balance += amount;
  to.totalEarned = (to.totalEarned||0) + amount;
  to.history.unshift({t:Date.now(), title:'← ' + u.login, amount});
  recordBalance(to);
  pushNotif(to, '💰 Перевод', u.login + ' · +' + fmt(amount), 'i-coin');
  bumpStat(u, 'transfersCount');
  const newA = checkAchievements(u);
  newA.forEach(a => grantAchievement(u, a));
  saveDB(); renderApp(false);
  toast(t('sendMoney') + ' ✓','ok'); S.cash(); hapticNotify('success');
  loginEl.value=''; amtEl.value='';
}

/* ---------- Gifts ---------- */
async function createGift(){
  const u = getUser();
  const amt = await askAmount(t('createGift'));
  if(amt===null) return;
  if(!(amt>0)){ toast(t('errAmount'),'err'); S.err(); return; }
  if(amt > u.balance){ toast(t('errFunds'),'err'); S.err(); return; }
  u.balance -= amt;
  recordBalance(u);
  const gift = {
    id:'g' + Date.now() + Math.random().toString(36).slice(2,7),
    amount: amt, t: Date.now(), from: u.login, claimed: false, to: null
  };
  u.giftsSent.push(gift);
  u.history.unshift({t:Date.now(), title:'🎁 Подарок создан', amount:-amt});
  saveDB(); renderApp(false);
  shareGift(gift.id);
}
function shareGift(giftId){
  const u = getUser();
  const g = u.giftsSent.find(x=>x.id===giftId); if(!g) return;
  const link = location.origin + location.pathname + '?gift=' + g.id + '&from=' + encodeURIComponent(u.login) + '&amt=' + g.amount;
  const text = `🎁 ${u.login} дарит тебе ${fmt(g.amount)} в Kvantum Bank! Открой приложение и забери подарок.`;
  shareToTelegram(text, link);
  haptic('medium');
}
function checkIncomingGift(){
  const params = new URLSearchParams(location.search);
  const giftId = params.get('gift');
  const fromLogin = params.get('from');
  const amount = parseFloat(params.get('amt'));
  if(!giftId || !fromLogin || !(amount>0)) return;
  // Wait for user to be logged in
  setTimeout(() => {
    const u = getUser(); if(!u) return;
    if(u.login === fromLogin){ toast('Нельзя забрать свой подарок','err'); return; }
    if(u.giftsClaimed.includes(giftId)){ toast(t('alreadyClaimed'),'err'); return; }
    u.giftsClaimed.push(giftId);
    addMoney(u, amount, '🎁 Подарок от ' + fromLogin);
    pushNotif(u, '🎁 Подарок', 'От ' + fromLogin + ' · +' + fmt(amount), 'i-gift');
    saveDB(); renderApp(false);
    moneyFloat(amount);
    toast('🎁 +' + fmt(amount),'ok'); S.levelUp(); hapticNotify('success');
    // Clear URL
    try{ history.replaceState({}, '', location.pathname); }catch(e){}
  }, 1500);
}

/* ---------- Referral ---------- */
function copyRef(){
  const u = getUser();
  const link = getRefLink(u);
  navigator.clipboard?.writeText(link).then(()=>{ toast(t('copied'),'ok'); haptic(); }).catch(()=>{
    const inp = document.getElementById('refLink'); if(inp){ inp.select(); document.execCommand('copy'); toast(t('copied'),'ok'); }
  });
}
function shareRef(){
  const u = getUser();
  const link = getRefLink(u);
  const text = `💰 Заходи в Kvantum Bank! Получи 1000 ₽ на старт. Мой код: ${u.refCode}`;
  shareToTelegram(text, link);
  haptic('medium');
}
function applyReferral(){
  const params = new URLSearchParams(location.search);
  const ref = params.get('ref'); if(!ref) return;
  sessionStorage.setItem('kv_pending_ref', ref);
}

/* ---------- Notifications ---------- */
function toggleBell(){
  const panel = document.getElementById('notifPanel');
  panel.classList.toggle('hidden');
  if(!panel.classList.contains('hidden')){
    const u = getUser();
    if(u){ u.notifications.forEach(n => n.read = true); saveDB(); updateBell(); }
    renderNotifs();
  }
}
function updateBell(){
  const u = getUser();
  const badge = document.getElementById('bellBadge');
  if(!u){ badge.classList.add('hidden'); return; }
  const unread = (u.notifications||[]).filter(n=>!n.read).length;
  if(unread > 0){ badge.textContent = unread > 9 ? '9+' : unread; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}
function renderNotifs(){
  const u = getUser();
  const list = document.getElementById('notifList');
  if(!u || !u.notifications.length){
    list.innerHTML = `<div class="notif-empty">${t('emptyNotifs')}</div>`;
    return;
  }
  list.innerHTML = u.notifications.map(n => `
    <div class="notif-item ${n.read?'':'unread'}">
      <svg class="icon"><use href="#${n.icon||'i-info'}"/></svg>
      <div class="body"><b>${esc(n.title)}</b><span>${esc(n.body)}</span><em>${dateStr(n.t)}</em></div>
    </div>`).join('');
}
document.addEventListener('click', e => {
  const panel = document.getElementById('notifPanel');
  if(panel.classList.contains('hidden')) return;
  if(e.target.closest('#notifPanel')) return;
  if(e.target.closest('#bellBtn')) return;
  panel.classList.add('hidden');
});

/* ---------- Export / Import ---------- */
function exportSave(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'kvantum-save.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast(t('exportSave') + ' ✓','ok');
}
document.addEventListener('change', e => {
  if(e.target.id !== 'importFile') return;
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.users) throw new Error();
      db = data; saveDB();
      if(currentUser && db.users[currentUser]) renderApp(false);
      else logout();
      toast(t('importSave') + ' ✓','ok');
    }catch(err){ toast('Invalid file','err'); S.err(); }
  };
  r.readAsText(f);
});

/* ---------- Auto-manager ---------- */
setInterval(() => {
  const u = getUser(); if(!u) return;
  const now = Date.now();
  let total = 0;
  u.businesses.forEach(b => {
    if(b.employees.manager){
      const acc = bizAccum(b, now);
      if(acc > 0){
        const def = bizDef(b.type);
        const periods = Math.floor((now - b.lastCollect)/def.period);
        b.lastCollect += periods * def.period;
        total += acc;
      }
    }
  });
  if(total > 0){
    u.balance += total;
    u.totalEarned = (u.totalEarned||0) + total;
    u.history.unshift({t:now, title:'Менеджер собрал', amount:total});
    recordBalance(u);
    pushNotif(u, 'Автосбор', '+' + fmt(total), 'i-coin');
    saveDB();
    if(activeTab === 'home' || activeTab === 'business') renderApp(false);
    moneyFloat(total);
    hapticNotify('success');
  }
}, 20000);

/* ---------- Tick ---------- */
function tick(){
  const u = getUser(); if(!u) return;
  const now = Date.now();
  if(activeTab === 'earn'){
    JOBS.forEach(j => {
      const btn = document.getElementById('jobbtn-'+j.id);
      const cd = document.getElementById('jobcd-'+j.id);
      if(!btn||!cd) return;
      const left = j.cd - (now - (u.lastWork[j.id]||0));
      if(left > 0){ btn.disabled = true; cd.textContent = '⏳ '+Math.ceil(left/1000)+'s'; }
      else{ btn.disabled = false; cd.textContent = ''; }
    });
  }
  if(activeTab === 'business'){
    u.businesses.forEach(b => {
      const box = document.getElementById('bizacc-'+b.id);
      if(!box) return;
      const acc = bizAccum(b, now);
      box.innerHTML = `<span class="muted">${t('accumulated')}</span><b>${fmt(acc)}</b>`;
      const btn = document.querySelector(`[data-action="collect"][data-id="${b.id}"]`);
      if(btn) btn.disabled = acc <= 0;
    });
  }
}
setInterval(tick, 1000);

/* ---------- Auth ---------- */
function startSession(key){
  currentUser = key;
  localStorage.setItem(SES_KEY, key);
  ensureUserFields(db.users[key]);
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('authLogin').value = '';
  document.getElementById('authPass').value = '';
  activeTab = 'home';
  renderApp(true);
  saveDB();
}
function logout(){
  currentUser = null;
  localStorage.removeItem(SES_KEY);
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  closeModal();
  S.click();
}
document.querySelectorAll('[data-authtab]').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.authtab;
    document.getElementById('authSwitch').dataset.mode = mode;
    document.querySelectorAll('[data-authtab]').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('authSubmit').textContent = mode==='login'?t('login'):t('register');
    document.getElementById('authError').textContent = '';
    S.click();
  });
});
document.getElementById('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const login = document.getElementById('authLogin').value.trim();
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authError');
  err.textContent = '';
  const mode = document.getElementById('authSwitch').dataset.mode;
  if(login.length < 3){ err.textContent = t('errLoginShort'); S.err(); return; }
  if(pass.length < 4){ err.textContent = t('errPassShort'); S.err(); return; }
  const key = login.toLowerCase();
  const hash = await sha256(pass);
  if(mode === 'register'){
    if(db.users[key]){ err.textContent = t('errTaken'); S.err(); return; }
    const u = newUser(login);
    u.password = hash;
    // Apply referral bonus if any
    const ref = sessionStorage.getItem('kv_pending_ref');
    if(ref){
      const referrer = Object.values(db.users).find(x => x.refCode === ref);
      if(referrer){
        referrer.balance += 500;
        referrer.history.unshift({t:Date.now(), title:'Бонус за друга ' + login, amount:500});
        recordBalance(referrer);
        referrer.referrals.push(login);
        pushNotif(referrer, '👥 Новый друг', login + ' · +500 ₽', 'i-user');
        u.balance += 500;
        u.history.unshift({t:Date.now(), title:'Бонус за регистрацию по ссылке', amount:500});
        recordBalance(u);
      }
      sessionStorage.removeItem('kv_pending_ref');
    }
    db.users[key] = u;
    saveDB();
    startSession(key);
    toast(t('accountCreated'),'ok'); S.levelUp(); hapticNotify('success');
  }else{
    const u = db.users[key];
    if(!u || u.password !== hash){ err.textContent = t('errLogin'); S.err(); return; }
    startSession(key);
    toast(t('welcomeBack') + ', ' + u.login,'ok'); S.ok();
  }
});

/* ---------- Telegram login ---------- */
function initTgLogin(){
  const btn = document.getElementById('tgLogin');
  const div = document.getElementById('tgDivider');
  if(tgUser){
    btn.classList.remove('hidden');
    div.classList.remove('hidden');
    btn.onclick = () => {
      const key = ('tg' + tgUser.id).toLowerCase();
      let u = db.users[key];
      if(!u){
        // Try find by username
        const byName = Object.keys(db.users).find(k => db.users[k].login.toLowerCase() === (tgUser.username||'').toLowerCase());
        if(byName){ u = db.users[byName]; }
      }
      if(!u){
        u = newUser(tgUser.username || ('tg'+tgUser.id), tgUser);
        u.tgId = tgUser.id;
        db.users[key] = u;
        saveDB();
        startSession(key);
        toast(t('accountCreated'),'ok'); S.levelUp();
      }else{
        startSession(u.login.toLowerCase() in db.users ? u.login.toLowerCase() : key);
        toast(t('welcomeBack'),'ok'); S.ok();
      }
    };
  }
}

/* ---------- Boot ---------- */
function boot(){
  applyI18n();
  applyTheme(localStorage.getItem(THEME_KEY)||'light');
  applyReferral();
  initTgLogin();

  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    setTimeout(()=>document.getElementById('splash').remove(), 500);
    const ses = localStorage.getItem(SES_KEY);
    if(ses && db.users[ses]){
      startSession(ses);
      checkIncomingGift();
    }else if(tgUser && db.users[('tg'+tgUser.id).toLowerCase()]){
      startSession(('tg'+tgUser.id).toLowerCase());
      checkIncomingGift();
    }else{
      document.getElementById('authScreen').classList.remove('hidden');
    }
  }, 650);
}
window.addEventListener('load', boot);

/* ---------- Cross-tab ---------- */
window.addEventListener('storage', e => {
  if(e.key === DB_KEY){
    db = loadDB();
    if(currentUser && db.users[currentUser]) renderApp(false);
  }
});

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); document.getElementById('notifPanel').classList.add('hidden'); }
  if(e.code === 'Space' && activeTab === 'home' && !e.target.matches('input')){
    e.preventDefault(); doTap();
  }
});

/* ---------- Telegram theme sync ---------- */
if(TG?.onEvent){
  TG.onEvent('themeChanged', () => {
    // Optionally follow TG theme
  });
}
