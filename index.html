<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0b1b33" />
<title>MiniOS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a1020;color:var(--ink);}
:root{
  --blue-50:#eff5ff;--blue-100:#dfeaff;--blue-200:#c3d9ff;--blue-300:#9dc1ff;
  --blue-400:#5b9bff;--blue-500:#2b7fff;--blue-600:#1560e0;--blue-700:#0f47ac;
  --ink:#0c1c33;--muted:#6a80a0;--line:#e4ecfa;--card:#fff;
  --wp:linear-gradient(160deg,#dbeafe,#93c5fd 55%,#3b82f6);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
input{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}
svg{width:100%;height:100%;display:block;}

.phone{position:relative;width:min(430px,100vw);height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--wp);background-size:cover;background-position:center;transition:background .45s;}
@media(min-width:520px){body{display:flex;align-items:center;justify-content:center;}.phone{border-radius:38px;box-shadow:0 30px 90px rgba(4,20,50,.55),0 0 0 10px #0f1a2e,0 0 0 12px #1b2c4a;}}

/* LOCK */
.lock{position:absolute;inset:0;z-index:40;background:var(--wp);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--st) + 62px) 26px calc(var(--sb) + 26px);color:#fff;transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .4s;touch-action:none;user-select:none;}
.lock.hidden{transform:translateY(-100%) scale(.96);opacity:0;pointer-events:none;}
.lock::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,70,.3),rgba(6,30,70,.05) 40%,rgba(6,30,70,.45));pointer-events:none;}
.lock>*{position:relative;z-index:2;}
.lock-top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.lock-icon{width:26px;height:26px;opacity:.9;margin-bottom:14px;}
.lock-time{font-size:74px;font-weight:200;letter-spacing:-3px;line-height:1;text-shadow:0 6px 30px rgba(4,24,60,.35);font-variant-numeric:tabular-nums;}
.lock-date{font-size:15px;font-weight:500;opacity:.92;text-transform:capitalize;}
.lock-card{margin:auto 0;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(4,24,60,.18);}
.lock-card .lc-ic{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.9);color:var(--blue-600);display:grid;place-items:center;padding:7px;flex:0 0 auto;}
.lock-card b{display:block;font-size:13px;font-weight:600;}
.lock-card span{font-size:12px;opacity:.85;}
.lock-bottom{display:flex;flex-direction:column;align-items:center;gap:18px;}
.swipe-hint{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:8px;}
.swipe-hint .arr{width:16px;height:16px;animation:up 1.8s infinite;}
@keyframes up{0%,100%{transform:translateY(3px);opacity:.5}50%{transform:translateY(-3px);opacity:1}}
.home-bar{width:130px;height:5px;border-radius:5px;background:rgba(255,255,255,.85);}

/* HOME */
.home{position:absolute;inset:0;z-index:10;background:var(--wp);background-size:cover;background-position:center;display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .35s;}
.home.blur{transform:scale(.94);opacity:.4;}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 12px) 22px 6px;color:#fff;font-size:14px;font-weight:600;text-shadow:0 2px 10px rgba(4,24,60,.35);}
.sb-right{display:flex;align-items:center;gap:7px;}
.sb-ic{width:16px;height:16px;opacity:.95;}
.sb-bat{width:24px;height:12px;border:1.6px solid rgba(255,255,255,.95);border-radius:4px;position:relative;padding:1.5px;}
.sb-bat::after{content:'';position:absolute;right:-4px;top:3.5px;width:2.5px;height:5px;background:rgba(255,255,255,.95);border-radius:0 2px 2px 0;}
.sb-bat i{display:block;height:100%;background:#fff;border-radius:2px;transition:width .4s;}
.sb-lock{width:17px;height:17px;opacity:.95;margin-left:2px;}
.homescroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 18px 6px;-webkit-overflow-scrolling:touch;}

/* WIDGETS */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;}
.widget{background:rgba(255,255,255,.94);border-radius:22px;padding:14px 15px;box-shadow:0 8px 22px rgba(9,36,80,.16);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);animation:pop .35s cubic-bezier(.3,1.4,.5,1);color:var(--ink);text-align:left;overflow:hidden;position:relative;}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
.widget.wide{grid-column:span 2;}
.w-lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--blue-500);opacity:.9;}
.w-clock{font-size:44px;font-weight:200;letter-spacing:-2px;line-height:1.05;font-variant-numeric:tabular-nums;}
.w-date{font-size:12.5px;color:var(--muted);text-transform:capitalize;margin-top:2px;}
.w-temp{font-size:34px;font-weight:300;letter-spacing:-1.5px;line-height:1.1;}
.w-sub{font-size:12px;color:var(--muted);}
.w-big{font-size:26px;font-weight:600;letter-spacing:-.5px;}
.w-bar{height:7px;border-radius:6px;background:var(--blue-100);overflow:hidden;margin-top:8px;}
.w-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue-400),var(--blue-600));}
.w-row{display:flex;align-items:center;gap:8px;}
.w-ic{width:20px;height:20px;color:var(--blue-500);flex:0 0 auto;}
.emptyw{grid-column:span 2;text-align:center;font-size:13px;color:#fff;opacity:.85;padding:18px;border:1.5px dashed rgba(255,255,255,.5);border-radius:20px;line-height:1.5;}

/* APP GRID */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;padding-bottom:16px;}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;animation:pop .35s backwards;}
.app:active .appicon{transform:scale(.88);}
.appicon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;padding:15px;box-shadow:0 7px 16px rgba(9,36,80,.28),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .16s cubic-bezier(.3,1.5,.6,1);position:relative;overflow:hidden;}
.appicon::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);pointer-events:none;}
.appname{font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 6px rgba(4,24,60,.55);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dock{margin:0 14px calc(var(--sb) + 12px);padding:12px 10px;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;box-shadow:0 10px 30px rgba(4,24,60,.2);}
.dock .appname{display:none;}
.dock .appicon{width:54px;height:54px;}

/* APP VIEW */
.appview{position:absolute;inset:0;z-index:50;background:#f6f9ff;transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden;}
.appview.open{transform:translateY(0);}
.apphead{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 14px) 16px 14px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:5;}
.backbtn{width:38px;height:38px;border-radius:13px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;padding:10px;flex:0 0 auto;transition:background .2s;}
.backbtn:active{background:var(--blue-100);}
.apptitle{font-size:17px;font-weight:700;letter-spacing:-.3px;}
.appbody{flex:1;overflow-y:auto;padding:16px 16px calc(var(--sb) + 22px);-webkit-overflow-scrolling:touch;}
.appview[data-full="1"] .apphead{display:none;}
.appview[data-full="1"] .appbody{padding:0;overflow:hidden;background:#000;}

/* COMMON */
.btn{background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 6px 16px rgba(21,96,224,.28);transition:transform .15s,opacity .2s;}
.btn:active{transform:scale(.95);}
.btn.ghost{background:var(--blue-50);color:var(--blue-600);box-shadow:none;}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:11px;}
.btn.danger{background:linear-gradient(160deg,#ff8a8a,#e23b3b);box-shadow:0 6px 16px rgba(226,59,59,.25);}
.card{background:#fff;border-radius:20px;padding:16px;border:1px solid var(--line);box-shadow:0 4px 16px rgba(20,60,130,.05);}
.sect{margin-bottom:18px;}
.sect h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 10px 4px;font-weight:700;}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border-bottom:1px solid var(--line);}
.row:first-child{border-radius:18px 18px 0 0;}
.row:last-child{border-bottom:none;border-radius:0 0 18px 18px;}
.row:only-child{border-radius:18px;}
.row-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;padding:8px;flex:0 0 auto;}
.row-t{flex:1;font-size:14px;font-weight:600;}
.row-s{font-size:11.5px;color:var(--muted);font-weight:500;}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 20px;line-height:1.6;}
.hintline{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5;}
.switch{width:48px;height:28px;border-radius:20px;background:var(--blue-100);position:relative;transition:background .25s;flex:0 0 auto;}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(10,40,90,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1);}
.switch.on{background:var(--blue-500);}
.switch.on i{transform:translateX(20px);}
.badge{display:inline-block;padding:3px 9px;border-radius:8px;background:var(--blue-50);color:var(--blue-600);font-size:11px;font-weight:700;}

/* GALLERY */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.gtile{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:#e5eefb;transition:transform .15s;box-shadow:0 4px 14px rgba(20,60,130,.12);}
.gtile:active{transform:scale(.94);}
.gtile-img{width:100%;height:100%;object-fit:cover;display:block;}
.gtile-video::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:rgba(10,25,55,.65);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.9);}
.gtile-video::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-40%,-50%);width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;z-index:2;}
.gtile-vdur{position:absolute;bottom:5px;right:5px;background:rgba(10,25,55,.7);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;z-index:3;}
.gtile-add{display:grid;place-items:center;background:linear-gradient(160deg,var(--blue-50),var(--blue-100));color:var(--blue-500);border:2px dashed var(--blue-300);font-size:32px;font-weight:300;}
.gtile-add svg{width:38px;height:38px;padding:8px;}

/* VIEWER / EDITOR */
.viewer{position:fixed;inset:0;z-index:100;background:rgba(4,14,34,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;padding:calc(var(--st) + 12px) 14px calc(var(--sb) + 14px);animation:fade .25s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.viewer-top{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:12px;}
.viewer-close{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;padding:10px;}
.viewer-info{font-size:13px;opacity:.8;}
.viewer-stage{flex:1;display:grid;place-items:center;overflow:hidden;position:relative;border-radius:20px;background:rgba(0,0,0,.35);}
.viewer-stage img,.viewer-stage video{max-width:100%;max-height:100%;border-radius:16px;display:block;box-shadow:0 20px 60px rgba(0,0,0,.5);transition:filter .25s;}
.viewer-tools{display:flex;gap:8px;padding:12px 0;overflow-x:auto;scrollbar-width:none;}
.toolchip{flex:0 0 auto;padding:9px 15px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.16);transition:all .18s;display:flex;align-items:center;gap:6px;}
.toolchip.active{background:#fff;color:var(--blue-700);}
.toolchip .ti{width:15px;height:15px;}
.viewer-actions{display:flex;gap:8px;padding-top:6px;}
.viewer-actions .btn{flex:1;padding:12px;font-size:13px;}
.sliderbox{background:rgba(255,255,255,.1);border-radius:16px;padding:12px 15px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.sliderbox label{color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.7px;opacity:.75;display:flex;justify-content:space-between;}
.sliderbox input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:rgba(255,255,255,.25);outline:none;}
.sliderbox input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4);cursor:pointer;}
.sliderbox input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4);cursor:pointer;}

/* CAMERA */
.cam{position:relative;width:100%;height:100%;background:#000;overflow:hidden;}
.cam-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
.cam-video.mirror{transform:scaleX(-1);}
.cam-overlay{position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 22%,transparent 68%,rgba(0,0,0,.65));}
.cam-grid{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .25s;}
.cam-grid.on{opacity:.55;}
.cam-grid i{position:absolute;background:rgba(255,255,255,.65);}
.cam-grid i:nth-child(1){left:33.33%;top:0;bottom:0;width:1px;}
.cam-grid i:nth-child(2){left:66.66%;top:0;bottom:0;width:1px;}
.cam-grid i:nth-child(3){top:33.33%;left:0;right:0;height:1px;}
.cam-grid i:nth-child(4){top:66.66%;left:0;right:0;height:1px;}
.cam-topbar{position:absolute;top:calc(var(--st) + 12px);left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;padding:0 14px;}
.cam-chip{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;border-radius:14px;background:rgba(10,25,55,.55);color:#fff;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .15s,background .25s,box-shadow .25s;}
.cam-chip .ci{width:15px;height:15px;display:block;}
.cam-chip:active{transform:scale(.94);}
.cam-chip[disabled]{opacity:.35;pointer-events:none;}
.cam-chip.on{background:linear-gradient(160deg,#ffd166,#ff9f1c);color:#1b1b1b;border-color:rgba(255,255,255,.75);box-shadow:0 6px 20px rgba(255,159,28,.5);}
.cam-chip.on .ci{color:#1b1b1b;}
.cam-modes{position:absolute;bottom:130px;left:0;right:0;z-index:5;display:flex;gap:6px;justify-content:center;padding:0 20px;}
.cam-mode{padding:7px 16px;border-radius:999px;background:rgba(10,25,55,.5);color:rgba(255,255,255,.7);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);transition:all .2s;}
.cam-mode.active{background:#fff;color:var(--blue-700);border-color:#fff;}
.cam-bottombar{position:absolute;bottom:0;left:0;right:0;z-index:5;padding:16px 26px calc(var(--sb) + 22px);display:flex;align-items:center;justify-content:space-between;gap:16px;}
.cam-thumb{width:56px;height:56px;border-radius:16px;border:2px solid rgba(255,255,255,.85);background:linear-gradient(160deg,#6fb2ff,#1a63e0);background-size:cover;background-position:center;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .15s;flex:0 0 auto;}
.cam-thumb:active{transform:scale(.9);}
.cam-shutter{width:84px;height:84px;border-radius:50%;padding:5px;border:3px solid #fff;background:transparent;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .12s;flex:0 0 auto;}
.cam-shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s,background .2s,border-radius .2s;}
.cam-shutter:active{transform:scale(.9);}
.cam-shutter.rec i{background:#ff3b3b;border-radius:10px;transform:scale(.55);}
.cam-shutter.rec{border-color:#ff3b3b;}
.cam-side{width:56px;height:56px;border-radius:16px;background:rgba(10,25,55,.5);color:#fff;display:grid;place-items:center;padding:16px;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);flex:0 0 auto;transition:transform .15s;}
.cam-side:active{transform:scale(.9);}
.cam-timer{position:absolute;top:calc(var(--st) + 70px);left:50%;transform:translateX(-50%);z-index:6;background:rgba(255,59,59,.92);color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.8px;display:none;align-items:center;gap:7px;}
.cam-timer.on{display:flex;}
.cam-timer .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.cam-flash{position:absolute;inset:0;background:#fff;z-index:9;pointer-events:none;opacity:0;}
.cam-flash.fire{animation:cflash .22s ease-out;}
@keyframes cflash{0%{opacity:0}35%{opacity:.95}100%{opacity:0}}
.cam-fallback{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;color:#fff;background:linear-gradient(160deg,#0d1a33,#05132a);}
.cam-fallback .cf-ic{width:64px;height:64px;color:#6fb2ff;margin-bottom:8px;}
.cam-fallback .cf-t{font-size:19px;font-weight:700;}
.cam-fallback .cf-s{font-size:13px;opacity:.75;max-width:300px;line-height:1.55;margin-bottom:8px;}

/* STORE */
.tabs{display:flex;gap:8px;background:var(--blue-50);padding:5px;border-radius:16px;margin-bottom:16px;}
.tab{flex:1;padding:10px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--blue-600);transition:all .22s;}
.tab.active{background:#fff;color:var(--blue-700);box-shadow:0 3px 10px rgba(21,96,224,.15);}
.storeitem{display:flex;align-items:center;gap:13px;background:#fff;padding:13px;border-radius:18px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(20,60,130,.05);}
.storeitem .appicon{width:50px;height:50px;border-radius:15px;padding:13px;box-shadow:none;}
.si-info{flex:1;min-width:0;}
.si-info b{display:block;font-size:14px;font-weight:700;}
.si-info span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* WALLPAPER */
.wpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.wpswatch{aspect-ratio:.62;border-radius:16px;border:2.5px solid transparent;transition:all .2s;box-shadow:0 4px 14px rgba(20,60,130,.12);background-size:cover;background-position:center;}
.wpswatch.sel{border-color:var(--blue-500);transform:scale(1.04);box-shadow:0 6px 18px rgba(21,96,224,.35);}
.uploadbtn{grid-column:span 4;padding:14px;border-radius:16px;background:linear-gradient(160deg,var(--blue-50),var(--blue-100));color:var(--blue-700);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--blue-300);transition:transform .15s;}
.uploadbtn:active{transform:scale(.97);}
.uploadbtn svg{width:18px;height:18px;}

/* CALCULATOR */
.calc{display:flex;flex-direction:column;gap:14px;}
.calc-screen{background:linear-gradient(160deg,#eaf2ff,#dbe8ff);border-radius:24px;padding:26px 20px;text-align:right;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;}
.calc-out{font-size:44px;font-weight:300;letter-spacing:-2px;color:var(--blue-700);overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.ckey{aspect-ratio:1;border-radius:20px;background:#fff;font-size:21px;font-weight:600;color:var(--ink);box-shadow:0 4px 12px rgba(20,60,130,.08);transition:transform .12s,background .15s;display:grid;place-items:center;}
.ckey:active{transform:scale(.92);}
.ckey.op{background:var(--blue-50);color:var(--blue-600);}
.ckey.eq{background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;}
.ckey.zero{grid-column:span 2;aspect-ratio:auto;}

/* NOTES */
.notenew{display:flex;gap:9px;margin-bottom:16px;}
.notenew input{flex:1;padding:13px 16px;border-radius:15px;border:1.5px solid var(--line);background:#fff;font-size:14px;outline:none;}
.notenew input:focus{border-color:var(--blue-400);}
.notenew .btn{padding:0;width:48px;display:grid;place-items:center;}
.notenew .btn svg{width:20px;height:20px;}
.note{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;position:relative;border:1px solid var(--line);box-shadow:0 3px 12px rgba(20,60,130,.05);}
.note-t{font-size:14px;font-weight:600;line-height:1.4;padding-right:36px;word-break:break-word;}
.note-d{font-size:11px;color:var(--muted);margin-top:6px;}
.note .x{position:absolute;top:8px;right:8px;width:36px;height:36px;color:#c3d0e4;padding:9px;display:grid;place-items:center;}
.note .x:active{color:#e23b3b;}

/* MUSIC */
.cover{width:200px;height:200px;border-radius:28px;margin:10px auto 22px;display:grid;place-items:center;color:#fff;box-shadow:0 18px 44px rgba(21,96,224,.28);padding:56px;background:linear-gradient(150deg,#6fb2ff,#1a63e0);transition:transform .4s;}
.cover.playing{animation:spin 9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.mtitle{text-align:center;font-size:19px;font-weight:700;}
.martist{text-align:center;font-size:13px;color:var(--muted);margin-top:4px;}
.progress{height:6px;border-radius:6px;background:var(--blue-100);margin:20px 0 6px;overflow:hidden;}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-400),var(--blue-600));border-radius:6px;transition:width .3s linear;}
.ptime{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.mcontrols{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:22px;}
.mbtn{width:52px;height:52px;border-radius:50%;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;padding:15px;}
.mbtn:active{transform:scale(.9);}
.mbtn.main{width:68px;height:68px;background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;padding:20px;box-shadow:0 10px 26px rgba(21,96,224,.35);}
.tracklist{margin-top:26px;}
.track{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;transition:background .2s;}
.track.active{background:var(--blue-50);}
.track .tn{flex:1;font-size:13.5px;font-weight:600;}
.track .td{font-size:11.5px;color:var(--muted);}

/* CHAT */
.chat{display:flex;flex-direction:column;gap:9px;padding-bottom:12px;}
.msg{max-width:80%;padding:11px 15px;border-radius:19px;font-size:14px;line-height:1.45;animation:pop .28s;word-break:break-word;}
.msg.me{align-self:flex-end;background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;border-bottom-right-radius:6px;box-shadow:0 5px 14px rgba(21,96,224,.25);}
.msg.you{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;border:1px solid var(--line);box-shadow:0 3px 10px rgba(20,60,130,.05);}
.chatbar{display:flex;gap:9px;margin-top:14px;}
.chatbar input{flex:1;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:14px;outline:none;}
.chatbar input:focus{border-color:var(--blue-400);}
.chatbar .btn{width:48px;padding:0;display:grid;place-items:center;}
.chatbar .btn svg{width:20px;height:20px;}

/* WEATHER */
.whero{background:linear-gradient(160deg,#5b9bff,#1560e0);border-radius:26px;padding:26px 22px;color:#fff;text-align:center;box-shadow:0 14px 34px rgba(21,96,224,.3);margin-bottom:16px;}
.whero .t{font-size:66px;font-weight:200;letter-spacing:-3px;line-height:1;}
.whero .c{font-size:14px;opacity:.9;margin-top:8px;}
.whero .ic{width:52px;height:52px;margin:0 auto 12px;}
.wdays{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.wday{background:#fff;border-radius:18px;padding:13px 6px;text-align:center;border:1px solid var(--line);}
.wday b{display:block;font-size:12px;font-weight:700;color:var(--muted);}
.wday .di{width:24px;height:24px;margin:9px auto;color:var(--blue-500);}
.wday span{font-size:13px;font-weight:700;}

/* CALENDAR */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.calhead b{font-size:16px;font-weight:700;text-transform:capitalize;}
.calnav{width:36px;height:36px;border-radius:12px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;padding:9px;}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.calwd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;}
.calday{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-size:13px;font-weight:600;color:var(--ink);}
.calday.mute{color:#c3d0e4;}
.calday.today{background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;}

/* BROWSER */
.urlbar{display:flex;align-items:center;gap:9px;background:#fff;border-radius:16px;padding:10px 14px;border:1.5px solid var(--line);margin-bottom:14px;}
.urlbar .lk{width:15px;height:15px;color:var(--blue-500);flex:0 0 auto;}
.urlbar input{flex:1;border:none;outline:none;font-size:14px;background:transparent;}
.bhome{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.bsite{background:#fff;border-radius:18px;padding:16px;border:1px solid var(--line);text-align:left;transition:transform .15s;}
.bsite:active{transform:scale(.96);}
.bsite .bi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;padding:8px;margin-bottom:10px;}
.bsite b{font-size:13.5px;display:block;}
.bsite span{font-size:11px;color:var(--muted);}
.bpage h2{font-size:20px;margin:0 0 12px;}
.bpage p{font-size:14px;line-height:1.65;color:#3d5377;margin:0 0 12px;}

/* CLOCK */
.smallcard{background:#fff;border-radius:22px;padding:24px 18px;text-align:center;box-shadow:0 4px 16px rgba(20,60,130,.06);border:1px solid var(--line);}
.smallcard .big{font-size:54px;font-weight:200;letter-spacing:-2.5px;color:var(--blue-700);}
.smallcard .sub{font-size:12.5px;color:var(--muted);text-transform:capitalize;margin-top:4px;}

/* ===================== DB (IndexedDB) ===================== */
const DB_NAME='minios',STORE='media';
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});
    };
    req.onsuccess=e=>{_db=e.target.result;res(_db);};
    req.onerror=()=>rej(req.error);
  });
}
function dbAdd(item){return openDB().then(d=>new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');const r=tx.objectStore(STORE).add(item);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
function dbAll(){return openDB().then(d=>new Promise((res,rej)=>{const tx=d.transaction(STORE,'readonly');const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));}
function dbDel(id){return openDB().then(d=>new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');const r=tx.objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}));}
function dbPut(item){return openDB().then(d=>new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite');const r=tx.objectStore(STORE).put(item);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');Object.keys(state).forEach(k=>{if(s[k]!==undefined)state[k]=s[k];});}catch(e){}}

const $=(s,r=document)=>r.querySelector(s);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isImage=s=>typeof s==='string'&&s.startsWith('data:image');
const isVideo=s=>typeof s==='string'&&s.startsWith('data:video');
const fmt=s=>Math.floor(s/60)+':'+pad(Math.floor(s%60));

    phone.style.backgroundPosition='center';

/* ===================== MEDIA (общая функция) ===================== */
// Медиа хранится в IndexedDB. Загружаем в память при старте.
let mediaItems=[]; // {id, type:'photo'|'video', dataUrl, thumb, ts, dur}
let mediaLoaded=false;

async function loadMedia(){
  try{
    mediaItems=await dbAll();
    mediaItems.sort((a,b)=>b.ts-a.ts);
    mediaLoaded=true;
  }catch(e){console.warn('db load fail',e);mediaLoaded=true;}
}
async function addMediaPhoto(dataUrl){
  const item={type:'photo',dataUrl,ts:Date.now()};
  const id=await dbAdd(item);
  item.id=id;
  mediaItems.unshift(item);
  return item;
}
async function addMediaVideo(dataUrl,thumb,dur){
  const item={type:'video',dataUrl,thumb,ts:Date.now(),dur};
  const id=await dbAdd(item);
  item.id=id;
  mediaItems.unshift(item);
  return item;
}
async function deleteMedia(id){
  try{await dbDel(id);}catch(e){}
  mediaItems=mediaItems.filter(m=>m.id!==id);
}
async function updateMedia(id,patch){
  const item=mediaItems.find(m=>m.id===id);
  if(!item) return;
  Object.assign(item,patch);
  try{await dbPut(item);}catch(e){}
}

/* ===================== APP VIEW ===================== */
function openApp(id,silent){
  const app=APPS[id];if(!app)return;
  clearTimers();
  currentApp=id;
  appView.dataset.app=id;
  appView.dataset.full=app.full?'1':'0';
  appView.innerHTML=`
    <div class="apphead">
      <button class="backbtn" id="backBtn">${I.chevron}</button>
      <span class="apptitle">${app.name}</span>
    </div>
    <div class="appbody" id="appBody">${app.full?'':app.view()}</div>`;
  if(app.full){
    // full-screen app (camera) — рендерим внутри тела
    $('#appBody').innerHTML=app.view();
  }
  if(!silent) requestAnimationFrame(()=>appView.classList.add('open'));
  else appView.classList.add('open');
  home.classList.add('blur');
  $('#backBtn').onclick=closeApp;
  if(app.mount) app.mount($('#appBody'));
}
function closeApp(){
  if(currentApp==='camera'&&window.__camStop){window.__camStop();window.__camStop=null;}
  clearTimers();
  appView.classList.remove('open');
  home.classList.remove('blur');
  currentApp=null;
  setTimeout(()=>{if(!currentApp)appView.innerHTML='';},420);
}
function refresh(){
  renderHome();
  if(currentApp) openApp(currentApp,true);
}

/* ===================== LOCK SCREEN ===================== */
let dragY=null,dragId=null;
function unlock(){lock.classList.add('hidden');}
function lockScreen(){lock.classList.remove('hidden');lock.style.transform='';}
lock.addEventListener('pointerdown',e=>{
  if(e.target.closest('.lock-card'))return;
  dragY=e.clientY;dragId=e.pointerId;
  try{lock.setPointerCapture(e.pointerId);}catch(_){}
  lock.style.transition='none';
});
lock.addEventListener('pointermove',e=>{
  if(dragY===null)return;
  const dy=Math.min(0,e.clientY-dragY);
  lock.style.transform='translateY('+dy+'px)';
});
lock.addEventListener('pointerup',e=>{
  if(dragY===null)return;
  const dy=e.clientY-dragY;
  lock.style.transition='';lock.style.transform='';
  dragY=null;dragId=null;
  if(dy<-70)unlock();
});
lock.addEventListener('pointercancel',()=>{
  dragY=null;lock.style.transition='';lock.style.transform='';
});
$('#lockBtn').onclick=lockScreen;

/* ===================== TICK ===================== */
function tick(){
  const d=new Date();
  const t=pad(d.getHours())+':'+pad(d.getMinutes());
  const ds=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  $$('[data-live="time"]').forEach(e=>e.textContent=t);
  $$('[data-live="date"]').forEach(e=>e.textContent=ds);
  $$('[data-live="wt"]').forEach(e=>{
    const off=+e.dataset.off||0;
    const dd=new Date(d.getTime()+off*3600000);
    e.textContent=pad(dd.getHours())+':'+pad(dd.getMinutes());
  });
}

function viewPhotos(){
  // Строим из mediaItems + кнопка загрузки
  const tiles=mediaItems.map(m=>{
    if(m.type==='photo'){
      return `<button class="gtile" data-mid="${m.id}"><img class="gtile-img" src="${m.dataUrl}" alt=""/></button>`;
    }
    return `<button class="gtile gtile-video" data-mid="${m.id}">
      <img class="gtile-img" src="${m.thumb||''}" alt=""/>
      ${m.dur?`<span class="gtile-vdur">${fmt(m.dur)}</span>`:''}
    </button>`;
  }).join('');

  const addTile=`<button class="gtile gtile-add" id="addPhotoBtn">${I.plus}</button>`;
  const empty=mediaItems.length?'':`<div class="empty" style="grid-column:span 3">Галерея пуста.<br>Снимите фото в Камере или загрузите из устройства.</div>`;

  return `<div class="gallery">${addTile}${tiles}</div>${empty}
    <div class="hintline">Нажмите на медиа, чтобы открыть редактор</div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden/>`;
}

function mountPhotos(root){
  const inp=$('#fileInput',root);
  $('#addPhotoBtn',root).onclick=()=>inp.click();

  inp.onchange=async e=>{
    const files=Array.from(e.target.files||[]);
    for(const f of files){
      if(!f.type.startsWith('image/'))continue;
      const url=await readFileAsDataURL(f);
      // сжимаем если слишком большое
      const compressed=await compressImage(url,1600,0.85);
      await addMediaPhoto(compressed);
    }
    openApp('photos',true);
  };

  root.querySelectorAll('[data-mid]').forEach(el=>{
    el.onclick=()=>openViewer(+el.dataset.mid);
  });
}

function readFileAsDataURL(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.readAsDataURL(file);
  });
}

function compressImage(dataUrl,maxSide,quality){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(Math.max(w,h)>maxSide){
        const k=maxSide/Math.max(w,h);
        w=Math.round(w*k);h=Math.round(h*k);
      }
      const cv=document.createElement('canvas');
      cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}

/* ===================== VIEWER / EDITOR ===================== */
let viewerState=null;

function openViewer(id){
  const m=mediaItems.find(x=>x.id===id);
  if(!m)return;
  viewerState={
    item:m,
    rotation:0,
    filter:{brightness:100,contrast:100,saturate:100,blur:0,sepia:0,grayscale:0},
    tool:'none'
  };
  renderViewer();
}

function renderViewer(){
  const m=viewerState.item;
  const f=viewerState.filter;
  const cssFilter=`brightness(${f.brightness}%) contrast(${f.contrast}%) saturate(${f.saturate}%) blur(${f.blur}px) sepia(${f.sepia}%) grayscale(${f.grayscale}%)`;

  let mediaHTML;
  if(m.type==='photo'){
    mediaHTML=`<img id="vMedia" src="${m.dataUrl}" style="filter:${cssFilter};transform:rotate(${viewerState.rotation}deg);" alt=""/>`;
  }else{
    mediaHTML=`<video id="vMedia" src="${m.dataUrl}" controls style="filter:${cssFilter}" playsinline></video>`;
  }

  const toolChips=`
    <button class="toolchip ${viewerState.tool==='adjust'?'active':''}" data-tool="adjust"><span class="ti">${I.edit}</span>Фильтры</button>
    <button class="toolchip" data-tool="rotate"><span class="ti">${I.rotate}</span>Повернуть</button>
    <button class="toolchip" data-tool="wallpaper"><span class="ti">${I.image}</span>Обои</button>
    <button class="toolchip" data-tool="download"><span class="ti">${I.download}</span>Скачать</button>
  `;

  let sliderHTML='';
  if(viewerState.tool==='adjust'&&m.type==='photo'){
    sliderHTML=`
      <div class="sliderbox">
        <label>Яркость <span data-val="brightness">${f.brightness}%</span></label>
        <input type="range" min="20" max="200" value="${f.brightness}" data-f="brightness"/>
      </div>
      <div class="sliderbox">
        <label>Контраст <span data-val="contrast">${f.contrast}%</span></label>
        <input type="range" min="20" max="200" value="${f.contrast}" data-f="contrast"/>
      </div>
      <div class="sliderbox">
        <label>Насыщенность <span data-val="saturate">${f.saturate}%</span></label>
        <input type="range" min="0" max="250" value="${f.saturate}" data-f="saturate"/>
      </div>
      <div class="sliderbox">
        <label>Размытие <span data-val="blur">${f.blur}px</span></label>
        <input type="range" min="0" max="10" value="${f.blur}" data-f="blur"/>
      </div>
      <div class="sliderbox">
        <label>Сепия <span data-val="sepia">${f.sepia}%</span></label>
        <input type="range" min="0" max="100" value="${f.sepia}" data-f="sepia"/>
      </div>
      <div class="sliderbox">
        <label>Ч/Б <span data-val="grayscale">${f.grayscale}%</span></label>
        <input type="range" min="0" max="100" value="${f.grayscale}" data-f="grayscale"/>
      </div>
      <button class="btn ghost" id="vReset" style="width:100%;margin-top:6px;background:rgba(255,255,255,.12);color:#fff;">Сбросить фильтры</button>
    `;
  }

  const overlay=document.createElement('div');
  overlay.className='viewer';
  overlay.id='viewer';
  overlay.innerHTML=`
    <div class="viewer-top">
      <button class="viewer-close" id="vClose">${I.x}</button>
      <span class="viewer-info">${m.type==='photo'?'Фото':'Видео'} · ${new Date(m.ts).toLocaleDateString('ru-RU')}</span>
      <span style="width:40px"></span>
    </div>
    <div class="viewer-stage" id="vStage">${mediaHTML}</div>
    <div class="viewer-tools">${toolChips}</div>
    <div id="vSliders">${sliderHTML}</div>
    <div class="viewer-actions">
      <button class="btn" id="vSave" style="display:${viewerState.tool==='adjust'&&m.type==='photo'?'flex':'none'};justify-content:center;">${I.check}Сохранить</button>
      <button class="btn danger" id="vDelete">${I.trash}Удалить</button>
    </div>
  `;
  // удаляем старый viewer если есть
  const old=document.getElementById('viewer');if(old)old.remove();
  document.body.appendChild(overlay);

  // events
  $('#vClose').onclick=()=>overlay.remove();

  $$('.toolchip',overlay).forEach(b=>{
    b.onclick=()=>{
      const t=b.dataset.tool;
      if(t==='rotate'){
        if(m.type==='photo'){
          viewerState.rotation=(viewerState.rotation+90)%360;
          const img=$('#vMedia',overlay);
          if(img)img.style.transform=`rotate(${viewerState.rotation}deg)`;
        }
        return;
      }
      if(t==='wallpaper'){
        if(m.type==='photo'){
          state.wallpaper=m.dataUrl;save();applyWallpaper();
          closeToast(overlay,'Установлено как обои ✓');
        }else{
          closeToast(overlay,'Только для фото');
        }
        return;
      }
      if(t==='download'){
        const a=document.createElement('a');
        a.href=m.dataUrl;
        a.download='minios_'+Date.now()+(m.type==='photo'?'.jpg':'.webm');
        a.click();
        return;
      }
      viewerState.tool=t==='adjust'?'adjust':'none';
      renderViewer();
    };
  });

  $$('#vSliders input[type=range]',overlay).forEach(r=>{
    r.oninput=()=>{
      const k=r.dataset.f;
      viewerState.filter[k]=+r.value;
      const lab=$(`[data-val="${k}"]`,overlay);
      if(lab)lab.textContent=+r.value+(k==='blur'?'px':'%');
      const media=$('#vMedia',overlay);
      if(media){
        const f2=viewerState.filter;
        media.style.filter=`brightness(${f2.brightness}%) contrast(${f2.contrast}%) saturate(${f2.saturate}%) blur(${f2.blur}px) sepia(${f2.sepia}%) grayscale(${f2.grayscale}%)`;
      }
    };
  });

  const reset=$('#vReset',overlay);
  if(reset)reset.onclick=()=>{
    viewerState.filter={brightness:100,contrast:100,saturate:100,blur:0,sepia:0,grayscale:0};
    renderViewer();
  };

  $('#vSave').onclick=async()=>{
    if(m.type!=='photo')return;
    const img=new Image();
    img.onload=async()=>{
      const cv=document.createElement('canvas');
      const rot=viewerState.rotation;
      const w=img.width,h=img.height;
      if(rot===90||rot===270){cv.width=h;cv.height=w;}
      else{cv.width=w;cv.height=h;}
      const ctx=cv.getContext('2d');
      ctx.translate(cv.width/2,cv.height/2);
      ctx.rotate(rot*Math.PI/180);
      ctx.filter=`brightness(${viewerState.filter.brightness}%) contrast(${viewerState.filter.contrast}%) saturate(${viewerState.filter.saturate}%) blur(${viewerState.filter.blur}px) sepia(${viewerState.filter.sepia}%) grayscale(${viewerState.filter.grayscale}%)`;
      ctx.drawImage(img,-w/2,-h/2,w,h);
      const out=cv.toDataURL('image/jpeg',0.9);
      await updateMedia(m.id,{dataUrl:out});
      // если это были обои — обновим
      if(state.wallpaper===m.dataUrl){
        state.wallpaper=out;save();applyWallpaper();
      }
      overlay.remove();
      openApp('photos',true);
    };
    img.src=m.dataUrl;
  };

  $('#vDelete').onclick=async()=>{
    if(!confirm('Удалить это медиа?'))return;
    await deleteMedia(m.id);
    overlay.remove();
    openApp('photos',true);
  };

  function closeToast(container,msg){
    const t=document.createElement('div');
    t.textContent=msg;
    t.style.cssText='position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(10,25,55,.9);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:20;';
    container.appendChild(t);
    setTimeout(()=>t.remove(),1500);
  }
}

async function mountCamera(root){
  const video=$('#camVideo',root),flashBtn=$('#camFlash',root),gridBtn=$('#camGridBtn',root),
    flipBtn=$('#camFlip',root),shutter=$('#camShutter',root),fallback=$('#camFallback',root),
    fallbackText=$('#camFallbackText',root),thumb=$('#camThumb',root),timer=$('#camTimer',root),
    timerVal=$('#camTimerVal',root),flashOverlay=$('#camFlashOverlay',root);

  updateThumb();
  gridBtn.classList.toggle('on',cam.gridOn);

  async function start(){
    stop();
    try{
      cam.stream=await navigator.mediaDevices.getUserMedia({
        audio:cam.mode==='video',
        video:{facingMode:{ideal:cam.facing},width:{ideal:1920},height:{ideal:1080}}
      });
      video.srcObject=cam.stream;
      cam.track=cam.stream.getVideoTracks()[0];
      const cap=cam.track.getCapabilities?.()||{};
      cam.torchSupported=!!cap.torch&&cam.facing==='environment';
      flashBtn.toggleAttribute('disabled',!cam.torchSupported);
      flashBtn.classList.toggle('on',cam.torchOn&&cam.torchSupported);

      // зеркалим фронталку
      const isFront=cam.facing==='user';
      video.classList.toggle('mirror',isFront&&cam.frontMirror);

      fallback.hidden=true;
    }catch(err){
      console.warn('cam error',err);
      fallback.hidden=false;
      if(err.name==='NotAllowedError')fallbackText.textContent='Доступ к камере запрещён. Разрешите его в настройках Telegram.';
      else if(err.name==='NotFoundError')fallbackText.textContent='Камера не найдена на этом устройстве.';
      else fallbackText.textContent='Не удалось запустить камеру: '+(err.message||err.name);
    }
  }
  function stop(){
    if(cam.recording)stopRecording();
    if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null;cam.track=null;}
  }
  window.__camStop=stop;

  function updateThumb(){
    const last=mediaItems[0];
    if(last){
      const src=last.type==='photo'?last.dataUrl:(last.thumb||'');
      thumb.style.backgroundImage=`url('${src}')`;
      thumb.style.backgroundSize='cover';
      thumb.style.backgroundPosition='center';
    }else{
      thumb.style.backgroundImage='linear-gradient(160deg,#6fb2ff,#1a63e0)';
    }
  }

  /* --- Фонарик --- */
  flashBtn.onclick=async()=>{
    if(!cam.torchSupported)return;
    haptic('medium');
    const next=!cam.torchOn;
    try{
      await cam.track.applyConstraints({advanced:[{torch:next}]});
      cam.torchOn=next;
      flashBtn.classList.toggle('on',next);
    }catch(e){
      cam.torchOn=false;flashBtn.classList.remove('on');
    }
  };

  /* --- Сетка --- */
  gridBtn.onclick=()=>{
    haptic('light');
    cam.gridOn=!cam.gridOn;
    $('#camGrid',root).classList.toggle('on',cam.gridOn);
    gridBtn.classList.toggle('on',cam.gridOn);
  };

  /* --- Смена камеры --- */
  flipBtn.onclick=()=>{
    haptic('light');
    cam.facing=cam.facing==='environment'?'user':'environment';
    cam.torchOn=false;flashBtn.classList.remove('on');
    start();
  };

  /* --- Режим фото/видео --- */
  root.querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick=()=>{
      if(cam.recording)return;
      haptic('light');
      cam.mode=b.dataset.mode;
      root.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));
      start(); // перезапуск для audio в видео
    };
  });

  /* --- Съёмка --- */
  function screenFlash(){
    flashOverlay.classList.remove('fire');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('fire');
  }

  shutter.onclick=async()=>{
    if(!cam.track)return;
    if(cam.mode==='photo'){
      haptic('medium');
      screenFlash();
      // визуальный эффект
      const w=video.videoWidth,h=video.videoHeight;
      if(!w||!h)return;
      const cv=document.createElement('canvas');
      cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');
      if(cam.facing==='user'&&cam.frontMirror){ctx.translate(w,0);ctx.scale(-1,1);}
      ctx.drawImage(video,0,0,w,h);
      const dataUrl=cv.toDataURL('image/jpeg',0.85);
      const compressed=await compressImage(dataUrl,1600,0.82);
      await addMediaPhoto(compressed);
      updateThumb();
      haptic('heavy');
    }else{
      // видео
      if(cam.recording){
        stopRecording();
      }else{
        startRecording();
      }
    }
  };

  function startRecording(){
    try{
      cam.chunks=[];
      const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||'';
      cam.rec=new MediaRecorder(cam.stream,mime?{mimeType:mime}:undefined);
      cam.rec.ondataavailable=e=>{if(e.data&&e.data.size)cam.chunks.push(e.data);};
      cam.rec.onstop=async()=>{
        if(cam.chunks.length){
          const blob=new Blob(cam.chunks,{type:cam.rec.mimeType||'video/webm'});
          const dur=Math.round((Date.now()-cam.recStart)/1000);
          const dataUrl=await blobToDataURL(blob);
          const thumb=await captureVideoThumb(video);
          await addMediaVideo(dataUrl,thumb,dur);
          updateThumb();
        }
      };
      cam.rec.start();
      cam.recording=true;
      cam.recStart=Date.now();
      shutter.classList.add('rec');
      timer.classList.add('on');
      haptic('heavy');

      cam.recTimer=setInterval(()=>{
        const s=Math.floor((Date.now()-cam.recStart)/1000);
        timerVal.textContent=fmt(s);
        // авто-стоп на 60 сек
        if(s>=60)stopRecording();
      },250);
    }catch(e){
      console.warn('rec error',e);
    }
  }
  function stopRecording(){
    if(!cam.recording)return;
    try{cam.rec.stop();}catch(e){}
    cam.recording=false;
    clearInterval(cam.recTimer);
    cam.recTimer=null;
    shutter.classList.remove('rec');
    timer.classList.remove('on');
    haptic('medium');
  }

  async function captureVideoThumb(videoEl){
    const w=videoEl.videoWidth,h=videoEl.videoHeight;
    if(!w||!h)return '';
    const cv=document.createElement('canvas');
    cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(videoEl,0,0,w,h);
    return cv.toDataURL('image/jpeg',0.7);
  }

  thumb.onclick=()=>{stop();openApp('photos');};
  $('#camRetry',root).onclick=()=>start();

  await start();
}

function blobToDataURL(blob){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.readAsDataURL(blob);
  });
}

/* ===================== CALCULATOR ===================== */
let calcExpr='';
function viewCalc(){
  const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  const pad2=keys.map(k=>{
    let cls='ckey';
    if(['÷','×','−','+','%','C','⌫'].includes(k))cls+=' op';
    if(k==='=')cls+=' eq';
    if(k==='0')cls+=' zero';
    return `<button class="${cls}" data-k="${k}">${k}</button>`;
  }).join('');
  return `<div class="calc"><div class="calc-screen"><div class="calc-out" id="calcOut">0</div></div><div class="calc-pad">${pad2}</div></div>`;
}
function mountCalc(root){
  const out=$('#calcOut',root);
  const show=()=>{out.textContent=calcExpr||'0';};
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-k]');if(!b)return;
    const k=b.dataset.k;
    if(k==='C')calcExpr='';
    else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);
    else if(k==='='){
      try{
        const raw=calcExpr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');
        const v=Function('"use strict";return ('+raw+')')();
        calcExpr=(Math.round(v*1e10)/1e10).toString();
      }catch(e){calcExpr='Ошибка';}
    }else calcExpr+=k;
    haptic('light');
    show();
  });
  show();
}

function mountMessages(root){
  const input=$('#chatInput',root),chat=$('#chat',root);

/* ===================== BROWSER ===================== */
const SITES={
  'mini.os':{t:'MiniOS',c:'Домашняя страница карманной системы.'},
  'news.ru':{t:'Новости',c:'Сегодня в мире технологий: мини-приложения становятся стандартом.'},
  'weather.ru':{t:'Погода',c:'В Москве ясно, +21°, ветер слабый.'},
  'music.ru':{t:'Музыка',c:'Топ-чарт возглавляет Blue Horizon.'},
  'docs.io':{t:'Документация',c:'MiniOS — демонстрационная ОС внутри Telegram.'}
};
function viewBrowser(){
  return `<div class="urlbar"><span class="lk">${I.lock}</span><input id="urlInput" placeholder="Поиск или адрес"/></div>
    <div class="bpage" id="bpage">${browserHome()}</div>`;
}
function browserHome(){
  return `<div class="bhome">${Object.entries(SITES).map(([k,v])=>`
    <button class="bsite" data-site="${k}">
      <span class="bi" style="background:linear-gradient(150deg,#6fb2ff,#1a63e0)">${I.browser}</span>
      <b>${v.t}</b><span>${k}</span>
    </button>`).join('')}</div>`;
}
function mountBrowser(root){
  const input=$('#urlInput',root),page=$('#bpage',root);
  function bindHome(){page.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>showSite(b.dataset.site));}
  function showSite(key){
    const s=SITES[key];
    if(!s){showSearch(key);return;}
    page.innerHTML=`<h2>${s.t}</h2><p>${s.c}</p>
      <p>Страница отрисована локально внутри MiniOS.</p>
      <button class="btn ghost sm" id="bBack">На главную</button>`;
    $('#bBack',page).onclick=()=>{page.innerHTML=browserHome();bindHome();};
  }
  function showSearch(q){
    page.innerHTML=`<h2>Поиск</h2><p>По запросу «${esc(q)}» найдено 3 страницы.</p>
      <div class="bhome" style="margin-top:14px">
        ${Object.entries(SITES).slice(0,3).map(([k,v])=>`<button class="bsite" data-site="${k}"><span class="bi" style="background:linear-gradient(150deg,#67e8f9,#0891b2)">${I.search}</span><b>${v.t}</b><span>${k}</span></button>`).join('')}
      </div>`;
    page.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>showSite(b.dataset.site));
  }
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const v=input.value.trim().toLowerCase();if(!v)return;
      const key=Object.keys(SITES).find(k=>k.includes(v)||SITES[k].t.toLowerCase().includes(v));
      key?showSite(key):showSearch(input.value.trim());
    }
  });
  bindHome();
}

/* ===================== CALENDAR ===================== */
let calDate=new Date();
function viewCalendar(){
  return `<div class="calhead">
      <button class="calnav" id="calPrev">${I.chevron}</button>
      <b id="calTitle"></b>
      <button class="calnav" id="calNext" style="transform:rotate(180deg)">${I.chevron}</button>
    </div>
    <div class="card" style="padding:14px 10px"><div class="calgrid" id="calGrid"></div></div>`;
}
function mountCalendar(root){
  const grid=$('#calGrid',root),title=$('#calTitle',root);
  function draw(){
    const y=calDate.getFullYear(),m=calDate.getMonth();
    title.textContent=calDate.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    const first=new Date(y,m,1);let start=first.getDay();start=start===0?6:start-1;
    const dim=new Date(y,m+1,0).getDate(),today=new Date();
    let html=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="calwd">${d}</div>`).join('');
    for(let i=0;i<start;i++)html+=`<div class="calday mute"></div>`;
    for(let d=1;d<=dim;d++){
      const isT=d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
      html+=`<div class="calday ${isT?'today':''}">${d}</div>`;
    }
    grid.innerHTML=html;
  }
  $('#calPrev',root).onclick=()=>{calDate.setMonth(calDate.getMonth()-1);draw();};
  $('#calNext',root).onclick=()=>{calDate.setMonth(calDate.getMonth()+1);draw();};
  draw();
}

/* ===================== INIT ===================== */
function initStatus(){
  $('#sbSignal').innerHTML=I.signal;
  $('#sbWifi').innerHTML=I.wifi;
  $('#sbBat').style.width=state.battery+'%';
  $('#lockBtn').innerHTML=I.lock;
  $('#lockIcon').innerHTML=I.lock;
  $('#arrIcon').innerHTML=I.arrowUp;
  $('#lcIcon').innerHTML=I.clock;
}

function initBattery(){
  if(!navigator.getBattery){
    setInterval(()=>{
      state.battery=Math.max(5,state.battery-1);
      const b=$('#sbBat');if(b)b.style.width=state.battery+'%';
    },120000);
    return;
  }
  navigator.getBattery().then(b=>{
    const upd=()=>{state.battery=Math.round(b.level*100);const el=$('#sbBat');if(el)el.style.width=state.battery+'%';save();};
    upd();
    b.addEventListener('levelchange',upd);
  }).catch(()=>{});
}

/* Telegram BackButton */
function initTelegram(){
  if(!tg)return;
  try{
    tg.ready();tg.expand();tg.setHeaderColor('#0b1b33');
    tg.BackButton?.onClick(()=>{
      if(document.getElementById('viewer')){document.getElementById('viewer').remove();return;}
      if(currentApp)closeApp();
    });
    // автоскрытие при отсутствии окна
    setInterval(()=>{
      if(currentApp||document.getElementById('viewer'))tg.BackButton?.show?.();
      else tg.BackButton?.hide?.();
    },400);
  }catch(e){}
}

/* Escape для десктопа */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const v=document.getElementById('viewer');
    if(v){v.remove();return;}
    if(currentApp)closeApp();
  }
});

async function init(){
  load();
  applyWallpaper();
  initStatus();
  await loadMedia();
  renderHome();
  tick();
  setInterval(tick,1000);
  initBattery();
  initTelegram();
}
init();
</script>
