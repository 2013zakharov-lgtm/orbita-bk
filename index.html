<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b5ed7">
<title>Kvantum Bank</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f8ff;--surface:#fff;--surface-2:#f7faff;
  --line:#e3ecfa;--line-2:#eef4fd;
  --text:#081b3a;--text-2:#3d5d85;--muted:#7a94b5;
  --blue:#0b5ed7;--blue-2:#1878f5;--blue-soft:#e3efff;
  --navy:#031b45;
  --green:#0fa86a;--green-soft:#e3f8ee;
  --red:#ef4444;--red-soft:#ffe9ea;
  --gold:#e8b84b;--gold-soft:#fff6de;
  --purple:#8b5cf6;--purple-soft:#f0ebff;
  --shadow:0 6px 22px rgba(11,94,215,.08);
  --shadow-lg:0 20px 50px rgba(3,27,69,.14);
  --radius:14px;--radius-lg:20px;
  --ease:cubic-bezier(.22,.9,.3,1);--dur:.24s;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#05101f;--surface:#0d1c36;--surface-2:#102340;
  --line:#1b3155;--line-2:#152a48;
  --text:#eaf2ff;--text-2:#a9c1e0;--muted:#6b88ab;
  --blue:#3d8dff;--blue-2:#5ba2ff;--blue-soft:#0f2a52;
  --navy:#020d24;
  --green:#28c98b;--green-soft:#0d3123;
  --red:#ff6b6b;--red-soft:#3a1414;
  --gold:#f0c668;--gold-soft:#3a2d10;
  --purple:#a78bfa;--purple-soft:#2a1d52;
  --shadow:0 6px 22px rgba(0,0,0,.35);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;user-select:none;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
  font-size:15px;
}
input{user-select:text}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:15px;height:15px}
.icon.lg{width:24px;height:24px}
.icon.xl{width:32px;height:32px}

#splash{position:fixed;inset:0;background:var(--bg);z-index:300;display:grid;place-items:center;transition:opacity .35s}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{width:68px;height:68px;border-radius:19px;background:linear-gradient(135deg,var(--blue-2),var(--navy));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:30px;
  box-shadow:0 20px 40px rgba(11,94,215,.35);animation:breathe 1.6s ease infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1000px 600px at 8% -10%,var(--blue-soft),transparent 55%),
    radial-gradient(800px 550px at 100% 110%,var(--blue-soft),transparent 50%),
    linear-gradient(180deg,var(--bg),#e8f1ff)}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);
  border-radius:24px;padding:28px 24px;box-shadow:var(--shadow-lg);animation:authIn .5s var(--ease)}
@keyframes authIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.auth-mark{width:50px;height:50px;border-radius:15px;flex:none;
  background:linear-gradient(135deg,var(--blue-2),var(--navy));display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:24px;box-shadow:0 14px 30px rgba(11,94,215,.35)}
.auth-brand h1{font-size:20px;letter-spacing:-.4px;font-weight:800}
.auth-brand p{font-size:12px;color:var(--muted);margin-top:3px}

.tg-login{width:100%;padding:13px;border-radius:13px;
  background:linear-gradient(135deg,#2aabee,#229ed9);color:#fff;font-weight:700;
  font-size:14px;display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 10px 24px rgba(42,171,238,.35);transition:all var(--dur) var(--ease);margin-bottom:14px}
.tg-login:hover{transform:translateY(-2px)}
.tg-divider{display:flex;align-items:center;gap:10px;margin:14px 0;
  font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
.tg-divider::before,.tg-divider::after{content:'';flex:1;height:1px;background:var(--line)}

.switch{display:flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:3px;margin-bottom:16px;position:relative}
.switch-btn{flex:1;padding:10px;border-radius:10px;font-size:13.5px;font-weight:600;
  color:var(--muted);transition:all var(--dur) var(--ease);position:relative;z-index:2}
.switch-btn.active{color:var(--blue)}
.switch-slider{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);
  background:var(--surface);border-radius:10px;box-shadow:var(--shadow);
  transition:transform var(--dur) var(--ease);z-index:1}
.switch[data-mode="register"] .switch-slider{transform:translateX(100%)}

.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
  font-size:15px;background:var(--surface-2);transition:all var(--dur) var(--ease);
  outline:none;color:var(--text)}
.field input:focus{border-color:var(--blue-2);background:var(--surface);
  box-shadow:0 0 0 4px rgba(24,120,245,.13)}
.error{color:var(--red);font-size:12px;min-height:15px;margin-bottom:5px;font-weight:500}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6}

/* BUTTONS */
.btn{border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:600;
  transition:all var(--dur) var(--ease);display:inline-flex;align-items:center;
  justify-content:center;gap:7px;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;
  box-shadow:0 8px 20px rgba(11,94,215,.26)}
.btn-primary:active:not(:disabled){transform:scale(.97)}
.btn-primary:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn-outline{background:var(--surface);border:1.5px solid var(--line);color:var(--blue)}
.btn-outline:hover:not(:disabled){border-color:var(--blue-2);background:var(--surface-2)}
.btn-ghost{color:var(--muted);padding:8px 11px}
.btn-ghost:hover{color:var(--blue);background:var(--surface-2)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-gold{background:linear-gradient(135deg,#f0c668,#e8b84b);color:#4a2f00;
  box-shadow:0 8px 20px rgba(232,184,75,.3)}
.btn-purple{background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff;
  box-shadow:0 8px 20px rgba(139,92,246,.3)}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn-lg{padding:14px 22px;font-size:15px;border-radius:14px}

/* APP */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);padding-top:var(--safe-top)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:10px 14px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--blue-2),var(--navy));display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 14px rgba(11,94,215,.3)}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text b{font-size:12px;letter-spacing:.6px;font-weight:800}
.brand-text span{font-size:7.5px;letter-spacing:2.8px;color:var(--blue-2);font-weight:700;margin-top:2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.balance-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:5px 11px}
.balance-chip span{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.balance-chip b{font-size:13.5px;color:var(--blue);font-variant-numeric:tabular-nums}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--text-2);transition:all var(--dur) var(--ease)}
.icon-btn:hover{background:var(--surface-2);color:var(--blue)}

.content{max-width:1200px;width:100%;margin:0 auto;padding:14px 14px 110px;flex:1}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(22px) saturate(180%);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + var(--safe-bot));
  display:flex;justify-content:space-around;gap:2px}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 4px;border-radius:11px;color:var(--muted);font-size:10px;font-weight:600;
  transition:all var(--dur) var(--ease);position:relative;min-width:0}
.bnav-btn .icon{width:21px;height:21px}
.bnav-btn.active{color:var(--blue)}
.bnav-btn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:3px;background:var(--blue);border-radius:0 0 3px 3px}
.bnav-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* PAGE */
.page-in{animation:pageIn .36s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.page-head{margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:flex-end;
  justify-content:space-between;gap:10px}
.page-head h2{font-size:20px;letter-spacing:-.4px;font-weight:800}
.page-head p{font-size:12px;color:var(--muted);margin-top:4px}
.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:12px}

/* HERO */
.hero{background:radial-gradient(900px 400px at 90% -30%,rgba(77,155,255,.42),transparent 60%),
    radial-gradient(600px 300px at 10% 130%,rgba(24,120,245,.35),transparent 60%),
    linear-gradient(120deg,#0a44a8 0%,#0b5ed7 40%,#031b45 100%);
  border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);margin-bottom:12px}
.hero::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:38px 38px;mask-image:radial-gradient(circle at 70% 50%,#000,transparent 78%)}
.hero::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.12),transparent 68%);
  top:-160px;right:-90px}
.hero-inner{position:relative;z-index:2;display:flex;align-items:center;gap:14px}
.hero-left{flex:1;min-width:0}
.hero-label{font-size:10.5px;opacity:.78;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.hero-balance{font-size:32px;font-weight:800;letter-spacing:-1.4px;margin:5px 0 3px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.hero-sub{font-size:11.5px;opacity:.82}
.hero-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;
  background:rgba(255,255,255,.18);font-size:11px;font-weight:700;backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.2);white-space:nowrap}

/* TAP */
.tap-section{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 60%,transparent),var(--surface));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;
  display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);margin-bottom:14px}
.tap-section::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 40%,rgba(232,184,75,.08),transparent 60%);pointer-events:none}
.tap-coin{position:relative;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#ffe082,#f0b429 45%,#b8860b 80%);
  box-shadow:0 15px 40px rgba(240,180,41,.4),inset 0 -8px 20px rgba(0,0,0,.18),
    inset 0 8px 16px rgba(255,255,255,.5);
  display:grid;place-items:center;color:#4a2f00;font-weight:800;font-size:44px;
  cursor:pointer;transition:transform .1s;animation:coinPulse 3s ease infinite;
  user-select:none;touch-action:manipulation}
@keyframes coinPulse{0%,100%{box-shadow:0 15px 40px rgba(240,180,41,.4),inset 0 -8px 20px rgba(0,0,0,.18),inset 0 8px 16px rgba(255,255,255,.5)}
  50%{box-shadow:0 20px 55px rgba(240,180,41,.55),inset 0 -8px 20px rgba(0,0,0,.18),inset 0 8px 16px rgba(255,255,255,.5)}}
.tap-coin:active{transform:scale(.94)}
.tap-coin::before{content:'';position:absolute;inset:12px;border-radius:50%;border:2px dashed rgba(255,255,255,.5)}
.tap-coin .cur{position:relative;z-index:2;text-shadow:0 2px 4px rgba(0,0,0,.15)}
.tap-info{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tap-value{font-size:12.5px;color:var(--muted);font-weight:600}
.combo{font-size:13px;font-weight:800;color:var(--gold);min-height:18px;transition:all .3s var(--ease)}
.combo.fire{font-size:16px;text-shadow:0 0 12px rgba(232,184,75,.6)}
.energy-wrap{width:100%;max-width:340px}
.energy-lbl{display:flex;justify-content:space-between;font-size:11px;
  color:var(--muted);font-weight:600;margin-bottom:5px}
.energy-bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;
  border:1px solid var(--line)}
.energy-bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ffb340,#f59e0b);transition:width .3s var(--ease)}
.energy-bar i.low{background:linear-gradient(90deg,#ef4444,#dc2626)}

/* QUICK ACTIONS */
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:all var(--dur) var(--ease);cursor:pointer;text-align:center}
.qa:hover{transform:translateY(-2px);border-color:var(--blue-2);box-shadow:var(--shadow)}
.qa-ic{width:38px;height:38px;border-radius:11px;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center}
.qa span{font-size:11.5px;font-weight:600;color:var(--text-2)}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.mini-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;display:flex;align-items:center;gap:10px}
.mini-stat .ic{width:34px;height:34px;border-radius:10px;background:var(--blue-soft);
  color:var(--blue);display:grid;place-items:center;flex:none}
.mini-stat .ic .icon{width:17px;height:17px}
.mini-stat .val{font-size:15px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.mini-stat .lbl{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}

/* JOBS */
.job-card{display:flex;flex-direction:column;gap:8px}
.job-head{display:flex;align-items:center;gap:11px}
.job-ico{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);
  color:var(--blue);display:grid;place-items:center;flex:none}
.job-ico .icon{width:21px;height:21px}
.job-head h3{font-size:14.5px;font-weight:700}
.job-head p{font-size:11.5px;color:var(--muted);margin-top:2px}
.job-card.locked{opacity:.6}
.lock{font-size:11.5px;color:var(--muted);font-weight:600;padding:9px;background:var(--surface-2);
  border-radius:10px;text-align:center}

/* BUSINESS */
.biz-card{display:flex;flex-direction:column;gap:11px}
.biz-head{display:flex;align-items:center;gap:11px}
.biz-ico{width:46px;height:46px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,var(--blue-soft),color-mix(in srgb,var(--blue-soft) 60%,var(--surface)));
  color:var(--blue);display:grid;place-items:center}
.biz-ico .icon{width:22px;height:22px}
.biz-head h3{font-size:15px;font-weight:700}
.biz-head p{font-size:11.5px;color:var(--muted);margin-top:2px}
.biz-lvl{display:flex;gap:2px;margin-left:auto}
.biz-lvl i{width:12px;height:5px;border-radius:2px;background:var(--line)}
.biz-lvl i.on{background:linear-gradient(90deg,var(--blue-2),var(--blue))}
.biz-wallet{background:linear-gradient(135deg,var(--purple-soft),var(--blue-soft));
  border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;
  border:1px solid var(--line)}
.biz-wallet .w-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.biz-wallet b{font-size:15px;color:var(--blue);font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.biz-wallet .w-icon{width:36px;height:36px;border-radius:10px;background:var(--surface);
  color:var(--blue);display:grid;place-items:center;flex:none}
.biz-acc{background:var(--surface-2);border:1px dashed var(--line);border-radius:11px;
  padding:10px 13px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.biz-acc b{color:var(--blue);font-size:13.5px;font-variant-numeric:tabular-nums}
.biz-row{display:flex;gap:6px;flex-wrap:wrap}
.biz-row .btn{flex:1;min-width:0;padding:9px 10px;font-size:11.5px}

/* TRANSFER */
.transfer-card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-bottom:12px}
.tab-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:3px;margin-bottom:14px}
.tab-switch button{flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;
  color:var(--muted);transition:all var(--dur) var(--ease)}
.tab-switch button.active{background:var(--surface);color:var(--blue);box-shadow:var(--shadow)}
.recipient-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600;
  cursor:pointer;transition:all var(--dur) var(--ease)}
.chip:hover,.chip.sel{border-color:var(--blue-2);background:var(--blue-soft);color:var(--blue)}
.chip .av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:10px;font-weight:700;background:linear-gradient(135deg,#1878f5,#031b45)}

/* ADMIN */
.admin-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;
  background:linear-gradient(135deg,#f0c668,#e8b84b);color:#4a2f00;font-size:11px;font-weight:800;
  letter-spacing:.5px;text-transform:uppercase}
.admin-row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:6px;transition:all var(--dur) var(--ease)}
.admin-row:hover{background:var(--blue-soft)}
.admin-av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1878f5,#031b45);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.admin-av.gold{background:linear-gradient(135deg,#f0c668,#b8860b)}
.admin-body{flex:1;min-width:0}
.admin-body b{font-size:13px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-body span{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.admin-actions{display:flex;gap:5px}

/* LISTS */
.list{padding:5px}
.row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;transition:all var(--dur) var(--ease)}
.row:hover{background:var(--surface-2)}
.row+.row{border-top:1px solid var(--line-2)}
.row-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.row-icon .icon{width:16px;height:16px}
.row-icon.plus{background:var(--green-soft);color:var(--green)}
.row-icon.minus{background:var(--red-soft);color:var(--red)}
.row-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row-main b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main span{font-size:10.5px;color:var(--muted)}
.row-amount{font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row-amount.plus{color:var(--green)}
.row-amount.minus{color:var(--red)}

.empty{text-align:center;padding:36px 18px;color:var(--muted);
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.empty .icon{width:36px;height:36px;opacity:.4;margin-bottom:10px}
.empty p{font-size:12.5px;line-height:1.6}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(3,27,69,.5);backdrop-filter:blur(5px);
  display:grid;place-items:center;z-index:100;padding:14px;
  padding-bottom:calc(14px + var(--safe-bot));animation:fade .2s var(--ease);
  overflow-y:auto;overscroll-behavior:contain}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);border-radius:20px;padding:22px;width:100%;
  max-width:400px;box-shadow:var(--shadow-lg);animation:modalIn .28s var(--ease);
  margin:auto;position:relative}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-box h3{font-size:16px;margin-bottom:14px;font-weight:700}
.modal-box input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;
  font-size:16px;outline:none;background:var(--surface-2);transition:all var(--dur) var(--ease);color:var(--text)}
.modal-box input:focus{border-color:var(--blue-2);background:var(--surface);
  box-shadow:0 0 0 4px rgba(24,120,245,.13)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}
.modal-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;
  display:grid;place-items:center;color:var(--muted)}
.modal-close:hover{background:var(--surface-2);color:var(--red)}

/* TOASTS */
.toasts{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(80px + var(--safe-bot));display:flex;flex-direction:column;
  gap:8px;z-index:200;pointer-events:none;max-width:calc(100vw - 20px);align-items:center}
.toast{background:var(--surface);border:1px solid var(--line);padding:10px 15px;
  border-radius:11px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-lg);
  animation:toastIn .28s var(--ease);display:flex;align-items:center;gap:8px;
  pointer-events:auto;max-width:100%}
.toast .icon{width:16px;height:16px;color:var(--blue)}
.toast.ok{border-left:4px solid var(--green)}
.toast.ok .icon{color:var(--green)}
.toast.err{border-left:4px solid var(--red)}
.toast.err .icon{color:var(--red)}
.toast.out{opacity:0;transform:translateY(12px);transition:all .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}

.money-float{position:fixed;pointer-events:none;font-weight:800;font-size:20px;
  color:var(--green);z-index:250;text-shadow:0 2px 10px rgba(15,168,106,.4);
  animation:floatUp 1.3s var(--ease) forwards}
.money-float.neg{color:var(--red)}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}
  25%{opacity:1;transform:translateY(-18px) scale(1.15)}
  100%{opacity:0;transform:translateY(-90px) scale(1)}}

/* SETTINGS */
.set-row{display:flex;align-items:center;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--line-2)}
.set-row:last-child{border-bottom:none}
.set-row .icon{color:var(--blue);width:17px;height:17px;flex:none}
.set-row .lbl{flex:1;font-size:12.5px;font-weight:600}
.set-row .lbl small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
.toggle{width:40px;height:24px;border-radius:12px;background:var(--line);
  position:relative;transition:background var(--dur) var(--ease);flex:none;cursor:pointer}
.toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;
  background:#fff;top:3px;left:3px;transition:transform var(--dur) var(--ease);
  box-shadow:0 2px 5px rgba(0,0,0,.2)}
.toggle.on{background:var(--blue-2)}
.toggle.on::after{transform:translateX(16px)}
.avatar-grid{display:flex;gap:6px;flex-wrap:wrap}
.av-pick{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:15px;cursor:pointer;
  transition:all var(--dur) var(--ease);border:2px solid transparent}
.av-pick:hover{transform:scale(1.08)}
.av-pick.sel{border-color:var(--blue-2);box-shadow:0 0 0 3px rgba(24,120,245,.2)}

@media (max-width:480px){
  .brand-text{display:none}
  .content{padding:12px 12px 110px}
  .hero-balance{font-size:26px}
  .hero{padding:15px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
  .card{padding:13px}
  .tap-coin{width:145px;height:145px}
  .bnav-btn{font-size:9.5px}
  .bnav-btn .icon{width:19px;height:19px}
  .balance-chip{display:none}
}
@media (min-width:900px){
  .bottom-nav{display:none}
  .content{padding-bottom:40px}
}
</style>

<script>
/* ============================================================
   Kvantum Bank — clean focused version
   ============================================================ */

const ADMIN_TG_ID = 5268787813; // Админ — этот Telegram ID
const DB_KEY = 'kvantum_db_v3';
const SES_KEY = 'kvantum_session_v3';
const THEME_KEY = 'kv_theme';
const SOUND_KEY = 'kv_sound';

const START_BALANCE = 1000;
const ENERGY_MAX = 100;
const ENERGY_REGEN = 1;      // 1 ед/сек
const TAP_BASE = 2;          // базовый тап
const COMBO_WINDOW = 1400;

/* ---------- Telegram ---------- */
const TG = window.Telegram?.WebApp;
let tgUser = null;
if(TG){
  TG.ready(); TG.expand();
  try{ TG.setHeaderColor?.('#0b5ed7'); TG.setBackgroundColor?.('#f4f8ff'); }catch(e){}
  try{ TG.disableVerticalSwipes?.(); }catch(e){}
  try{
    const u = TG.initDataUnsafe?.user;
    if(u) tgUser = {id:u.id, username:u.username||('tg'+u.id),
      first_name:u.first_name||'', last_name:u.last_name||''};
  }catch(e){}
}
function haptic(s){ try{ TG?.HapticFeedback?.impactOccurred(s||'light'); }catch(e){} }
function hapticNotify(s){ try{ TG?.HapticFeedback?.notificationOccurred(s||'success'); }catch(e){} }

/* ---------- Sound ---------- */
let actx = null;
let soundOn = localStorage.getItem(SOUND_KEY) !== 'off';
function beep(f, d, t, v){
  if(!soundOn) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = t||'sine'; o.frequency.value = f;
    g.gain.value = v||.05;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (d||.12));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (d||.12));
  }catch(e){}
}
const S = {
  click:()=>beep(660,.05,'square',.025),
  ok:()=>{beep(880,.08,'sine',.045); setTimeout(()=>beep(1320,.11,'sine',.045),65);},
  err:()=>beep(220,.14,'sawtooth',.05),
  cash:()=>{beep(1046,.06,'sine',.045); setTimeout(()=>beep(1568,.13,'sine',.045),65);},
  tap:()=>beep(720+Math.random()*160,.03,'sine',.018),
  combo:()=>{beep(1046,.05,'sine',.035); setTimeout(()=>beep(1568,.06,'sine',.035),45); setTimeout(()=>beep(2093,.08,'sine',.035),90);},
  levelUp:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.13,'sine',.045),i*85));}
};

/* ---------- Utils ---------- */
function fmt(n){
  n = Math.round(n);
  const abs = Math.abs(n);
  if(abs >= 1e9) return (n/1e9).toFixed(2).replace('.',',') + ' млрд ₽';
  if(abs >= 1e6) return (n/1e6).toFixed(2).replace('.',',') + ' млн ₽';
  return new Intl.NumberFormat('ru-RU').format(n) + ' ₽';
}
function fmtNum(n){
  n = Math.round(n);
  const abs = Math.abs(n);
  if(abs >= 1e9) return (n/1e9).toFixed(1).replace('.',',') + 'B';
  if(abs >= 1e6) return (n/1e6).toFixed(1).replace('.',',') + 'M';
  if(abs >= 1e4) return (n/1e3).toFixed(1).replace('.',',') + 'K';
  return new Intl.NumberFormat('ru-RU').format(n);
}
function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dateStr(ts){ return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function getLevel(u){ return Math.min(50, 1 + Math.floor((u.totalEarned||0) / 10000)); }

/* ---------- Storage ---------- */
let db = loadDB();
let currentUser = null;
let activeTab = 'home';

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    const p = raw ? JSON.parse(raw) : null;
    return (p && p.users) ? p : {users:{}};
  }catch(e){ return {users:{}}; }
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }
function getUser(){ return currentUser ? db.users[currentUser] : null; }

/* ---------- Crypto ---------- */
async function sha256(str){
  try{
    const buf = new TextEncoder().encode(str);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; }
    return 'fb'+Math.abs(h).toString(16);
  }
}

/* ---------- User model ---------- */
function newUser(login, tg){
  const now = Date.now();
  const isAdmin = !!(tg && tg.id === ADMIN_TG_ID);
  return {
    login, password:'', tgId: tg?.id || null, isAdmin,
    display: tg ? (tg.first_name + (tg.last_name ? ' ' + tg.last_name : '')) : login,
    avatar: {type:'gradient', id: rand(0, 7)},
    createdAt: now,
    balance: START_BALANCE, totalEarned: 0,
    businesses: [],
    history: [{t: now, title: 'Приветственный бонус', amount: START_BALANCE}],
    lastWork: {},
    tap: {energy: ENERGY_MAX, energyMax: ENERGY_MAX, combo:0, lastTap:0, lastEnergyRegen: now},
    stats: {taps:0, worksCount:0, bizCount:0, collects:0, transfersCount:0, adminGiven:0}
  };
}
function ensureUserFields(u){
  u.stats = u.stats || {};
  ['taps','worksCount','bizCount','collects','transfersCount','adminGiven'].forEach(k=>{
    if(typeof u.stats[k] !== 'number') u.stats[k] = 0;
  });
  u.tap = u.tap || {energy: ENERGY_MAX, energyMax: ENERGY_MAX, combo:0, lastTap:0, lastEnergyRegen: Date.now()};
  u.businesses = u.businesses || [];
  u.history = u.history || [];
  u.avatar = u.avatar || {type:'gradient', id: rand(0,7)};
  u.display = u.display || u.login;
  // Auto-admin if tgId matches
  if(u.tgId === ADMIN_TG_ID) u.isAdmin = true;
}

/* ---------- Balance & history ---------- */
function addMoney(u, amount, title){
  u.balance += amount;
  if(amount > 0) u.totalEarned = (u.totalEarned||0) + amount;
  u.history.unshift({t: Date.now(), title, amount});
  if(u.history.length > 200) u.history.length = 200;
}

/* ---------- Toast / float ---------- */
function toast(msg, type){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  const ic = type === 'ok' ? 'i-check' : (type === 'err' ? 'i-x' : 'i-info');
  el.className = 'toast ' + (type||'');
  el.innerHTML = `<svg class="icon"><use href="#${ic}"/></svg><span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),320); }, 2400);
}
function moneyFloat(amount, x, y){
  const el = document.createElement('div');
  el.className = 'money-float' + (amount < 0 ? ' neg' : '');
  el.textContent = (amount > 0 ? '+' : '') + fmt(amount);
  el.style.left = (x!=null ? x : window.innerWidth/2 - 40) + 'px';
  el.style.top = (y!=null ? y : window.innerHeight/2) + 'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1400);
}

/* ---------- Theme ---------- */
function applyTheme(mode){
  document.documentElement.dataset.theme = mode;
  const btn = document.getElementById('themeBtn');
  if(btn) btn.innerHTML = `<svg class="icon"><use href="#i-${mode==='dark'?'sun':'moon'}"/></svg>`;
  localStorage.setItem(THEME_KEY, mode);
  try{ TG?.setBackgroundColor?.(mode==='dark'?'#05101f':'#f4f8ff'); }catch(e){}
}
function toggleTheme(){
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  S.click(); haptic();
}

/* ---------- Modal ---------- */
function openModal(html, onMount){
  const m = document.getElementById('modal');
  document.getElementById('modalContent').innerHTML = html;
  m.classList.remove('hidden');
  if(onMount) setTimeout(onMount, 50);
}
function closeModal(){
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modalContent').innerHTML = '';
}
document.getElementById('modal').addEventListener('click', e => {
  if(e.target.id === 'modal') closeModal();
});

function askAmount(title, placeholder, subtitle){
  return new Promise(res => {
    openModal(`
      <button class="modal-close" data-mc="x"><svg class="icon sm"><use href="#i-x"/></svg></button>
      <h3>${esc(title)}</h3>
      ${subtitle ? `<p style="font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.5">${subtitle}</p>` : ''}
      <input id="_amt" type="number" min="1" step="1" placeholder="${placeholder||'0'}" inputmode="numeric">
      <div class="modal-actions">
        <button class="btn btn-outline" data-mc="cancel" type="button">Отмена</button>
        <button class="btn btn-primary" data-mc="ok" type="button">Подтвердить</button>
      </div>`, () => {
      const inp = document.getElementById('_amt');
      inp.focus();
      const ok = () => { const v = parseFloat(inp.value); closeModal(); res(isNaN(v) ? null : v); };
      document.querySelector('[data-mc="ok"]').onclick = ok;
      document.querySelector('[data-mc="cancel"]').onclick = () => { closeModal(); res(null); };
      document.querySelector('[data-mc="x"]').onclick = () => { closeModal(); res(null); };
      inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); ok(); } });
    });
  });
}
function confirmDlg(title, text){
  return new Promise(res => {
    openModal(`
      <h3>${esc(title)}</h3>
      ${text ? `<p style="font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.55">${esc(text)}</p>` : ''}
      <div class="modal-actions">
        <button class="btn btn-outline" data-mc="cancel" type="button">Отмена</button>
        <button class="btn btn-primary" data-mc="ok" type="button">Подтвердить</button>
      </div>`, () => {
      document.querySelector('[data-mc="ok"]').onclick = () => { closeModal(); res(true); };
      document.querySelector('[data-mc="cancel"]').onclick = () => { closeModal(); res(false); };
    });
  });
}

function bizDef(id){ return BUSINESSES.find(b=>b.id===id); }

/* Business income calculation */
function bizAccum(b, now){
  const def = bizDef(b.type); if(!def) return 0;
  const lvlMult = 1 + 0.35*(b.level-1);
  let periods = Math.floor((now - b.lastCollect) / def.period);
  const maxP = Math.floor((12*3600000)/def.period);
  if(periods > maxP) periods = maxP;
  return Math.round(periods * def.income * lvlMult);
}
function bizUpgradeCost(b){
  const def = bizDef(b.type);
  return Math.round(def.cost * Math.pow(1.8, b.level-1));
}
function bizTotalWallet(b){ return b.wallet || 0; }

/* ---------- App render ---------- */
let lastBalance = 0;
let balanceRAF = null;
function updateTopBalance(){
  const u = getUser(); if(!u) return;
  const el = document.getElementById('balanceTop');
  if(balanceRAF) cancelAnimationFrame(balanceRAF);
  const from = lastBalance, to = u.balance, start = performance.now();
  const step = now => {
    const p = Math.min(1, (now - start)/400);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = fmt(from + (to-from)*eased);
    if(p < 1) balanceRAF = requestAnimationFrame(step);
    else balanceRAF = null;
  };
  balanceRAF = requestAnimationFrame(step);
  lastBalance = u.balance;
}
function renderApp(){
  const u = getUser();
  if(!u) return;
  ensureUserFields(u);
  updateTopBalance();
  renderBnav();
  renderContent();
}
function renderContent(){
  const c = document.getElementById('content');
  const u = getUser(); if(!u) return;
  let html = '';
  switch(activeTab){
    case 'home':     html = viewHome(u); break;
    case 'earn':     html = viewEarn(u); break;
    case 'business': html = viewBusiness(u); break;
    case 'send':     html = viewSend(u); break;
    case 'admin':    html = u.isAdmin ? viewAdmin(u) : viewHome(u); break;
    case 'profile':  html = viewProfile(u); break;
  }
  c.innerHTML = `<div class="page-in">${html}</div>`;
  if(activeTab === 'earn' || activeTab === 'business') tick();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  const st = e.target.closest('[data-send-tab]');
  const chipR = e.target.closest('[data-pick-recipient]');
  const chipB = e.target.closest('[data-pick-biz]');

  if(st){ sendTab = st.dataset.sendTab; renderContent(); S.click(); return; }
  if(chipR){
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
    chipR.classList.add('sel');
    const inp = document.getElementById('trLogin');

    chipB.classList.add('sel');
    const inp = document.getElementById('trBizId');
    if(inp) inp.value = chipB.dataset.pickBiz;
    return;
  }

    case 'nav': activeTab = el.dataset.tab; renderApp(); window.scrollTo({top:0,behavior:'smooth'}); haptic(); S.click(); break;
    case 'toggleTheme': toggleTheme(); if(activeTab==='profile') renderContent(); break;

      S.click();
      break;
    case 'setAvatar':
      u.avatar = {type: el.dataset.type, id: +el.dataset.id};
      saveDB(); renderApp();
      break;
    case 'logout': doLogout(); break;
    case 'tap': doTap(); break;

    case 'adminGiveUser': adminGiveUser(el.dataset.id); break;
    case 'adminGiveBiz': adminGiveBiz(el.dataset.id); break;
    case 'adminGiveAll': adminGiveAll(); break;
  }
});

/* ---------- Tap ---------- */
function updateEnergy(u, now){
  const t = u.tap;
  const elapsed = (now - t.lastEnergyRegen) / 1000;
  if(elapsed > 0){
    t.energy = Math.min(t.energyMax, t.energy + elapsed * ENERGY_REGEN);
    t.lastEnergyRegen = now;
  }
}
function doTap(){
  const u = getUser(); if(!u) return;
  const now = Date.now();
  updateEnergy(u, now);
  if(u.tap.energy < 1){ S.err(); haptic('rigid'); return; }
  u.tap.energy -= 1;

  if(now - u.tap.lastTap < COMBO_WINDOW) u.tap.combo = Math.min(10, u.tap.combo + 1);
  else u.tap.combo = 1;
  u.tap.lastTap = now;

  const lvl = getLevel(u);
  const comboMult = Math.min(3, 1 + Math.floor((u.tap.combo-1) / 3) * 0.5);
  const base = TAP_BASE + Math.floor(lvl * 0.5);
  const amount = Math.max(1, Math.round(base * comboMult));
  addMoney(u, amount, 'Тап-заработок');
  u.stats.taps = (u.stats.taps||0) + 1;
  saveDB();

  const cx = window.innerWidth/2 + rand(-50,50);
  const cy = window.innerHeight/2 - 30 + rand(-30,30);
  moneyFloat(amount, cx, cy);

  S.tap(); haptic('light');

  const tapValueEl = document.getElementById('tapValue');
  if(tapValueEl) tapValueEl.textContent = '+' + fmt(amount) + ' за тап';
  const comboEl = document.getElementById('comboEl');
  if(comboEl){
    if(u.tap.combo >= 6){ comboEl.textContent = '🔥 COMBO ×' + u.tap.combo; comboEl.classList.add('fire'); S.combo(); }
    else if(u.tap.combo >= 3){ comboEl.textContent = 'COMBO ×' + u.tap.combo; comboEl.classList.remove('fire'); }
    else { comboEl.textContent = ''; comboEl.classList.remove('fire'); }
  }
  updateEnergyUI(u);
  updateTopBalance();
}
function updateEnergyUI(u){
  updateEnergy(u, Date.now());
  const bar = document.getElementById('energyBar');
  const lbl = document.getElementById('energyLbl');
  const pct = (u.tap.energy / u.tap.energyMax) * 100;
  if(bar){ bar.style.width = pct + '%'; bar.classList.toggle('low', pct < 25); }
  if(lbl) lbl.textContent = Math.floor(u.tap.energy) + ' / ' + u.tap.energyMax;
}
setInterval(() => {
  const u = getUser();
  if(!u || activeTab !== 'home') return;
  updateEnergyUI(u);
}, 900);

/* ---------- Work ---------- */
function doWork(id){
  const u = getUser();
  const job = JOBS.find(j => j.id === id); if(!job) return;
  if(getLevel(u) < job.minLevel){ toast('Нужен уровень ' + job.minLevel, 'err'); S.err(); return; }
  const now = Date.now();
  if(now - (u.lastWork[id] || 0) < job.cd){ toast('Ещё рано', 'err'); S.err(); return; }
  const amount = rand(job.pay[0], job.pay[1]);
  u.lastWork[id] = now;
  addMoney(u, amount, 'Работа: ' + job.name);
  u.stats.worksCount = (u.stats.worksCount||0) + 1;
  saveDB(); renderApp();
  moneyFloat(amount);
  toast('+' + fmt(amount), 'ok'); S.cash(); hapticNotify('success');
}

/* ---------- Business ---------- */
function buyBiz(type){
  const u = getUser();
  const def = bizDef(type); if(!def) return;
  if(u.balance < def.cost){ toast('Нужно ' + fmt(def.cost), 'err'); S.err(); return; }
  u.balance -= def.cost;
  u.businesses.push({
    id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,4),
    type, level: 1, wallet: 0,
    boughtAt: Date.now(), lastCollect: Date.now()
  });
  u.stats.bizCount = (u.stats.bizCount||0) + 1;
  addMoney(u, 0, 'Открыт: ' + def.name);
  saveDB(); renderApp();
  toast(def.name + ' открыт!', 'ok'); S.ok(); hapticNotify('success');
}
async function upgradeBiz(id){
  const u = getUser();
  const b = u.businesses.find(x => x.id === id); if(!b || b.level >= 5) return;
  const cost = bizUpgradeCost(b);
  if(u.balance < cost){ toast('Нужно ' + fmt(cost), 'err'); S.err(); return; }
  const ok = await confirmDlg('Улучшить до Lv.' + (b.level+1) + '?', 'Стоимость: ' + fmt(cost) + ' · Доход +35%');
  if(!ok) return;
  u.balance -= cost;
  b.level += 1;
  addMoney(u, 0, 'Улучшено до Lv.' + b.level);
  saveDB(); renderApp();
  toast('Lv.' + b.level + ' ✓', 'ok'); S.ok();
}
function collectBiz(id){
  const u = getUser();
  const b = u.businesses.find(x => x.id === id); if(!b) return;
  const now = Date.now();
  const def = bizDef(b.type);
  let periods = Math.floor((now - b.lastCollect) / def.period);
  const maxP = Math.floor((12*3600000)/def.period);
  if(periods > maxP) periods = maxP;
  const income = periods > 0 ? Math.round(periods * def.income * (1 + 0.35*(b.level-1))) : 0;
  const wallet = b.wallet || 0;
  const total = income + wallet;
  if(total <= 0){ toast('Пока нечего собирать', 'err'); return; }
  if(periods > 0) b.lastCollect += periods * def.period;
  b.wallet = 0;
  addMoney(u, total, 'Доход: ' + def.name);
  u.stats.collects = (u.stats.collects||0) + 1;
  saveDB(); renderApp();
  moneyFloat(total);
  toast('+' + fmt(total), 'ok'); S.cash(); hapticNotify('success');
}
function quickCollect(){
  const u = getUser();
  if(!u.businesses.length){ toast('Сначала купи бизнес', 'err'); return; }
  const now = Date.now();
  let total = 0;
  u.businesses.forEach(b => {
    const def = bizDef(b.type);
    let periods = Math.floor((now - b.lastCollect) / def.period);
    const maxP = Math.floor((12*3600000)/def.period);
    if(periods > maxP) periods = maxP;
    if(periods > 0){
      total += Math.round(periods * def.income * (1 + 0.35*(b.level-1)));
      b.lastCollect += periods * def.period;
    }
    if(b.wallet){ total += b.wallet; b.wallet = 0; }
  });
  if(total <= 0){ toast('Пока нечего собирать', 'err'); return; }
  addMoney(u, total, 'Сбор со всех бизнесов');
  u.stats.collects = (u.stats.collects||0) + 1;
  saveDB(); renderApp();
  moneyFloat(total);
  toast('+' + fmt(total), 'ok'); S.cash(); hapticNotify('success');
}

/* ---------- Transfer to user ---------- */
function doTransfer(){
  const u = getUser();
  const loginEl = document.getElementById('trLogin');
  const amtEl = document.getElementById('trAmount');
  const errBox = document.getElementById('trError');
  if(!loginEl || !amtEl) return;
  errBox.textContent = '';
  const login = loginEl.value.trim().toLowerCase();
  const amount = parseFloat(amtEl.value);

  if(!login){ errBox.textContent = 'Введите логин'; return; }
  if(login === currentUser){ errBox.textContent = 'Нельзя себе'; S.err(); return; }
  const to = db.users[login];
  if(!to){ errBox.textContent = 'Получатель не найден'; S.err(); return; }
  if(!(amount > 0)){ errBox.textContent = 'Некорректная сумма'; S.err(); return; }
  if(amount > u.balance){ errBox.textContent = 'Недостаточно средств'; S.err(); return; }

  u.balance -= amount;
  u.history.unshift({t: Date.now(), title: '→ ' + (to.display || to.login), amount: -amount});
  to.balance += amount;
  to.totalEarned = (to.totalEarned || 0) + amount;
  to.history.unshift({t: Date.now(), title: '← ' + (u.display || u.login), amount});
  u.stats.transfersCount = (u.stats.transfersCount||0) + 1;
  saveDB(); renderApp();
  toast('+' + fmt(amount) + ' → ' + (to.display || to.login), 'ok');
  S.cash(); hapticNotify('success');
  loginEl.value = ''; amtEl.value = '';
}

/* ---------- Transfer to business ---------- */
function doBizTransfer(){

function exportSave(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'kvantum-save.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Сохранение скачано', 'ok');
}
document.addEventListener('change', e => {
  if(e.target.id !== 'importFile') return;
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.users) throw new Error();
      db = data; saveDB();
      if(currentUser && db.users[currentUser]) renderApp();
      else doLogout();
      toast('Загружено', 'ok');
    }catch(err){ toast('Некорректный файл', 'err'); S.err(); }
  };
  r.readAsText(f);
});

/* ---------- Tick ---------- */
function tick(){
  const u = getUser(); if(!u) return;
  const now = Date.now();
  if(activeTab === 'earn'){
    JOBS.forEach(j => {
      const btn = document.getElementById('jobbtn-' + j.id);
      const cd = document.getElementById('jobcd-' + j.id);
      if(!btn || !cd) return;
      const left = j.cd - (now - (u.lastWork[j.id] || 0));
      if(left > 0){ btn.disabled = true; cd.textContent = '⏳ ' + Math.ceil(left/1000) + 'с'; }
      else { btn.disabled = false; cd.textContent = ''; }
    });
  }
  if(activeTab === 'business'){
    u.businesses.forEach(b => {
      const box = document.getElementById('bizacc-' + b.id);
      if(!box) return;
      const acc = bizAccum(b, now);
      box.innerHTML = `<span class="muted">Накоплен доход</span><b>${fmt(acc)}</b>`;
      const btn = document.querySelector(`[data-action="collect"][data-id="${b.id}"]`);
      if(btn) btn.disabled = acc <= 0 && (b.wallet || 0) <= 0;
    });
  }
}
setInterval(tick, 1000);

/* ---------- Auth ---------- */
function startSession(key){
  currentUser = key;
  localStorage.setItem(SES_KEY, key);
  ensureUserFields(db.users[key]);
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('authLogin').value = '';
  document.getElementById('authPass').value = '';
  activeTab = 'home';
  renderApp();
  saveDB();
}
function doLogout(){
  currentUser = null;
  localStorage.removeItem(SES_KEY);
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  closeModal();
  S.click();
}
document.querySelectorAll('[data-authtab]').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.authtab;
    document.getElementById('authSwitch').dataset.mode = mode;
    document.querySelectorAll('[data-authtab]').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('authSubmit').textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
    document.getElementById('authError').textContent = '';
    S.click();
  });
});
document.getElementById('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const login = document.getElementById('authLogin').value.trim();
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authError');
  err.textContent = '';
  const mode = document.getElementById('authSwitch').dataset.mode;
  if(login.length < 3){ err.textContent = 'Логин минимум 3 символа'; S.err(); return; }
  if(pass.length < 4){ err.textContent = 'Пароль минимум 4 символа'; S.err(); return; }
  const key = login.toLowerCase();
  const hash = await sha256(pass);
  if(mode === 'register'){
    if(db.users[key]){ err.textContent = 'Логин занят'; S.err(); return; }
    const u = newUser(login, null);
    u.password = hash;
    db.users[key] = u;
    saveDB();
    startSession(key);
    toast('Аккаунт создан! +1000 ₽', 'ok'); S.levelUp(); hapticNotify('success');
  }else{
    const u = db.users[key];
    if(!u || u.password !== hash){ err.textContent = 'Неверный логин или пароль'; S.err(); return; }
    startSession(key);
    toast('С возвращением, ' + u.login + '!', 'ok'); S.ok();
  }
});

/* ---------- Telegram auto-login ---------- */
function initTgLogin(){
  const btn = document.getElementById('tgLogin');
  const div = document.getElementById('tgDivider');
  if(!tgUser) return;
  btn.classList.remove('hidden');
  div.classList.remove('hidden');
  btn.onclick = () => {
    // Find user by tgId
    let key = Object.keys(db.users).find(k => db.users[k].tgId === tgUser.id);
    if(!key){
      // Create new
      const login = (tgUser.username || ('tg' + tgUser.id)).toLowerCase();
      key = login;
      if(db.users[key]){
        // login taken by non-tg user, append suffix
        key = login + '_' + tgUser.id.toString().slice(-4);
      }
      const u = newUser(key, tgUser);
      db.users[key] = u;
      saveDB();
    }
    startSession(key);
    const u = db.users[key];
    if(u.isAdmin){ toast('👑 Вход администратора', 'ok'); S.levelUp(); hapticNotify('success'); }
    else { toast('Добро пожаловать, ' + (u.display || u.login) + '!', 'ok'); S.ok(); }
  };
}

/* ---------- Boot ---------- */
function boot(){
  applyTheme(localStorage.getItem(THEME_KEY) || 'light');
  initTgLogin();
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    setTimeout(() => document.getElementById('splash').remove(), 400);
    const ses = localStorage.getItem(SES_KEY);
    if(ses && db.users[ses]){
      startSession(ses);
    }else if(tgUser){
      // Auto-session if tg user exists
      const key = Object.keys(db.users).find(k => db.users[k].tgId === tgUser.id);
      if(key) startSession(key);
      else document.getElementById('authScreen').classList.remove('hidden');
    }else{
      document.getElementById('authScreen').classList.remove('hidden');
    }
  }, 600);
}
window.addEventListener('load', boot);

/* ---------- Cross-tab ---------- */
window.addEventListener('storage', e => {
  if(e.key === DB_KEY){
    db = loadDB();
    if(currentUser && db.users[currentUser]) renderApp();
  }
});

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
  if(e.code === 'Space' && activeTab === 'home' && !e.target.matches('input')){
    e.preventDefault(); doTap();
  }
});

/* ---------- Tap coin visual feedback ---------- */
document.addEventListener('pointerdown', e => {
  const coin = e.target.closest('[data-action="tap"]');
  if(coin){ coin.style.transform = 'scale(.94)'; }
});
document.addEventListener('pointerup', e => {
  const coin = e.target.closest('[data-action="tap"]');
  if(coin){ setTimeout(() => { coin.style.transform = ''; }, 80); }
});
</script>
