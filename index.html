<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f0f6ff">
<title>1571 Сириус</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f0f6ff;
    --bg-2: #e0ecff;
    --card: #ffffff;
    --border: #d4e2f7;
    --text: #0a1a3a;
    --muted: #6b7fa3;
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --blue-light: #93b8f5;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior-y: none;
  }

  /* Простой фоновый градиент без анимации */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    pointer-events: none;
    z-index: -1;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 18px 16px 170px;
    min-height: 100vh;
  }

  /* ============ HEADER ============ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
    animation: slideDown 0.6s var(--ease) both;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 14px;
    background: var(--blue);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 900;
    font-size: 19px;
    letter-spacing: -1px;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1;
    min-width: 0;
  }

  .brand-num {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 3px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.4px;
    color: var(--text);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: rgba(37, 99, 235, 0.08);
    border: 1px solid rgba(37, 99, 235, 0.15);
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--blue);
  }

  /* ============ HERO ============ */
  .hero {
    margin-bottom: 22px;
    animation: slideUp 0.6s 0.05s var(--ease) both;
  }

  .tag {
    display: inline-block;
    padding: 6px 12px;
    background: rgba(37, 99, 235, 0.08);
    border: 1px solid rgba(37, 99, 235, 0.15);
    border-radius: 100px;
    font-size: 10.5px;
    color: var(--blue);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 700;
  }

  .h1 {
    font-size: clamp(26px, 7.5vw, 34px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1.3px;
    margin-bottom: 10px;
    color: var(--text);
    word-wrap: break-word;
  }

  .h1 em {
    font-style: normal;
    color: var(--blue);
  }

  .lead {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.55;
    max-width: 340px;
  }

  /* ============ UPLOAD ============ */
  .upload {
    position: relative;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 26px 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.3s, transform 0.2s;
    overflow: hidden;
    margin-bottom: 14px;
    min-height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: slideUp 0.6s 0.1s var(--ease) both;
    width: 100%;
  }

  .upload:active { transform: scale(0.985); }
  .upload input { display: none; }

  .upload-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .upload-icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: rgba(37, 99, 235, 0.08);
    display: grid;
    place-items: center;
    color: var(--blue);
    transition: background 0.3s;
  }

  .upload-icon svg { width: 24px; height: 24px; }

  .upload-title {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
  }

  .upload-hint {
    font-size: 11.5px;
    color: var(--muted);
  }

  .upload.has-photo {
    padding: 0;
    min-height: 280px;
    cursor: default;
    border-color: var(--blue);
  }

  .upload.has-photo .upload-inner { display: none; }

  .preview-img {
    display: none;
    width: 100%;
    height: 100%;
    min-height: 280px;
    object-fit: cover;
    position: absolute;
    inset: 0;
  }

  .upload.has-photo .preview-img { display: block; }

  .upload-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.5) 0%, transparent 50%);
    display: none;
    align-items: flex-end;
    justify-content: space-between;
    padding: 12px;
    z-index: 2;
  }

  .upload.has-photo .upload-overlay { display: flex; }

  .badge {
    padding: 6px 11px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--blue);
  }

  .remove-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    border: none;
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.25s var(--ease-back);
  }

  .remove-btn:active { transform: scale(0.88); }
  .remove-btn svg { width: 16px; height: 16px; }

  /* ============ FIELD ============ */
  .field {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px 16px 52px;
    transition: border-color 0.3s;
    margin-bottom: 14px;
    animation: slideUp 0.6s 0.15s var(--ease) both;
    width: 100%;
  }

  .field:focus-within { border-color: var(--blue); }

  .field-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 10px;
    display: block;
  }

  textarea {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    min-height: 100px;
    outline: none;
    line-height: 1.55;
    caret-color: var(--blue);
    -webkit-user-select: text;
    user-select: text;
  }

  textarea::placeholder { color: var(--muted); opacity: 0.55; }

  .field-foot {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }

  .counter-ring {
    position: relative;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .counter-ring svg {
    position: absolute;
    inset: 0;
    width: 38px;
    height: 38px;
    transform: rotate(-90deg);
  }

  .counter-ring .ring-bg {
    stroke: var(--border);
    fill: none;
    stroke-width: 2.5;
  }

  .counter-ring .ring-fill {
    stroke: var(--blue);
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 89.5;
    stroke-dashoffset: 89.5;
    transition: stroke-dashoffset 0.3s var(--ease), stroke 0.3s;
  }

  .counter-ring.danger .ring-fill { stroke: #e11d48; }

  .counter-ring .count {
    font-size: 10.5px;
    font-weight: 800;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ============ STATS ============ */
  .stats {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
    animation: slideUp 0.6s 0.2s var(--ease) both;
    text-align: center;
    flex-wrap: wrap;
  }

  .stats b { color: var(--blue); font-weight: 800; }

  /* ============ SUBMIT ============ */
  .submit-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    z-index: 100;
    pointer-events: none;
    animation: slideUp 0.6s 0.25s var(--ease) both;
  }

  .submit-btn {
    pointer-events: auto;
    position: relative;
    max-width: 500px;
    margin: 0 auto;
    width: 100%;
    height: 62px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 18px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s, transform 0.2s;
    overflow: hidden;
    font-family: inherit;
    -webkit-user-select: none;
    user-select: none;
  }

  .submit-btn:active:not(:disabled):not([data-state="loading"]) {
    transform: scale(0.97);
    background: var(--blue-dark);
  }

  .submit-btn:disabled { cursor: not-allowed; }

  .submit-btn[data-state="loading"],
  .submit-btn[data-state="success"] {
    cursor: default;
    background: var(--blue-dark);
  }

  /* Содержимое кнопки — текст */
  .btn-label {
    transition: opacity 0.25s ease;
    position: relative;
    z-index: 3;
  }

  .submit-btn[data-state="loading"] .btn-label,
  .submit-btn[data-state="success"] .btn-label {
    opacity: 0;
  }

  /* ============ ГРУЗОВИК ============ */
  .truck {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translate(-100%, -50%);
    display: flex;
    align-items: center;
    gap: 3px;
    opacity: 0;
    z-index: 2;
    pointer-events: none;
  }

  .truck svg {
    width: 40px;
    height: 26px;
    color: #fff;
  }

  /* Едет от левого края до правого */
  .submit-btn[data-state="loading"] .truck {
    opacity: 1;
    animation: truckDrive 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes truckDrive {
    0% {
      transform: translate(-100%, -50%);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    85% {
      transform: translate(calc(100vw - 80px), -50%);
      opacity: 1;
    }
    100% {
      transform: translate(calc(100vw - 60px), -50%);
      opacity: 0;
    }
  }

  /* Точки-дым из выхлопной трубы */
  .smoke {
    position: absolute;
    right: -6px;
    top: 4px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    opacity: 0;
  }

  .submit-btn[data-state="loading"] .smoke {
    animation: smoke 0.8s ease-out infinite;
  }

  .smoke:nth-child(3) { animation-delay: 0.2s; }
  .smoke:nth-child(4) { animation-delay: 0.4s; }

  @keyframes smoke {
    0% {
      transform: translate(0, 0) scale(1);
      opacity: 0.6;
    }
    100% {
      transform: translate(20px, -20px) scale(2.5);
      opacity: 0;
    }
  }

  /* ============ ГАЛОЧКА ============ */
  .success-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    opacity: 0;
    transition: opacity 0.3s ease 0.1s;
    z-index: 3;
  }

  .submit-btn[data-state="success"] .success-label {
    opacity: 1;
  }

  .success-label svg {
    width: 20px;
    height: 20px;
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
  }

  .submit-btn[data-state="success"] .success-label svg {
    animation: drawCheck 0.4s ease forwards;
  }

  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  /* Дорожные полосы на кнопке во время движения */
  .road-lines {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    height: 2px;
    opacity: 0;
    z-index: 1;
    background-image: linear-gradient(
      to right,
      transparent 0,
      transparent 8px,
      rgba(255, 255, 255, 0.35) 8px,
      rgba(255, 255, 255, 0.35) 20px,
      transparent 20px,
      transparent 28px
    );
    background-size: 28px 100%;
  }

  .submit-btn[data-state="loading"] .road-lines {
    opacity: 1;
    animation: roadMove 0.5s linear infinite;
  }

  @keyframes roadMove {
    to { background-position: -28px 0; }
  }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: none;
    justify-content: center;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    pointer-events: none;
    z-index: 9999;
  }

  .toast.show { display: flex; }

  .toast-inner {
    background: var(--card);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 13.5px;
    font-weight: 600;
    border: 1px solid var(--border);
    max-width: 100%;
    letter-spacing: -0.2px;
    animation: toastIn 0.4s var(--ease-back);
  }

  .toast.error .toast-inner {
    border-color: #fecaca;
    color: #b91c1c;
    background: #fef2f2;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============ АНИМАЦИИ ПОЯВЛЕНИЯ ============ */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .submit-btn[data-state="error"] { animation: shake 0.4s; }

  ::selection {
    background: var(--blue);
    color: #fff;
  }

  /* ============ МАЛЕНЬКИЕ ЭКРАНЫ ============ */
  @media (max-width: 380px) {
    .app { padding: 14px 12px 160px; }
    .h1 { font-size: 24px; letter-spacing: -0.9px; }
    .brand-mark { width: 40px; height: 40px; font-size: 17px; }
    .upload { min-height: 140px; padding: 22px 14px; }
    .field { padding: 14px 14px 48px; }
    .submit-btn { height: 58px; font-size: 15px; }
    .truck svg { width: 34px; height: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-text">
        <div class="brand-num">№ 1571</div>
        <div class="brand-name">СИРИУС</div>
      </div>
    </div>
    <div class="status"><span class="status-dot"></span>LIVE</div>
  </header>

  <section class="hero">
    <div class="tag">анонимно</div>
    <h1 class="h1">Расскажи, что<br>у тебя <em>на душе</em></h1>
    <p class="lead">Поделись историей. Отправим прямо в Telegram.</p>
  </section>

  <label class="upload" id="upload">
    <input type="file" id="photoInput" accept="image/*">
    <div class="upload-inner">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="9" cy="9" r="2"/>
          <path d="m21 15-4.586-4.586a2 2 0 0 0-2.828 0L3 21"/>
        </svg>
      </div>
      <div class="upload-title">Добавить фото</div>
      <div class="upload-hint">JPG, PNG до 5 МБ</div>
    </div>
    <img class="preview-img" id="preview" alt="">
    <div class="upload-overlay">
      <div class="badge">Прикреплено</div>
      <button class="remove-btn" id="removeBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </label>

  <div class="field">
    <label class="field-label">Текст поста</label>
    <textarea id="postText" maxlength="1024" placeholder="Напиши здесь свою историю..."></textarea>
    <div class="field-foot">
      <span>анонимно</span>
      <div class="counter-ring" id="counterRing">
        <svg viewBox="0 0 38 38">
          <circle class="ring-bg" cx="19" cy="19" r="14.25"/>
          <circle class="ring-fill" id="ringFill" cx="19" cy="19" r="14.25"/>
        </svg>
        <span class="count" id="counterText">0</span>
      </div>
    </div>
  </div>

  <div class="stats">
    Отправлено: <b id="postCount">0</b>
  </div>

</div>

<div class="submit-wrap">
  <button class="submit-btn" id="submitBtn" data-state="idle">
    <div class="road-lines"></div>

    <span class="btn-label" id="btnLabel">Отправить</span>

    <div class="truck">
      <svg viewBox="0 0 44 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <!-- Кабина -->
        <path d="M2 6 h18 v14 h-18 z" fill="none"/>
        <!-- Прицеп -->
        <path d="M20 8 h14 l6 6 v6 h-20 z" fill="none"/>
        <!-- Стекло кабины -->
        <path d="M22 10 h8 l4 4 h-12 z" fill="none"/>
        <!-- Колесо 1 -->
        <circle cx="10" cy="22" r="3" fill="none"/>
        <circle cx="10" cy="22" r="1" fill="currentColor"/>
        <!-- Колесо 2 -->
        <circle cx="32" cy="22" r="3" fill="none"/>
        <circle cx="32" cy="22" r="1" fill="currentColor"/>
      </svg>
      <span class="smoke"></span>
      <span class="smoke"></span>
      <span class="smoke"></span>
    </div>

    <div class="success-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
      <span>Отправлено</span>
    </div>
  </button>
</div>

<div class="toast" id="toast">
  <div class="toast-inner" id="toastText">Готово</div>
</div>

<script>
// ============================================================
//  URL твоего Worker'а
// ============================================================
const API_URL = 'https://shiny-flower-cc1aorbita-gate.2013zakharov.workers.dev/send';
// ============================================================


const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.setHeaderColor) tg.setHeaderColor('#f0f6ff');
  if (tg.setBackgroundColor) tg.setBackgroundColor('#f0f6ff');
  if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
}

const upload      = document.getElementById('upload');
const photoInput  = document.getElementById('photoInput');
const preview     = document.getElementById('preview');
const removeBtn   = document.getElementById('removeBtn');
const postText    = document.getElementById('postText');
const counterRing = document.getElementById('counterRing');
const ringFill    = document.getElementById('ringFill');
const counterText = document.getElementById('counterText');
const submitBtn   = document.getElementById('submitBtn');
const btnLabel    = document.getElementById('btnLabel');
const toast       = document.getElementById('toast');
const toastText   = document.getElementById('toastText');
const postCountEl = document.getElementById('postCount');

let photoFile = null;
let toastTimer = null;

// ---- Toast ----
function showToast(msg, isError) {
  clearTimeout(toastTimer);
  toastText.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  toastTimer = setTimeout(() => {
    toast.className = 'toast' + (isError ? ' error' : '');
  }, 3000);
}

// ---- Фото ----
photoInput.addEventListener('change', function (e) {
  const file = e.target.files[0];
  if (!file) return;

  if (file.type.indexOf('image/') !== 0) {
    showToast('Только изображения', true);
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast('Файл больше 5 МБ', true);
    return;
  }

  photoFile = file;
  const reader = new FileReader();
  reader.onload = function (ev) {
    preview.src = ev.target.result;
    upload.classList.add('has-photo');
  };
  reader.readAsDataURL(file);
});

removeBtn.addEventListener('click', function (e) {
  e.preventDefault();
  e.stopPropagation();
  photoFile = null;
  photoInput.value = '';
  preview.src = '';
  upload.classList.remove('has-photo');
});

// ---- Счётчик ----
const RING_MAX = 89.5;

function updateCounter() {
  const len = postText.value.length;
  const ratio = Math.min(len / 1024, 1);
  ringFill.style.strokeDashoffset = String(RING_MAX - RING_MAX * ratio);

  counterRing.classList.toggle('danger', len > 960);
  counterText.textContent = len > 999 ? '999+' : String(len);
}

// ---- Ввод ----
postText.addEventListener('input', function () {
  updateCounter();
  try { localStorage.setItem('sirius_draft', postText.value); } catch (e) {}
});

// ---- Восстановление черновика ----
(function () {
  try {
    const draft = localStorage.getItem('sirius_draft');
    if (draft) {
      postText.value = draft;
      updateCounter();
    }
  } catch (e) {}
})();

// ---- Счётчик постов ----
let postCount = 0;
try { postCount = parseInt(localStorage.getItem('sirius_post_count') || '0', 10); } catch (e) {}
postCountEl.textContent = String(postCount);

// ---- Состояние кнопки ----
function setBtnState(state, label) {
  submitBtn.dataset.state = state;
  if (label) btnLabel.textContent = label;
}

// ---- Отправка ----
submitBtn.addEventListener('click', async function () {
  if (submitBtn.dataset.state === 'loading') return;

  const text = postText.value.trim();

  if (!text && !photoFile) {
    submitBtn.dataset.state = 'error';
    showToast('Добавь текст или фото', true);
    setTimeout(() => setBtnState('idle', 'Отправить'), 700);
    return;
  }

  setBtnState('loading');

  // ---- Грузовик едет 1.6 секунды ----
  // Пока он едет — отправляем запрос параллельно

  const truckPromise = new Promise(resolve => setTimeout(resolve, 1600));

  try {
    let photoBase64 = null;
    if (photoFile) photoBase64 = await fileToBase64(photoFile);

    const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
    let fromLine = 'Mini App';
    if (user) {
      fromLine = (user.first_name || '') +
        (user.last_name ? ' ' + user.last_name : '') +
        (user.username ? ' · @' + user.username : '') +
        ' · ID ' + user.id;
    }

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text || '(без текста)',
        photo: photoBase64,
        from: fromLine
      })
    });

    const data = await res.json();

    if (!res.ok || !data.ok) {
      throw new Error(data.error || 'Ошибка ' + res.status);
    }

    // Ждём, пока грузовик доедет до конца
    await truckPromise;

    setBtnState('success');

    postCount++;
    try { localStorage.setItem('sirius_post_count', String(postCount)); } catch (e) {}
    postCountEl.textContent = String(postCount);

    setTimeout(function () {
      postText.value = '';
      try { localStorage.removeItem('sirius_draft'); } catch (e) {}
      updateCounter();
      removeBtn.click();
      setBtnState('idle', 'Отправить');
    }, 2000);

  } catch (err) {
    console.error(err);
    setBtnState('error');
    showToast(err.message || 'Не удалось отправить', true);
    setTimeout(function () { setBtnState('idle', 'Отправить'); }, 1200);
  }
});

// ---- Утилита ----
function fileToBase64(file) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { resolve(r.result.split(',')[1]); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
</script>
