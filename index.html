<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0b1b33"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:;"/>
<title>MiniOS 4.0</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============ THEME ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a1020;color:var(--ink);-webkit-user-select:none;user-select:none;}
:root{
  --blue-50:#eff5ff;--blue-100:#dfeaff;--blue-200:#c3d9ff;--blue-300:#9dc1ff;
  --blue-400:#5b9bff;--blue-500:#2b7fff;--blue-600:#1560e0;--blue-700:#0f47ac;
  --ink:#0c1c33;--muted:#6a80a0;--line:#e4ecfa;--card:#fff;--bg:#f6f9ff;
  --wp:linear-gradient(160deg,#dbeafe,#93c5fd 55%,#3b82f6);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --shadow:0 8px 22px rgba(9,36,80,.16);
}
:root.dark{
  --blue-50:#0e1e3a;--blue-100:#13264a;--blue-200:#1a3c6e;--blue-300:#2b5591;
  --ink:#eaf1ff;--muted:#8ba0c4;--line:#1c2c48;--card:#0d1a2e;--bg:#081022;
  --shadow:0 8px 22px rgba(0,0,0,.4);
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}
svg{width:100%;height:100%;display:block;pointer-events:none;}
img,video{display:block;max-width:100%;}
.phone{position:relative;width:min(430px,100vw);height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--wp);background-size:cover;background-position:center;transition:background .45s;}
@media(min-width:520px){body{display:flex;align-items:center;justify-content:center;}.phone{border-radius:38px;box-shadow:0 30px 90px rgba(4,20,50,.55),0 0 0 10px #0f1a2e,0 0 0 12px #1b2c4a;}}

/* ============ LIVE WALLPAPER ============ */
.wp-live{animation:wpShift 22s ease-in-out infinite alternate;background-size:250% 250% !important;}
@keyframes wpShift{0%{background-position:0% 30%}50%{background-position:100% 70%}100%{background-position:30% 100%}}

/* ============ LOCK ============ */
.lock{position:absolute;inset:0;z-index:40;background:var(--wp);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--st) + 62px) 26px calc(var(--sb) + 26px);color:#fff;transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .4s;touch-action:none;}
.lock.hidden{transform:translateY(-100%) scale(.96);opacity:0;pointer-events:none;}
.lock::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,30,70,.3),rgba(6,30,70,.05) 40%,rgba(6,30,70,.45));pointer-events:none;}
.lock>*{position:relative;z-index:2;}
.lock-top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .3s;}
.lock-icon{width:26px;height:26px;opacity:.9;margin-bottom:14px;}
.lock-time{font-size:74px;font-weight:200;letter-spacing:-3px;line-height:1;text-shadow:0 6px 30px rgba(4,24,60,.35);font-variant-numeric:tabular-nums;}
.lock-date{font-size:15px;font-weight:500;opacity:.92;text-transform:capitalize;}
.lock-card{margin:auto 0;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center;}
.lock-card .lc-ic{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.9);color:var(--blue-600);display:grid;place-items:center;padding:7px;flex:0 0 auto;}
.lock-card b{display:block;font-size:13px;font-weight:600;}
.lock-card span{font-size:12px;opacity:.85;}
.lock-bottom{display:flex;flex-direction:column;align-items:center;gap:18px;}
.swipe-hint{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:8px;}
.swipe-hint .arr{width:16px;height:16px;animation:up 1.8s infinite;}
@keyframes up{0%,100%{transform:translateY(3px);opacity:.5}50%{transform:translateY(-3px);opacity:1}}
.home-bar{width:130px;height:5px;border-radius:5px;background:rgba(255,255,255,.85);}
.lock-dnd{position:absolute;top:calc(var(--st) + 18px);right:20px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;padding:9px;z-index:5;border:1px solid rgba(255,255,255,.2);transition:all .25s;}
.lock-dnd.on{background:#fff;color:var(--blue-600);}
.lock-dnd svg{width:100%;height:100%;}

/* ============ HOME ============ */
.home{position:absolute;inset:0;z-index:10;background:var(--wp);background-size:cover;background-position:center;display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .35s;}
.home.blur{transform:scale(.94);opacity:.4;}
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 12px) 22px 6px;color:#fff;font-size:14px;font-weight:600;text-shadow:0 2px 10px rgba(4,24,60,.35);}
.sb-right{display:flex;align-items:center;gap:7px;}
.sb-ic{width:16px;height:16px;opacity:.95;}
.sb-bat{width:24px;height:12px;border:1.6px solid rgba(255,255,255,.95);border-radius:4px;position:relative;padding:1.5px;}
.sb-bat::after{content:'';position:absolute;right:-4px;top:3.5px;width:2.5px;height:5px;background:rgba(255,255,255,.95);border-radius:0 2px 2px 0;}
.sb-bat i{display:block;height:100%;background:#fff;border-radius:2px;transition:width .4s;}
.sb-lock{width:17px;height:17px;opacity:.95;margin-left:2px;}

/* ============ PAGES ============ */
.pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.page{flex:0 0 100%;height:100%;scroll-snap-align:start;overflow-y:auto;overflow-x:hidden;padding:10px 18px 6px;-webkit-overflow-scrolling:touch;}
.page-dots{display:flex;justify-content:center;gap:6px;padding:6px 0;min-height:14px;}
.page-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .25s;}
.page-dots i.on{background:#fff;width:20px;border-radius:3px;}

/* ============ WIDGETS ============ */
.widgets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.widget{background:rgba(255,255,255,.94);border-radius:22px;padding:14px 15px;box-shadow:var(--shadow);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);animation:pop .35s cubic-bezier(.3,1.4,.5,1);color:var(--ink);text-align:left;overflow:hidden;position:relative;grid-column:span 4;}
:root.dark .widget{background:rgba(13,26,46,.85);border-color:rgba(43,85,145,.4);}
.widget.s1{grid-column:span 1;}
.widget.s2{grid-column:span 2;}
.widget.s4{grid-column:span 4;}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
.w-lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--blue-500);opacity:.9;}
.w-clock{font-size:44px;font-weight:200;letter-spacing:-2px;line-height:1.05;font-variant-numeric:tabular-nums;}
.w-date{font-size:12.5px;color:var(--muted);text-transform:capitalize;margin-top:2px;}
.w-temp{font-size:34px;font-weight:300;letter-spacing:-1.5px;line-height:1.1;}
.w-sub{font-size:12px;color:var(--muted);}
.w-big{font-size:26px;font-weight:600;letter-spacing:-.5px;}
.w-bar{height:7px;border-radius:6px;background:var(--blue-100);overflow:hidden;margin-top:8px;}
.w-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue-400),var(--blue-600));}
.w-row{display:flex;align-items:center;gap:8px;}
.w-ic{width:20px;height:20px;color:var(--blue-500);flex:0 0 auto;}
.emptyw{grid-column:span 4;text-align:center;font-size:13px;color:#fff;opacity:.85;padding:18px;border:1.5px dashed rgba(255,255,255,.5);border-radius:20px;line-height:1.5;}

/* ============ GRID ============ */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;padding-bottom:16px;min-height:200px;}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;animation:pop .35s backwards;position:relative;}
.app:active .appicon{transform:scale(.88);}
.app.dragging{opacity:.4;}
.app.dragover .appicon{transform:scale(1.15);box-shadow:0 0 0 3px var(--blue-400),0 10px 24px rgba(43,127,255,.5);}
.appicon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;padding:15px;box-shadow:0 7px 16px rgba(9,36,80,.28),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .16s cubic-bezier(.3,1.5,.6,1);position:relative;overflow:hidden;}
.appicon::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);pointer-events:none;}
.appname{font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 6px rgba(4,24,60,.55);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge-dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:linear-gradient(160deg,#ff5b5b,#e11d48);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(226,29,72,.5);z-index:3;}
:root.dark .badge-dot{border-color:#0d1a2e;}

/* ============ DOCK ============ */
.dock{margin:0 14px calc(var(--sb) + 12px);padding:12px 10px;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;box-shadow:0 10px 30px rgba(4,24,60,.2);}
.dock .appname{display:none;}
.dock .appicon{width:54px;height:54px;}

/* ============ APP VIEW ============ */
.appview{position:absolute;inset:0;z-index:50;background:var(--bg);transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;}
.appview.open{transform:translateY(0);}
.appview[data-full="1"]{background:#000;}
.apphead{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 14px) 16px 14px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:5;}
.backbtn{width:38px;height:38px;border-radius:13px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;padding:10px;flex:0 0 auto;transition:background .2s;}
.backbtn:active{background:var(--blue-100);}
.apptitle{font-size:17px;font-weight:700;letter-spacing:-.3px;flex:1;}
.apphead-action{width:36px;height:36px;border-radius:12px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;padding:9px;}
.appbody{flex:1;overflow-y:auto;padding:16px 16px calc(var(--sb) + 22px);-webkit-overflow-scrolling:touch;}
.appview[data-full="1"] .apphead{display:none;}
.appview[data-full="1"] .appbody{padding:0;overflow:hidden;background:#000;}

/* ============ SEARCH ============ */
.search-overlay{position:absolute;inset:0;z-index:60;background:rgba(10,25,55,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:calc(var(--st) + 30px) 18px 30px;display:flex;flex-direction:column;transform:translateY(-100%);transition:transform .35s cubic-bezier(.32,.72,0,1);}
.search-overlay.open{transform:translateY(0);}
.search-box{background:rgba(255,255,255,.95);border-radius:18px;padding:14px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);}
:root.dark .search-box{background:rgba(13,26,46,.95);border:1px solid var(--line);}
.search-box svg{width:20px;height:20px;color:var(--muted);flex:0 0 auto;}
.search-box input{flex:1;border:none;outline:none;font-size:16px;background:transparent;color:var(--ink);}
.search-results{margin-top:18px;overflow-y:auto;flex:1;}
.sresult{display:flex;align-items:center;gap:12px;padding:13px 15px;background:rgba(255,255,255,.14);border-radius:16px;margin-bottom:9px;color:#fff;border:1px solid rgba(255,255,255,.1);transition:transform .12s;}
.sresult:active{transform:scale(.98);}
.sresult .appicon{width:42px;height:42px;border-radius:13px;padding:11px;box-shadow:none;}
.sresult .sname{font-size:14px;font-weight:600;}
.sresult .ssub{font-size:11.5px;opacity:.7;}
.sempty{text-align:center;color:rgba(255,255,255,.6);padding:40px 20px;font-size:14px;}

/* ============ CONTEXT MENU ============ */
.ctxmenu{position:absolute;z-index:70;background:rgba(255,255,255,.97);border-radius:20px;padding:6px;box-shadow:0 16px 48px rgba(0,0,0,.35);min-width:200px;animation:pop .18s;backdrop-filter:blur(20px);}
:root.dark .ctxmenu{background:rgba(13,26,46,.98);border:1px solid var(--line);}
.ctxmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;color:var(--ink);text-align:left;transition:background .15s;}
.ctxmenu button:active{background:var(--blue-50);}
.ctxmenu button.danger{color:#e23b3b;}
.ctxmenu .ci{width:20px;height:20px;flex:0 0 auto;}
.ctxmenu hr{border:none;border-top:1px solid var(--line);margin:4px 8px;}

/* ============ RECENTS ============ */
.recents{position:absolute;inset:0;z-index:55;background:rgba(10,20,40,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:calc(var(--st) + 30px) 18px calc(var(--sb) + 30px);display:none;flex-direction:column;}
.recents.open{display:flex;}
.recents-title{color:#fff;font-size:16px;font-weight:700;margin-bottom:16px;text-align:center;}
.recents-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-y:auto;flex:1;}
.recent-card{background:rgba(255,255,255,.1);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.14);transition:transform .15s;cursor:pointer;}
.recent-card:active{transform:scale(.96);}
.recent-head{display:flex;align-items:center;gap:10px;padding:10px 12px;}
.recent-head .appicon{width:32px;height:32px;border-radius:10px;padding:8px;box-shadow:none;}
.recent-head span{color:#fff;font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.recent-preview{height:120px;background:linear-gradient(160deg,var(--blue-500),var(--blue-700));display:grid;place-items:center;color:rgba(255,255,255,.5);padding:20px;}
.recent-close{width:26px;height:26px;color:rgba(255,255,255,.7);padding:5px;}

/* ============ COMMON ============ */
.btn{background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 6px 16px rgba(21,96,224,.28);transition:transform .15s;}
.btn:active{transform:scale(.95);}
.btn.ghost{background:var(--blue-50);color:var(--blue-600);box-shadow:none;}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:11px;}
.btn.danger{background:linear-gradient(160deg,#ff8a8a,#e23b3b);}
.card{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line);box-shadow:0 4px 16px rgba(20,60,130,.05);}
.sect{margin-bottom:18px;}
.sect h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 10px 4px;font-weight:700;}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border-bottom:1px solid var(--line);}
.row:first-child{border-radius:18px 18px 0 0;}
.row:last-child{border-bottom:none;border-radius:0 0 18px 18px;}
.row:only-child{border-radius:18px;}
.row-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;padding:8px;flex:0 0 auto;}
.row-t{flex:1;font-size:14px;font-weight:600;}
.row-s{font-size:11.5px;color:var(--muted);font-weight:500;}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 20px;line-height:1.6;}
.hintline{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5;}
.switch{width:48px;height:28px;border-radius:20px;background:var(--blue-100);position:relative;transition:background .25s;flex:0 0 auto;}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(10,40,90,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1);}
.switch.on{background:var(--blue-500);}
.switch.on i{transform:translateX(20px);}
.badge{display:inline-block;padding:3px 9px;border-radius:8px;background:var(--blue-50);color:var(--blue-600);font-size:11px;font-weight:700;}

/* ============ GALLERY ============ */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.gtile{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:var(--blue-100);transition:transform .15s;box-shadow:0 4px 14px rgba(20,60,130,.12);content-visibility:auto;contain-intrinsic-size:120px;}
.gtile:active{transform:scale(.94);}
.gtile img{width:100%;height:100%;object-fit:cover;display:block;}
.gtile-video::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:rgba(10,25,55,.65);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.9);}
.gtile-video::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-40%,-50%);width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;z-index:2;}
.gtile-vdur{position:absolute;bottom:5px;right:5px;background:rgba(10,25,55,.7);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;z-index:3;}
.gtile-add{display:grid;place-items:center;background:linear-gradient(160deg,var(--blue-50),var(--blue-100));color:var(--blue-500);border:2px dashed var(--blue-300);font-size:32px;font-weight:300;}
.gtile-add svg{width:38px;height:38px;padding:8px;}
.gtile-skel{background:linear-gradient(90deg,var(--blue-100) 25%,var(--blue-200) 50%,var(--blue-100) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:14px;aspect-ratio:1;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.gal-counter{font-size:12px;color:var(--muted);font-weight:600;text-align:center;margin-bottom:10px;}

/* ============ VIEWER / EDITOR ============ */
.viewer{position:fixed;inset:0;z-index:100;background:rgba(4,14,34,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;padding:calc(var(--st) + 12px) 14px calc(var(--sb) + 14px);animation:fade .25s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.viewer-top{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:12px;}
.viewer-close{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;padding:10px;}
.viewer-info{font-size:13px;opacity:.8;}
.viewer-stage{flex:1;display:grid;place-items:center;overflow:hidden;position:relative;border-radius:20px;background:rgba(0,0,0,.35);touch-action:none;}
.viewer-stage img,.viewer-stage video{max-width:100%;max-height:100%;border-radius:16px;display:block;box-shadow:0 20px 60px rgba(0,0,0,.5);transition:filter .25s;transform-origin:center;}
.viewer-stage canvas{position:absolute;inset:0;pointer-events:none;}
.viewer-stage.draw canvas{pointer-events:auto;cursor:crosshair;}
.viewer-tools{display:flex;gap:8px;padding:12px 0;overflow-x:auto;scrollbar-width:none;}
.toolchip{flex:0 0 auto;padding:9px 15px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.16);transition:all .18s;display:flex;align-items:center;gap:6px;}
.toolchip.active{background:#fff;color:var(--blue-700);}
.toolchip .ti{width:15px;height:15px;}
.viewer-actions{display:flex;gap:8px;padding-top:6px;}
.viewer-actions .btn{flex:1;padding:12px;font-size:13px;}
.sliderbox{background:rgba(255,255,255,.1);border-radius:16px;padding:12px 15px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.sliderbox label{color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.7px;opacity:.75;display:flex;justify-content:space-between;}
.sliderbox input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:rgba(255,255,255,.25);outline:none;}
.sliderbox input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4);}
.sliderbox input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#fff;}

/* ============ CAMERA ============ */
.cam{position:relative;width:100%;height:100%;background:#000;overflow:hidden;}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
.cam video.mirror{transform:scaleX(-1);}
.cam-overlay{position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 22%,transparent 68%,rgba(0,0,0,.65));}
.cam-grid{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .25s;}
.cam-grid.on{opacity:.55;}
.cam-grid i{position:absolute;background:rgba(255,255,255,.65);}
.cam-grid i:nth-child(1){left:33.33%;top:0;bottom:0;width:1px;}
.cam-grid i:nth-child(2){left:66.66%;top:0;bottom:0;width:1px;}
.cam-grid i:nth-child(3){top:33.33%;left:0;right:0;height:1px;}
.cam-grid i:nth-child(4){top:66.66%;left:0;right:0;height:1px;}
.cam-topbar{position:absolute;top:calc(var(--st) + 12px);left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;padding:0 14px;}
.cam-chip{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;border-radius:14px;background:rgba(10,25,55,.55);color:#fff;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:all .25s;}
.cam-chip .ci{width:15px;height:15px;display:block;}
.cam-chip[disabled]{opacity:.35;pointer-events:none;}
.cam-chip.on{background:linear-gradient(160deg,#ffd166,#ff9f1c);color:#1b1b1b;border-color:rgba(255,255,255,.75);box-shadow:0 6px 20px rgba(255,159,28,.5);}
.cam-chip.on .ci{color:#1b1b1b;}
.cam-modes{position:absolute;bottom:130px;left:0;right:0;z-index:5;display:flex;gap:6px;justify-content:center;}
.cam-mode{padding:7px 16px;border-radius:999px;background:rgba(10,25,55,.5);color:rgba(255,255,255,.7);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);transition:all .2s;}
.cam-mode.active{background:#fff;color:var(--blue-700);border-color:#fff;}
.cam-bottombar{position:absolute;bottom:0;left:0;right:0;z-index:5;padding:16px 26px calc(var(--sb) + 22px);display:flex;align-items:center;justify-content:space-between;gap:16px;}
.cam-thumb{width:56px;height:56px;border-radius:16px;border:2px solid rgba(255,255,255,.85);background:linear-gradient(160deg,#6fb2ff,#1a63e0);background-size:cover;background-position:center;box-shadow:0 6px 20px rgba(0,0,0,.4);flex:0 0 auto;}
.cam-shutter{width:84px;height:84px;border-radius:50%;padding:5px;border:3px solid #fff;background:transparent;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .12s;flex:0 0 auto;}
.cam-shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:all .2s;}
.cam-shutter:active{transform:scale(.9);}
.cam-shutter.rec i{background:#ff3b3b;border-radius:10px;transform:scale(.55);}
.cam-shutter.rec{border-color:#ff3b3b;}
.cam-side{width:56px;height:56px;border-radius:16px;background:rgba(10,25,55,.5);color:#fff;display:grid;place-items:center;padding:16px;border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);flex:0 0 auto;}
.cam-timer{position:absolute;top:calc(var(--st) + 70px);left:50%;transform:translateX(-50%);z-index:6;background:rgba(255,59,59,.92);color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.8px;display:none;align-items:center;gap:7px;}
.cam-timer.on{display:flex;}
.cam-timer .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.cam-flash{position:absolute;inset:0;background:#fff;z-index:9;pointer-events:none;opacity:0;}
.cam-flash.fire{animation:cflash .22s ease-out;}
@keyframes cflash{0%{opacity:0}35%{opacity:.95}100%{opacity:0}}
.cam-fallback{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;color:#fff;background:linear-gradient(160deg,#0d1a33,#05132a);}
.cam-fallback .cf-ic{width:64px;height:64px;color:#6fb2ff;margin-bottom:8px;}
.cam-fallback .cf-t{font-size:19px;font-weight:700;}
.cam-fallback .cf-s{font-size:13px;opacity:.75;max-width:300px;line-height:1.55;margin-bottom:8px;}

/* ============ STORE ============ */
.tabs{display:flex;gap:8px;background:var(--blue-50);padding:5px;border-radius:16px;margin-bottom:16px;}
.tab{flex:1;padding:10px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--blue-600);transition:all .22s;}
.tab.active{background:var(--card);color:var(--blue-700);box-shadow:0 3px 10px rgba(21,96,224,.15);}
.storeitem{display:flex;align-items:center;gap:13px;background:var(--card);padding:13px;border-radius:18px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(20,60,130,.05);}
.storeitem .appicon{width:50px;height:50px;border-radius:15px;padding:13px;box-shadow:none;}
.si-info{flex:1;min-width:0;}
.si-info b{display:block;font-size:14px;font-weight:700;}
.si-info span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ============ WALLPAPER ============ */
.wpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.wpswatch{aspect-ratio:.62;border-radius:16px;border:2.5px solid transparent;transition:all .2s;box-shadow:0 4px 14px rgba(20,60,130,.12);background-size:cover;background-position:center;}
.wpswatch.sel{border-color:var(--blue-500);transform:scale(1.04);box-shadow:0 6px 18px rgba(21,96,224,.35);}
.uploadbtn{grid-column:span 4;padding:14px;border-radius:16px;background:linear-gradient(160deg,var(--blue-50),var(--blue-100));color:var(--blue-700);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--blue-300);}
.uploadbtn svg{width:18px;height:18px;}

/* ============ CALC ============ */
.calc{display:flex;flex-direction:column;gap:14px;}
.calc-screen{background:linear-gradient(160deg,var(--blue-50),var(--blue-100));border-radius:24px;padding:26px 20px;text-align:right;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;}
.calc-out{font-size:44px;font-weight:300;letter-spacing:-2px;color:var(--blue-700);overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.ckey{aspect-ratio:1;border-radius:20px;background:var(--card);font-size:21px;font-weight:600;color:var(--ink);box-shadow:0 4px 12px rgba(20,60,130,.08);display:grid;place-items:center;}
.ckey:active{transform:scale(.92);}
.ckey.op{background:var(--blue-50);color:var(--blue-600);}
.ckey.eq{background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;}
.ckey.zero{grid-column:span 2;aspect-ratio:auto;}

/* ============ NOTES ============ */
.notenew{display:flex;gap:9px;margin-bottom:16px;}
.notenew input{flex:1;padding:13px 16px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);font-size:14px;outline:none;color:var(--ink);}
.notenew input:focus{border-color:var(--blue-400);}
.notenew .btn{padding:0;width:48px;display:grid;place-items:center;}
.notenew .btn svg{width:20px;height:20px;}
.note{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:10px;position:relative;border:1px solid var(--line);box-shadow:0 3px 12px rgba(20,60,130,.05);}
.note-t{font-size:14px;font-weight:600;line-height:1.4;padding-right:36px;word-break:break-word;}
.note-d{font-size:11px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:8px;}
.note .x{position:absolute;top:8px;right:8px;width:36px;height:36px;color:var(--muted);padding:9px;display:grid;place-items:center;}
.note .x:active{color:#e23b3b;}
.voice-note{background:linear-gradient(160deg,var(--blue-50),var(--blue-100));border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-top:8px;}
.voice-note audio{flex:1;height:32px;}
.voice-rec-btn{background:linear-gradient(160deg,#ff5b5b,#e11d48);color:#fff;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;padding:12px;flex:0 0 auto;transition:transform .12s;}
.voice-rec-btn.rec{animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,29,72,.6)}50%{box-shadow:0 0 0 12px rgba(226,29,72,0)}}

/* ============ MUSIC ============ */
.cover{width:200px;height:200px;border-radius:28px;margin:10px auto 22px;display:grid;place-items:center;color:#fff;box-shadow:0 18px 44px rgba(21,96,224,.28);padding:56px;background:linear-gradient(150deg,#6fb2ff,#1a63e0);transition:transform .4s;}
.cover.playing{animation:spin 9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.mtitle{text-align:center;font-size:19px;font-weight:700;}
.martist{text-align:center;font-size:13px;color:var(--muted);margin-top:4px;}
.progress{height:6px;border-radius:6px;background:var(--blue-100);margin:20px 0 6px;overflow:hidden;}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue-400),var(--blue-600));border-radius:6px;transition:width .3s linear;}
.ptime{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.mcontrols{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:22px;}
.mbtn{width:52px;height:52px;border-radius:50%;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;padding:15px;}
.mbtn.main{width:68px;height:68px;background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;padding:20px;box-shadow:0 10px 26px rgba(21,96,224,.35);}
.tracklist{margin-top:26px;}
.track{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;}
.track.active{background:var(--blue-50);}
.track .tn{flex:1;font-size:13.5px;font-weight:600;}
.track .td{font-size:11.5px;color:var(--muted);}

/* ============ CHAT ============ */
.chat{display:flex;flex-direction:column;gap:9px;padding-bottom:12px;}
.msg{max-width:80%;padding:11px 15px;border-radius:19px;font-size:14px;line-height:1.45;word-break:break-word;}
.msg.me{align-self:flex-end;background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;border-bottom-right-radius:6px;}
.msg.you{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px;border:1px solid var(--line);}
.chatbar{display:flex;gap:9px;margin-top:14px;}
.chatbar input{flex:1;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:14px;outline:none;color:var(--ink);}
.chatbar .btn{width:48px;padding:0;display:grid;place-items:center;}
.chatbar .btn svg{width:20px;height:20px;}

/* ============ WEATHER ============ */
.whero{background:linear-gradient(160deg,#5b9bff,#1560e0);border-radius:26px;padding:26px 22px;color:#fff;text-align:center;box-shadow:0 14px 34px rgba(21,96,224,.3);margin-bottom:16px;}
.whero .t{font-size:66px;font-weight:200;letter-spacing:-3px;line-height:1;}
.whero .c{font-size:14px;opacity:.9;margin-top:8px;}
.whero .ic{width:52px;height:52px;margin:0 auto 12px;}
.wdays{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.wday{background:var(--card);border-radius:18px;padding:13px 6px;text-align:center;border:1px solid var(--line);}
.wday b{display:block;font-size:12px;font-weight:700;color:var(--muted);}
.wday .di{width:24px;height:24px;margin:9px auto;color:var(--blue-500);}
.wday span{font-size:13px;font-weight:700;}

/* ============ CALENDAR ============ */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.calhead b{font-size:16px;font-weight:700;text-transform:capitalize;}
.calnav{width:36px;height:36px;border-radius:12px;background:var(--blue-50);color:var(--blue-600);display:grid;place-items:center;padding:9px;}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.calwd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;}
.calday{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-size:13px;font-weight:600;color:var(--ink);}
.calday.mute{color:var(--muted);opacity:.4;}
.calday.today{background:linear-gradient(160deg,var(--blue-400),var(--blue-600));color:#fff;}

/* ============ BROWSER ============ */
.urlbar{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:16px;padding:10px 14px;border:1.5px solid var(--line);margin-bottom:14px;}
.urlbar .lk{width:15px;height:15px;color:var(--blue-500);flex:0 0 auto;}
.urlbar input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--ink);}
.bhome{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.bsite{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line);text-align:left;}
.bsite .bi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;padding:8px;margin-bottom:10px;}
.bsite b{font-size:13.5px;display:block;}
.bsite span{font-size:11px;color:var(--muted);}
.bpage h2{font-size:20px;margin:0 0 12px;}
.bpage p{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 12px;}

/* ============ GAMES ============ */
.gamegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;user-select:none;}
.g2048{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--ink);background:var(--blue-100);transition:all .12s;}
.g2048[data-v="2"]{background:#eef4ff;color:#3d5a8a;}
.g2048[data-v="4"]{background:#dce8ff;color:#2f4a7a;}
.g2048[data-v="8"]{background:#c3d9ff;color:#1a3c6e;}
.g2048[data-v="16"]{background:#9dc1ff;color:#0f2745;}
.g2048[data-v="32"]{background:#6fa8ff;color:#fff;}
.g2048[data-v="64"]{background:#4285f4;color:#fff;}
.g2048[data-v="128"]{background:#2b7fff;color:#fff;font-size:16px;}
.g2048[data-v="256"]{background:#1560e0;color:#fff;font-size:16px;}
.g2048[data-v="512"]{background:#0f47ac;color:#fff;font-size:16px;}
.g2048[data-v="1024"]{background:#0a3585;color:#fff;font-size:14px;}
.g2048[data-v="2048"]{background:#062060;color:#fff;font-size:14px;}
.g2048[data-v="0"]{background:var(--blue-50);}
.snake-canvas{width:100%;aspect-ratio:1;border-radius:20px;background:var(--blue-50);display:block;touch-action:none;}

/* ============ DND ============ */
.dnd-banner{position:absolute;top:calc(var(--st) + 46px);left:50%;transform:translateX(-50%);background:rgba(255,215,102,.95);color:#1b1b1b;padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.4px;z-index:15;display:none;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(255,215,102,.4);}
.dnd-banner.on{display:flex;}
.dnd-banner svg{width:14px;height:14px;}

/* ============ TOAST ============ */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(10,25,55,.94);color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:200;opacity:0;transition:all .3s;pointer-events:none;backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ FLASHLIGHT QUICK ============ */
.quick-flash{position:absolute;top:calc(var(--st) + 18px);left:20px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;padding:9px;z-index:5;border:1px solid rgba(255,255,255,.2);transition:all .25s;}
.quick-flash.on{background:linear-gradient(160deg,#ffd166,#ff9f1c);color:#1b1b1b;box-shadow:0 6px 20px rgba(255,159,28,.5);}

/* ============ FALLBACK ============ */
.smallcard{background:var(--card);border-radius:22px;padding:24px 18px;text-align:center;box-shadow:0 4px 16px rgba(20,60,130,.06);border:1px solid var(--line);}
.smallcard .big{font-size:54px;font-weight:200;letter-spacing:-2.5px;color:var(--blue-600);}
.smallcard .sub{font-size:12.5px;color:var(--muted);text-transform:capitalize;margin-top:4px;}

/* ============ RING ============ */
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;position:relative;}
.ring .inner{position:absolute;inset:9px;border-radius:50%;background:var(--bg);display:grid;place-items:center;}
</style>
</head>
<body>

<div class="phone" id="phone">

  <section class="lock" id="lock">
    <button class="lock-dnd" id="lockDnd" title="Не беспокоить"></button>
    <div class="lock-top" id="lockTop">
      <div class="lock-icon" id="lockIcon"></div>
      <div class="lock-time" data-live="time">00:00</div>
      <div class="lock-date" data-live="date"></div>
    </div>
    <div class="lock-card">
      <div class="lc-ic" id="lcIcon"></div>
      <div><b>MiniOS 4.0</b><span>Свайп вверх для разблокировки</span></div>
    </div>
    <div class="lock-bottom">
      <div class="swipe-hint"><span class="arr" id="arrIcon"></span> Проведите вверх</div>
      <div class="home-bar"></div>
    </div>
  </section>

  <section class="home" id="home">
    <div class="dnd-banner" id="dndBanner"><span id="dndIco"></span>Не беспокоить</div>
    <div class="statusbar">
      <div data-live="time">00:00</div>
      <div class="sb-right">
        <span class="sb-ic" id="sbSignal"></span>
        <span class="sb-ic" id="sbWifi"></span>
        <span class="sb-bat"><i id="sbBat" style="width:87%"></i></span>
        <button class="sb-lock" id="lockBtn"></button>
      </div>
    </div>
    <div class="pages" id="pages"></div>
    <div class="page-dots" id="pageDots"></div>
    <div class="dock" id="dock"></div>
  </section>

  <div class="search-overlay" id="searchOverlay">
    <div class="search-box">
      <span id="searchIco"></span>
      <input id="searchInput" placeholder="Поиск приложений, заметок..."/>
      <button id="searchClose" style="width:20px;height:20px;color:var(--muted)"></button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <section class="recents" id="recentsPanel"></section>
  <section class="appview" id="appView"></section>
  <div id="ctxRoot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   ICONS
   ========================================================== */
const _svgCache = new Map();
const svg=(p,f)=>{
  const key=p+'|'+(f||'');
  if(_svgCache.has(key)) return _svgCache.get(key);
  const out=`<svg viewBox="0 0 24 24" fill="${f||'none'}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  _svgCache.set(key,out);
  return out;
};

const I={
  photos:svg('<rect x="3" y="4.5" width="18" height="15" rx="3.6"/><circle cx="9" cy="10" r="1.8"/><path d="M3.6 17.4l4.2-3.9a2 2 0 0 1 2.7 0l2.9 2.7"/><path d="M13.9 15.8l1.7-1.5a2 2 0 0 1 2.7 0l2.1 1.9"/>'),
  browser:svg('<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.5 2.7 2.5 14.3 0 17"/><path d="M12 3.5c-2.5 2.7-2.5 14.3 0 17"/>'),
  settings:svg('<circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.3M12 19.1v2.3M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.3M19.1 12h2.3M4.4 19.6l1.6-1.6M18 6l1.6-1.6"/>'),
  calculator:svg('<rect x="5" y="2.8" width="14" height="18.4" rx="3.4"/><rect x="8.2" y="5.8" width="7.6" height="3.2" rx="1.2"/><path d="M8.8 12.7h.01M12 12.7h.01M15.2 12.7h.01M8.8 16.4h.01M12 16.4h.01M15.2 16.4h.01"/>'),
  notes:svg('<rect x="4" y="3" width="16" height="18" rx="3.4"/><path d="M8 8.2h8M8 12h8M8 15.8h5"/>'),

/* ==========================================================
   DB (IndexedDB with Blob support)
   ========================================================== */
const DB='minios',STORE='media';
let _db=null;
function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE))
        d.createObjectStore(STORE,{keyPath:'id'});
    };
    r.onsuccess=e=>{_db=e.target.result;res(_db);};
    r.onerror=()=>rej(r.error);
  });
}
function dbOp(mode,fn){
  return openDB().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction(STORE,mode);
    const req=fn(tx.objectStore(STORE));
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  }));
}
const dbAll=()=>dbOp('readonly',s=>s.getAll());
const dbAdd=item=>dbOp('readwrite',s=>s.add(item));
const dbPut=item=>dbOp('readwrite',s=>s.put(item));
const dbDel=id=>dbOp('readwrite',s=>s.delete(id));
const dbClear=()=>dbOp('readwrite',s=>s.clear());

   WALLPAPER
   ========================================================== */
const phone=$('#phone'),lock=$('#lock'),home=$('#home');
let wpObjectUrl=null;

function applyWallpaper(){
  const wp=state.wallpaper;
  if(wpObjectUrl){try{URL.revokeObjectURL(wpObjectUrl);}catch(e){}wpObjectUrl=null;}
  [phone,lock,home].forEach(el=>{
    el.classList.remove('wp-live');
    el.style.backgroundImage='';
    el.style.background='';
  });

  if(wp.t==='custom'&&wp.blob){
    wpObjectUrl=URL.createObjectURL(wp.blob);
    [phone,lock,home].forEach(el=>{
      el.style.backgroundImage=`url('${wpObjectUrl}')`;
      el.style.backgroundSize='cover';
      el.style.backgroundPosition='center';
    });
  }else if(wp.t==='live'&&state.wallpaperLive){
    [phone,lock,home].forEach(el=>{
      el.style.backgroundImage=wp.v;
      el.classList.add('wp-live');
    });
  }else{
    [phone,lock,home].forEach(el=>{
      el.style.backgroundImage=wp.v;
      el.style.backgroundSize='cover';
      el.style.backgroundPosition='center';
    });
  }
}

/* ==========================================================
   MEDIA (Blob-based)
   ========================================================== */
let mediaItems=[];
let mediaLoaded=false;
const mediaUrlCache=new Map();
function mediaUrl(m){
  if(mediaUrlCache.has(m.id)) return mediaUrlCache.get(m.id);
  const url=URL.createObjectURL(m.blob);
  mediaUrlCache.set(m.id,url);
  return url;
}
async function loadMedia(){
  try{
    mediaItems=await dbAll();
    mediaItems.sort((a,b)=>b.ts-a.ts);
  }catch(e){console.warn('db load',e);}
  mediaLoaded=true;
}
async function addMediaPhoto(blob){
  const item={id:uid(),type:'photo',blob,ts:Date.now()};
  await dbAdd(item);
  mediaItems.unshift(item);
  return item;
}
async function addMediaVideo(blob,thumb,dur){
  const item={id:uid(),type:'video',blob,thumb:thumb?thumb.blob:null,thumbUrl:thumb?thumb.url:null,ts:Date.now(),dur};
  await dbAdd(item);
  mediaItems.unshift(item);
  return item;
}
async function deleteMedia(id){
  try{await dbDel(id);}catch(e){}
  mediaUrlCache.delete(id);
  mediaItems=mediaItems.filter(m=>m.id!==id);
}
async function updateMedia(id,patch){
  const it=mediaItems.find(m=>m.id===id);if(!it)return;
  Object.assign(it,patch);
  try{await dbPut(it);}catch(e){}
  mediaUrlCache.delete(id);
}

/* ==========================================================
   APP OPEN / CLOSE with AbortController
   ========================================================== */
let currentApp=null,currentAC=null,currentTimers=[];
function clearTimers(){currentTimers.forEach(t=>clearInterval(t));currentTimers=[];}
function addTimer(t){currentTimers.push(t);return t;}
function openApp(id,silent){
  const app=APPS[id];if(!app)return;
  closeApp(true);
  currentApp=id;
  currentAC=new AbortController();
  appView.dataset.app=id;
  appView.dataset.full=app.full?'1':'0';
  appView.innerHTML=`
    <div class="apphead">
      <button class="backbtn" id="backBtn">${I.chevron}</button>
      <span class="apptitle">${app.name}</span>
      <span id="appActions"></span>
    </div>
    <div class="appbody" id="appBody">${app.view()}</div>`;
  $('#backBtn').onclick=closeApp;
  if(!silent) requestAnimationFrame(()=>appView.classList.add('open'));
  else appView.classList.add('open');
  home.classList.add('blur');
  if(app.mount) app.mount($('#appBody'),currentAC.signal);
  pushRecent(id);
  if(tg?.BackButton) tg.BackButton.show();
}
function closeApp(silent){
  if(currentApp==='camera'&&window.__camStop){window.__camStop();window.__camStop=null;}
  clearTimers();
  if(currentAC){try{currentAC.abort();}catch(e){}currentAC=null;}
  if(!silent){
    appView.classList.remove('open');
    home.classList.remove('blur');
    setTimeout(()=>{if(!currentApp)appView.innerHTML='';},420);
  }else{
    appView.classList.remove('open');
    home.classList.remove('blur');
    appView.innerHTML='';
  }
  currentApp=null;
  if(tg?.BackButton) tg.BackButton.hide();
}
function refresh(){renderHome();if(currentApp)openApp(currentApp,true);}

/* ==========================================================
   GLOBAL TORCH (widget / quick)
   ========================================================== */
window.__torchWidget=null;
window.__torchTrack=null;
async function toggleTorchGlobal(){
  haptic('medium');
  try{
    if(window.__torchTrack){
      const on=!window.__torchWidget;
      await window.__torchTrack.applyConstraints({advanced:[{torch:on}]});
      window.__torchWidget=on;
    }else{
      // временный поток только для torch (Android)
      const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const tr=s.getVideoTracks()[0];
      const cap=tr.getCapabilities?.()||{};
      if(cap.torch){
        await tr.applyConstraints({advanced:[{torch:true}]});
        window.__torchTrack=tr;window.__torchWidget=true;
        window.__torchStream=s;
      }else{
        s.getTracks().forEach(t=>t.stop());
        toast('Фонарик не поддерживается');
        return;
      }
    }
  }catch(e){toast('Не удалось: '+e.message);return;}
  renderHome();
}

   ========================================================== */
const cam={stream:null,track:null,facing:'environment',torchOn:false,torchSupported:false,
  mode:'photo',recording:false,rec:null,chunks:[],recTimer:null,recStart:0,gridOn:false};

function viewCamera(){
  return `<div class="cam" id="cam">
    <video id="camVideo" autoplay playsinline muted></video>
    <div class="cam-overlay"></div>
    <div class="cam-grid ${cam.gridOn?'on':''}" id="camGrid"><i></i><i></i><i></i><i></i></div>
    <div class="cam-topbar">

      <div style="flex:1"></div>
      <button class="cam-chip" id="camGridBtn">${I.grid}</button>
    </div>
    <div class="cam-timer" id="camTimer"><span class="dot"></span><span id="camTimerVal">00:00</span></div>
    <div class="cam-modes">
      <button class="cam-mode active" data-mode="photo">Фото</button>
      <button class="cam-mode" data-mode="video">Видео</button>
    </div>
    <div class="cam-bottombar">
      <button class="cam-thumb" id="camThumb"></button>
      <button class="cam-shutter" id="camShutter"><i></i></button>
      <button class="cam-side" id="camFlip">${I.switchCam}</button>
    </div>
    <div class="cam-flash" id="camFlashOverlay"></div>
    <div class="cam-fallback" id="camFallback" hidden>
      <div class="cf-ic">${I.camera}</div>
      <div class="cf-t">Камера недоступна</div>
      <div class="cf-s" id="camFallbackText"></div>
      <button class="btn" id="camRetry">Повторить</button>
    </div>
  </div>`;
}

async function mountCamera(root,signal){
  const video=$('#camVideo',root),flashBtn=$('#camFlash',root),gridBtn=$('#camGridBtn',root),
    flipBtn=$('#camFlip',root),shutter=$('#camShutter',root),fallback=$('#camFallback',root),
    fallbackText=$('#camFallbackText',root),thumb=$('#camThumb',root),timer=$('#camTimer',root),
    timerVal=$('#camTimerVal',root),flashOverlay=$('#camFlashOverlay',root);

  updateThumb();gridBtn.classList.toggle('on',cam.gridOn);

  async function start(){
    stop();
    try{
      const constraints={
        audio:cam.mode==='video',
        video:{facingMode:{ideal:cam.facing},width:{ideal:1920},height:{ideal:1080}}
      };
      cam.stream=await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject=cam.stream;
      cam.track=cam.stream.getVideoTracks()[0];
      const cap=cam.track.getCapabilities?.()||{};
      cam.torchSupported=!!cap.torch&&cam.facing==='environment';
      flashBtn.toggleAttribute('disabled',!cam.torchSupported);
      flashBtn.classList.toggle('on',cam.torchOn&&cam.torchSupported);
      // stabilization
      if(cap.videoStabilizationMode) cam.track.applyConstraints({advanced:[{videoStabilizationMode:'auto'}]}).catch(()=>{});
      video.classList.toggle('mirror',cam.facing==='user');
      fallback.hidden=true;
      window.__torchTrack=cam.track;
    }catch(err){
      fallback.hidden=false;
      fallbackText.textContent=err.name==='NotAllowedError'?'Доступ запрещён. Разрешите в настройках.':
        err.name==='NotFoundError'?'Камера не найдена.':'Не удалось: '+err.message;
    }
  }
  function stop(){
    if(cam.recording)stopRecording();
    if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null;cam.track=null;}
    if(window.__torchTrack===cam.track) window.__torchTrack=null;
  }
  window.__camStop=stop;

  function updateThumb(){
    const last=mediaItems[0];
    if(last){
      const url=last.type==='photo'?mediaUrl(last):(last.thumbUrl||'');
      thumb.style.backgroundImage=`url('${url}')`;
    }else{
      thumb.style.backgroundImage='linear-gradient(160deg,#6fb2ff,#1a63e0)';
    }
  }

  flashBtn.onclick=async()=>{
    if(!cam.torchSupported)return;
    haptic('medium');
    const next=!cam.torchOn;
    try{
      await cam.track.applyConstraints({advanced:[{torch:next}]});
      cam.torchOn=next;
      flashBtn.classList.toggle('on',next);
      window.__torchWidget=next;
      renderHome();
    }catch(e){cam.torchOn=false;flashBtn.classList.remove('on');}
  };
  gridBtn.onclick=()=>{haptic('light');cam.gridOn=!cam.gridOn;$('#camGrid',root).classList.toggle('on',cam.gridOn);gridBtn.classList.toggle('on',cam.gridOn);};
  flipBtn.onclick=()=>{haptic('light');cam.facing=cam.facing==='environment'?'user':'environment';cam.torchOn=false;flashBtn.classList.remove('on');start();};
  root.querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick=()=>{
      if(cam.recording)return;
      haptic('light');
      cam.mode=b.dataset.mode;
      root.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));
      start();
    };
  });

  function screenFlash(){
    flashOverlay.classList.remove('fire');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('fire');
  }

  shutter.onclick=async()=>{
    if(!cam.track)return;
    if(cam.mode==='photo'){
      haptic('medium');screenFlash();
      const w=video.videoWidth,h=video.videoHeight;if(!w||!h)return;
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');
      if(cam.facing==='user'){ctx.translate(w,0);ctx.scale(-1,1);}
      ctx.drawImage(video,0,0,w,h);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
      if(!blob)return;
      await addMediaPhoto(blob);
      updateThumb();
    }else{
      if(cam.recording)stopRecording();
      else startRecording();
    }
  };

  function startRecording(){
    try{
      cam.chunks=[];
      const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']
        .find(m=>window.MediaRecorder?.isTypeSupported?.(m))||'';
      cam.rec=new MediaRecorder(cam.stream,mime?{mimeType:mime}:undefined);
      cam.rec.ondataavailable=e=>{if(e.data&&e.data.size)cam.chunks.push(e.data);};
      cam.rec.onstop=async()=>{
        if(!cam.chunks.length)return;
        const blob=new Blob(cam.chunks,{type:cam.rec.mimeType||'video/webm'});
        const dur=Math.round((Date.now()-cam.recStart)/1000);
        // thumb
        let thumbBlob=null;
        try{
          const w=video.videoWidth,h=video.videoHeight;
          const cv=document.createElement('canvas');cv.width=w;cv.height=h;
          cv.getContext('2d').drawImage(video,0,0,w,h);
          thumbBlob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.7));
        }catch(e){}
        await addMediaVideo(blob,thumbBlob?{blob:thumbBlob}:null,dur);
        updateThumb();
      };
      cam.rec.start();
      cam.recording=true;cam.recStart=Date.now();
      shutter.classList.add('rec');
      timer.classList.add('on');
      haptic('heavy');
      cam.recTimer=setInterval(()=>{
        const s=Math.floor((Date.now()-cam.recStart)/1000);
        timerVal.textContent=fmt(s);
        if(s>=60)stopRecording();
      },250);
    }catch(e){toast('Запись не поддерживается');}
  }
  function stopRecording(){
    if(!cam.recording)return;
    try{cam.rec.stop();}catch(e){}
    cam.recording=false;
    clearInterval(cam.recTimer);cam.recTimer=null;
    shutter.classList.remove('rec');
    timer.classList.remove('on');
    haptic('medium');
  }

  thumb.onclick=()=>{stop();location.hash='#app/photos';};
  $('#camRetry',root).onclick=()=>start();

  // visibility — pause camera
  const visHandler=()=>{
    if(!cam.stream)return;
    cam.stream.getVideoTracks().forEach(t=>t.enabled=!document.hidden);
  };
  document.addEventListener('visibilitychange',visHandler,{signal});
  signal.addEventListener('abort',()=>document.removeEventListener('visibilitychange',visHandler));

  await start();
}

function viewPhotos(){

  const tiles=mediaItems.map(m=>{
    const url=mediaUrl(m);
    if(m.type==='photo')
      return `<button class="gtile" data-mid="${m.id}"><img loading="lazy" decoding="async" src="${url}" alt=""/></button>`;
    return `<button class="gtile gtile-video" data-mid="${m.id}">
      <img loading="lazy" decoding="async" src="${m.thumbUrl||url}" alt=""/>
      ${m.dur?`<span class="gtile-vdur">${fmt(m.dur)}</span>`:''}
    </button>`;
  }).join('');
  const addTile=`<button class="gtile gtile-add" id="addPhotoBtn">${I.plus}</button>`;
  const empty=mediaItems.length?'':`<div class="empty" style="grid-column:span 3">Пусто. Снимайте или загружайте фото.</div>`;

  const counter=(photoCount||videoCount)?`<div class="gal-counter">${photoCount} фото · ${videoCount} видео</div>`:'';
  return `${counter}<div class="gallery">${addTile}${tiles}</div>${empty}

function mountPhotos(root,signal){
  const inp=$('#fileInput',root);
  $('#addPhotoBtn',root).onclick=()=>inp.click();
  inp.onchange=async e=>{
    const files=Array.from(e.target.files||[]);
    for(const f of files){
      if(!f.type.startsWith('image/'))continue;
      if(f.size>20_000_000){toast('Файл больше 20 МБ');continue;}
      const blob=await compressBlob(f,1600,0.85);
      await addMediaPhoto(blob);
    }
    openApp('photos',true);
  };
  root.querySelectorAll('[data-mid]').forEach(el=>{
    el.onclick=()=>openViewer(el.dataset.mid);
  });
}
function compressBlob(file,maxSide,quality){
  return new Promise(res=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(Math.max(w,h)>maxSide){const k=maxSide/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=>{URL.revokeObjectURL(url);res(b||file);},'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}

   VIEWER / EDITOR

let viewerState=null;
function openViewer(id){
  const m=mediaItems.find(x=>x.id===id);if(!m)return;
  viewerState={
    item:m,rotation:0,tool:'none',
    filter:{brightness:100,contrast:100,saturate:100,blur:0,sepia:0,grayscale:0},
    drawing:false,brushColor:'#ff3b3b',brushSize:8,textOverlay:''
  };
  renderViewer();
}
function renderViewer(){
  const m=viewerState.item,f=viewerState.filter;
  const css=`brightness(${f.brightness}%) contrast(${f.contrast}%) saturate(${f.saturate}%) blur(${f.blur}px) sepia(${f.sepia}%) grayscale(${f.grayscale}%)`;
  const url=mediaUrl(m);

  let mediaHTML;
  if(m.type==='photo'){
    mediaHTML=`<img id="vMedia" src="${url}" style="filter:${css};transform:rotate(${viewerState.rotation}deg)" alt=""/>
      <canvas id="vCanvas"></canvas>`;
  }else{
    mediaHTML=`<video id="vMedia" src="${url}" controls playsinline style="filter:${css}"></video>`;
  }

  const tools=`
    <button class="toolchip ${viewerState.tool==='adjust'?'active':''}" data-tool="adjust"><span class="ti">${I.edit}</span>Фильтры</button>
    ${m.type==='photo'?`
      <button class="toolchip ${viewerState.tool==='draw'?'active':''}" data-tool="draw"><span class="ti">${I.brush}</span>Кисть</button>
      <button class="toolchip" data-tool="rotate"><span class="ti">${I.rotate}</span>Поворот</button>
      <button class="toolchip" data-tool="crop"><span class="ti">${I.crop}</span>Обрезать</button>
    `:''}
    <button class="toolchip" data-tool="wallpaper"><span class="ti">${I.image}</span>Обои</button>
    <button class="toolchip" data-tool="download"><span class="ti">${I.download}</span>Скачать</button>
  `;

  let extraUI='';
  if(viewerState.tool==='adjust'&&m.type==='photo'){
    const sliders=['brightness','contrast','saturate','blur','sepia','grayscale'];
    const labels={brightness:'Яркость',contrast:'Контраст',saturate:'Насыщенность',blur:'Размытие',sepia:'Сепия',grayscale:'Ч/Б'};
    const mins={brightness:20,contrast:20,saturate:0,blur:0,sepia:0,grayscale:0};
    const maxs={brightness:200,contrast:200,saturate:250,blur:10,sepia:100,grayscale:100};
    extraUI=sliders.map(k=>`
      <div class="sliderbox">
        <label>${labels[k]} <span data-val="${k}">${f[k]}${k==='blur'?'px':'%'}</span></label>
        <input type="range" min="${mins[k]}" max="${maxs[k]}" value="${f[k]}" data-f="${k}"/>
      </div>
    `).join('')+`<button class="btn ghost" id="vReset" style="width:100%;margin-top:6px;background:rgba(255,255,255,.12);color:#fff;">Сбросить</button>`;
  }
  if(viewerState.tool==='draw'){
    const colors=['#ff3b3b','#ffd166','#06d6a0','#118ab2','#8338ec','#fff','#000'];
    extraUI=`<div class="sliderbox">
        <label>Размер <span data-val="bsize">${viewerState.brushSize}px</span></label>
        <input type="range" min="2" max="40" value="${viewerState.brushSize}" id="brushSize"/>
      </div>
      <div style="display:flex;gap:8px;padding:8px 0;overflow-x:auto">
        ${colors.map(c=>`<button data-color="${c}" style="width:34px;height:34px;border-radius:50%;background:${c};border:3px solid ${viewerState.brushColor===c?'#fff':'transparent'};flex:0 0 auto;box-shadow:0 3px 10px rgba(0,0,0,.4)"></button>`).join('')}
      </div>
      <button class="btn ghost" id="clearDraw" style="width:100%;background:rgba(255,255,255,.12);color:#fff;">Очистить рисунок</button>`;
  }
  if(viewerState.tool==='crop'&&m.type==='photo'){
    extraUI=`<div class="sliderbox"><label>Обрезка: <span>пальцем выберите область</span></label></div>
      <button class="btn" id="applyCrop" style="width:100%">Применить обрезку</button>`;
  }

  const overlay=document.createElement('div');
  overlay.className='viewer';
  overlay.id='viewer';
  overlay.innerHTML=`
    <div class="viewer-top">
      <button class="viewer-close" id="vClose">${I.x}</button>
      <span class="viewer-info">${m.type==='photo'?'Фото':'Видео'} · ${new Date(m.ts).toLocaleDateString('ru-RU')}</span>
      <span style="width:40px"></span>
    </div>
    <div class="viewer-stage ${viewerState.tool==='draw'?'draw':''}" id="vStage">${mediaHTML}</div>
    <div class="viewer-tools">${tools}</div>
    <div id="vSliders">${extraUI}</div>
    <div class="viewer-actions">
      <button class="btn" id="vSave" style="display:${viewerState.tool!=='none'&&m.type==='photo'?'flex':'none'};justify-content:center;">${I.check}Сохранить</button>
      <button class="btn danger" id="vDelete">${I.trash}Удалить</button>
    </div>`;
  const old=document.getElementById('viewer');if(old)old.remove();
  document.body.appendChild(overlay);

  const stage=$('#vStage',overlay);
  const canvas=$('#vCanvas',overlay);

  function sizeCanvas(){
    if(!canvas||m.type!=='photo')return;
    const img=$('#vMedia',overlay);if(!img)return;
    const rect=img.getBoundingClientRect();
    const sr=stage.getBoundingClientRect();
    canvas.width=rect.width;canvas.height=rect.height;
    canvas.style.left=(rect.left-sr.left)+'px';
    canvas.style.top=(rect.top-sr.top)+'px';
    canvas.style.width=rect.width+'px';
    canvas.style.height=rect.height+'px';
  }
  requestAnimationFrame(sizeCanvas);

  // Draw events
  let drawing=false,lastX=0,lastY=0;
  if(canvas){
    const ctx=canvas.getContext('2d');
    const pos=e=>{
      const r=canvas.getBoundingClientRect();
      const t=e.touches?e.touches[0]:e;
      return [t.clientX-r.left,t.clientY-r.top];
    };
    const down=e=>{
      if(viewerState.tool!=='draw')return;
      e.preventDefault();drawing=true;
      [lastX,lastY]=pos(e);
      ctx.beginPath();ctx.arc(lastX,lastY,viewerState.brushSize/2,0,Math.PI*2);
      ctx.fillStyle=viewerState.brushColor;ctx.fill();
    };
    const move=e=>{
      if(!drawing)return;
      e.preventDefault();
      const [x,y]=pos(e);
      ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);
      ctx.strokeStyle=viewerState.brushColor;ctx.lineWidth=viewerState.brushSize;ctx.lineCap='round';ctx.stroke();
      lastX=x;lastY=y;
    };
    const up=()=>{drawing=false;};
    canvas.addEventListener('pointerdown',down);
    canvas.addEventListener('pointermove',move);
    canvas.addEventListener('pointerup',up);
    canvas.addEventListener('pointercancel',up);
    canvas.addEventListener('pointerleave',up);
  }

  $('#vClose',overlay).onclick=()=>overlay.remove();

  overlay.querySelectorAll('[data-tool]').forEach(b=>{
    b.onclick=()=>{
      haptic('light');
      const t=b.dataset.tool;
      if(t==='rotate'){viewerState.rotation=(viewerState.rotation+90)%360;renderViewer();return;}
      if(t==='wallpaper'){
        if(m.type==='photo'){
          (async()=>{
            const blob=await fetch(mediaUrl(m)).then(r=>r.blob());
            state.wallpaper={t:'custom',blob};
            save();applyWallpaper();
            toast('Обои установлены ✓');
          })();
        }else toast('Только для фото');
        return;
      }
      if(t==='download'){
        const a=document.createElement('a');
        a.href=mediaUrl(m);
        a.download='minios_'+Date.now()+(m.type==='photo'?'.jpg':'.webm');
        a.click();
        return;
      }
      if(t==='crop'){viewerState.tool='crop';renderViewer();return;}
      viewerState.tool=(viewerState.tool===t)?'none':t;
      renderViewer();
    };
  });

  overlay.querySelectorAll('#vSliders input[type=range]').forEach(r=>{
    r.oninput=()=>{
      if(r.id==='brushSize'){viewerState.brushSize=+r.value;const l=$('[data-val="bsize"]',overlay);if(l)l.textContent=r.value+'px';return;}
      const k=r.dataset.f;if(!k)return;
      viewerState.filter[k]=+r.value;
      const lab=$(`[data-val="${k}"]`,overlay);
      if(lab)lab.textContent=r.value+(k==='blur'?'px':'%');
      const media=$('#vMedia',overlay);
      if(media){
        const f2=viewerState.filter;
        media.style.filter=`brightness(${f2.brightness}%) contrast(${f2.contrast}%) saturate(${f2.saturate}%) blur(${f2.blur}px) sepia(${f2.sepia}%) grayscale(${f2.grayscale}%)`;
      }
    };
  });
  overlay.querySelectorAll('[data-color]').forEach(c=>{
    c.onclick=()=>{viewerState.brushColor=c.dataset.color;renderViewer();};
  });

  const clearDraw=$('#clearDraw',overlay);
  if(clearDraw) clearDraw.onclick=()=>{if(canvas){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);}};

  const reset=$('#vReset',overlay);
  if(reset)reset.onclick=()=>{
    viewerState.filter={brightness:100,contrast:100,saturate:100,blur:0,sepia:0,grayscale:0};
    renderViewer();
  };

  $('#vSave',overlay).onclick=async()=>{
    if(m.type!=='photo')return;
    const img=new Image();
    img.onload=async()=>{
      const rot=viewerState.rotation;
      const w=img.width,h=img.height;
      const cv=document.createElement('canvas');
      if(rot===90||rot===270){cv.width=h;cv.height=w;}else{cv.width=w;cv.height=h;}
      const ctx=cv.getContext('2d');
      ctx.translate(cv.width/2,cv.height/2);
      ctx.rotate(rot*Math.PI/180);
      const f2=viewerState.filter;
      ctx.filter=`brightness(${f2.brightness}%) contrast(${f2.contrast}%) saturate(${f2.saturate}%) blur(${f2.blur}px) sepia(${f2.sepia}%) grayscale(${f2.grayscale}%)`;
      ctx.drawImage(img,-w/2,-h/2,w,h);

      // overlay draw canvas
      if(canvas&&canvas.width>0&&canvas.height>0){
        ctx.filter='none';
        const scaleX=w/canvas.width,scaleY=h/canvas.height;
        const off=document.createElement('canvas');
        off.width=w;off.height=h;
        const octx=off.getContext('2d');
        octx.drawImage(canvas,0,0,w,h);
        // apply rotation on overlay too
        ctx.translate(-cv.width/2,-cv.height/2);
        const tmp=document.createElement('canvas');
        tmp.width=cv.width;tmp.height=cv.height;
        const tctx=tmp.getContext('2d');
        // simple: just draw overlay onto result
        ctx.save();
        ctx.setTransform(1,0,0,1,0,0);
        ctx.globalCompositeOperation='source-over';
        const img2=new Image();
        await new Promise(r=>{img2.onload=r;img2.src=off.toDataURL();});
        ctx.drawImage(img2,0,0,cv.width,cv.height);
        ctx.restore();
      }

      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
      await updateMedia(m.id,{blob});
      overlay.remove();
      openApp('photos',true);
      toast('Сохранено ✓');
    };
    img.src=mediaUrl(m);
  };

  $('#vDelete',overlay).onclick=async()=>{
    if(!confirm('Удалить?'))return;
    await deleteMedia(m.id);
    overlay.remove();
    openApp('photos',true);
  };
}

    b.onclick=()=>{state.theme=b.dataset.theme;save();applyTheme();refresh();};

      toast('Импорт готов ✓');

  const rb=$('#resetBtn',root);

/* ==========================================================
   CALCULATOR
   ========================================================== */
let calcExpr='';
function viewCalc(){
  const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='];
  return `<div class="calc">
    <div class="calc-screen"><div class="calc-out" id="calcOut">0</div></div>
    <div class="calc-pad">${keys.map(k=>{
      let c='ckey';
      if(['÷','×','−','+','%','C','⌫'].includes(k))c+=' op';
      if(k==='=')c+=' eq';
      if(k==='0')c+=' zero';
      return `<button class="${c}" data-k="${k}">${k}</button>`;
    }).join('')}</div></div>`;
}
function mountCalc(root){
  const out=$('#calcOut',root);
  const show=()=>out.textContent=calcExpr||'0';
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-k]');if(!b)return;
    const k=b.dataset.k;
    if(k==='C')calcExpr='';
    else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);
    else if(k==='='){
      try{
        const raw=calcExpr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');
        const v=Function('"use strict";return ('+raw+')')();
        calcExpr=(Math.round(v*1e10)/1e10).toString();
      }catch(e){calcExpr='Ошибка';}
    } else calcExpr+=k;
    haptic('light');show();
  });
  show();
}

function viewNotes(){

    <div class="note">

      <div class="note-d">
        ${new Date(n.d).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
      </div>
      ${n.voice?`<div class="voice-note"><audio controls src="${n.voice}"></audio></div>`:''}
      <button class="x" data-delnote="${i}">${I.trash}</button>
    </div>`).join(''):'<div class="empty">Пока нет заметок</div>';
  return `<div class="notenew">
      <input id="noteInput" placeholder="Новая заметка..." maxlength="120"/>
      <button class="btn" id="noteAdd">${I.plus}</button>
      <button class="voice-rec-btn" id="voiceBtn">${I.mic}</button>
    </div>
    <div id="noteList">${list}</div>`;
}
function mountNotes(root,signal){
  const input=$('#noteInput',root),list=$('#noteList',root);
  const add=()=>{
    const v=input.value.trim();if(!v)return;
    state.notes.unshift({t:v,d:Date.now()});
    save();
    list.insertAdjacentHTML('afterbegin',
      `<div class="note"><div class="note-t">${esc(v)}</div>
        <div class="note-d">${new Date().toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
        <button class="x" data-delnote="0">${I.trash}</button></div>`);
    input.value='';haptic('light');
  };
  $('#noteAdd',root).onclick=add;
  input.addEventListener('keydown',e=>{if(e.key==='Enter')add();});
  list.addEventListener('click',e=>{
    const b=e.target.closest('[data-delnote]');if(!b)return;
    state.notes.splice(+b.dataset.delnote,1);
    save();openApp('notes',true);
  });
  // voice
  const vb=$('#voiceBtn',root);
  let rec=null,chunks=[],recStart=0,recTimer=null;
  vb.onclick=async()=>{
    if(rec){
      rec.stop();return;
    }
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:true});
      rec=new MediaRecorder(s);chunks=[];
      rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      rec.onstop=async()=>{
        s.getTracks().forEach(t=>t.stop());
        clearInterval(recTimer);
        const blob=new Blob(chunks,{type:'audio/webm'});
        const dataUrl=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});
        state.notes.unshift({t:'🎤 Голосовая заметка',d:Date.now(),voice:dataUrl});
        save();openApp('notes',true);
        vb.classList.remove('rec');
        rec=null;
      };
      rec.start();recStart=Date.now();
      vb.classList.add('rec');
      haptic('medium');
      recTimer=setInterval(()=>{
        if(Date.now()-recStart>30000)rec.stop();
      },500);
    }catch(e){toast('Микрофон недоступен');}
  };
  signal.addEventListener('abort',()=>{if(rec){try{rec.stop();}catch(e){}}});
}

let calDate=new Date();

function mountCalendar(root){
  const grid=$('#calGrid',root),title=$('#calTitle',root);
  function draw(){
    const y=calDate.getFullYear(),m=calDate.getMonth();
    title.textContent=calDate.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    const first=new Date(y,m,1);let start=first.getDay();start=start===0?6:start-1;
    const dim=new Date(y,m+1,0).getDate(),today=new Date();
    let html=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="calwd">${d}</div>`).join('');
    for(let i=0;i<start;i++)html+=`<div class="calday mute"></div>`;
    for(let d=1;d<=dim;d++){
      const isT=d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
      html+=`<div class="calday ${isT?'today':''}">${d}</div>`;
    }
    grid.innerHTML=html;
  }
  $('#calPrev',root).onclick=()=>{calDate.setMonth(calDate.getMonth()-1);draw();};
  $('#calNext',root).onclick=()=>{calDate.setMonth(calDate.getMonth()+1);draw();};
  draw();
}

      $('#new2048',area).onclick=()=>{g2048={grid:newGrid(),score:0};draw();};
      bind2048(area,draw);
    } else if(gameMode==='snake'){
      if(!snakeState) snakeState={snake:[{x:10,y:10}],dir:{x:1,y:0},food:{x:5,y:5},score:0,alive:true};
      area.innerHTML=`<div style="text-align:center;margin-bottom:12px">
        <span class="badge">Счёт: ${snakeState.score}</span>
        <button class="btn ghost sm" id="newSnake" style="margin-left:8px">Заново</button>
      </div>
      <canvas id="snakeCanvas" class="snake-canvas"></canvas>
      <div class="hintline">Свайпайте или тапайте по сторонам</div>`;
      $('#newSnake',area).onclick=()=>{snakeState={snake:[{x:10,y:10}],dir:{x:1,y:0},food:{x:5,y:5},score:0,alive:true};draw();};
      startSnake(area);
    }
    root.querySelectorAll('[data-game]').forEach(t=>{
      t.onclick=()=>{gameMode=t.dataset.game;root.querySelectorAll('[data-game]').forEach(x=>x.classList.toggle('active',x===t));draw();};
    });
  };
  draw();
}
function newGrid(){
  const g=Array(16).fill(0);
  addRandom(g);addRandom(g);
  return g;
}
function addRandom(g){
  const empty=g.map((v,i)=>v===0?i:-1).filter(i=>i>=0);
  if(!empty.length)return;
  const i=empty[Math.floor(Math.random()*empty.length)];
  g[i]=Math.random()<0.9?2:4;
}
function bind2048(area,redraw){
  const grid=$('#gg2048',area);
  let startX=null,startY=null;
  grid.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;});
  grid.addEventListener('pointerup',e=>{
    if(startX===null)return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    let dir;
    if(Math.abs(dx)>Math.abs(dy)) dir=dx>0?'right':'left';
    else dir=dy>0?'down':'up';
    const moved=move2048(g2048.grid,dir);
    if(moved){addRandom(g2048.grid);redraw();}
  });
}
function move2048(g,dir){
  let moved=false;
  const size=4;
  const rotate=g2=>{
    const n=Array(16).fill(0);
    for(let y=0;y<4;y++)for(let x=0;x<4;x++)n[x*4+(3-y)]=g2[y*4+x];
    return n;
  };
  let times={'left':0,'down':1,'right':2,'up':3}[dir];
  for(let i=0;i<times;i++) g=rotate(g);
  const merged=[];
  for(let y=0;y<4;y++){
    const row=g.slice(y*4,y*4+4).filter(v=>v);
    for(let i=0;i<row.length-1;i++){
      if(row[i]===row[i+1]){
        row[i]*=2;row.splice(i+1,1);
        g2048.score+=row[i];
      }
    }
    while(row.length<4)row.push(0);
    for(let x=0;x<4;x++) if(g[y*4+x]!==row[x]){moved=true;g[y*4+x]=row[x];}
  }
  for(let i=0;i<(4-times)%4;i++) g=rotate(g);
  return moved;
}
function startSnake(area){
  const cv=$('#snakeCanvas',area);
  cv.width=400;cv.height=400;
  const ctx=cv.getContext('2d');
  const cell=20;
  let timer=addTimer(setInterval(tickSnake,140));
  let touchStart=null;
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();touchStart={x:e.clientX-r.left,y:e.clientY-r.top};});
  cv.addEventListener('pointerup',e=>{
    if(!touchStart)return;
    const r=cv.getBoundingClientRect();
    const dx=e.clientX-r.left-touchStart.x,dy=e.clientY-r.top-touchStart.y;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20){touchStart=null;return;}
    if(Math.abs(dx)>Math.abs(dy)) snakeState.dir={x:dx>0?1:-1,y:0};
    else snakeState.dir={x:0,y:dy>0?1:-1};
    touchStart=null;
  });
  function tickSnake(){
    if(!snakeState.alive)return;
    const s=snakeState;
    const head={x:s.snake[0].x+s.dir.x,y:s.snake[0].y+s.dir.y};
    if(head.x<0||head.x>=20||head.y<0||head.y>=20){s.alive=false;}
    else if(s.snake.some(p=>p.x===head.x&&p.y===head.y)){s.alive=false;}
    else{
      s.snake.unshift(head);
      if(head.x===s.food.x&&head.y===s.food.y){
        s.score++;
        const empty=[];
        for(let y=0;y<20;y++)for(let x=0;x<20;x++)
          if(!s.snake.some(p=>p.x===x&&p.y===y))empty.push({x,y});
        s.food=empty[Math.floor(Math.random()*empty.length)];
      }else s.snake.pop();
    }
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--blue-50')||'#eff5ff';
    ctx.fillRect(0,0,400,400);
    ctx.fillStyle='#2b7fff';
    s.snake.forEach((p,i)=>{ctx.globalAlpha=i?1-i/s.snake.length*0.5:1;ctx.fillRect(p.x*cell+1,p.y*cell+1,cell-2,cell-2);});
    ctx.globalAlpha=1;
    ctx.fillStyle='#e11d48';
    ctx.beginPath();ctx.arc(s.food.x*cell+10,s.food.y*cell+10,7,0,Math.PI*2);ctx.fill();
    if(!s.alive){
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,400,400);
      ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
      ctx.fillText('Игра окончена',200,190);
      ctx.font='16px sans-serif';ctx.fillText('Счёт: '+s.score,200,220);
    }
  }
}

const appView=$('#appView');

async function init(){
  load();
  applyTheme();
  initStatus();
  applyWallpaper();
  initSearch();
  attachLongPress();
  await loadMedia();
  renderHome();
  tick();
  setInterval(tick,1000);
  initBattery();

  // Telegram
  try{
    if(tg){
      tg.ready();tg.expand();tg.setHeaderColor('#0b1b33');
      tg.BackButton?.onClick(()=>{
        const v=document.getElementById('viewer');
        if(v){v.remove();return;}
        if($('#searchOverlay').classList.contains('open')){closeSearch();return;}
        if($('#recentsPanel').classList.contains('open')){$('#recentsPanel').classList.remove('open');return;}
        if(currentApp) closeApp();
      });
    }
  }catch(e){}

  // swipe-to-search from home
  home.addEventListener('pointerdown',e=>{
    if(e.target.closest('.app')||e.target.closest('.statusbar')||e.target.closest('.dock'))return;
    searchStartY=e.clientY;
  },{passive:true});
  home.addEventListener('pointerup',e=>{
    if(searchStartY===null)return;
    const dy=e.clientY-searchStartY;
    if(dy>60) openSearch();
    searchStartY=null;
  });

  // swipe up from bottom opens recents
  let bottomStart=null;
  home.addEventListener('pointerdown',e=>{
    if(e.clientY>window.innerHeight-40) bottomStart=e.clientY;
  },{passive:true});
  home.addEventListener('pointerup',e=>{
    if(bottomStart===null)return;
    const dy=bottomStart-e.clientY;
    if(dy>60) openRecents();
    bottomStart=null;
  });

  // Escape
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      const v=document.getElementById('viewer');if(v){v.remove();return;}
      if(searchOpen){closeSearch();return;}
      if($('#recentsPanel').classList.contains('open')){$('#recentsPanel').classList.remove('open');return;}
      if(currentApp)closeApp();
    }
  });

  // hash routing
  applyHash();
}
init();
