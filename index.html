<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Песочница</title>
<style>
:root{
  --blue:#007AFF;--blue-d:#0062CC;--blue-h:#0071E3;
  --bg:#F5F5F7;--text:#1D1D1F;--text-2:#6E6E73;--text-3:#A1A1A6;
  --danger:#FF3B30;--green:#34C759;--orange:#FF9500;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  color:var(--text);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{display:block}

/* ═══════ HUD ═══════ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right)}

/* Прицел */
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
  pointer-events:none;opacity:.9}
#cross::before,#cross::after{content:'';position:absolute;background:#fff;
  box-shadow:0 0 6px rgba(0,122,255,.6),0 0 2px rgba(0,0,0,.5);border-radius:1px}
#cross::before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
#cross::after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
#cross .dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;
  background:#fff;border-radius:50%;box-shadow:0 0 4px rgba(0,122,255,.8)}

/* Кнопки вверху */
.hud-btn{position:absolute;width:44px;height:44px;border-radius:12px;
  border:1.5px solid rgba(255,255,255,.6);
  background:rgba(255,255,255,.65);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--text);pointer-events:auto;cursor:pointer;
  box-shadow:0 4px 18px rgba(0,40,100,.18);
  transition:transform .1s, background .15s;
  font-family:inherit;padding:0}
.hud-btn:active{transform:scale(.9);background:rgba(255,255,255,.95)}
.hud-btn.active{background:rgba(0,122,255,.9);color:#fff;
  border-color:rgba(255,255,255,.8)}

/* Пауза */
#btnPause{left:10px;top:10px;font-size:18px}

/* Правый верх: инвентарь, карта, эмоции */
#topRight{position:absolute;right:10px;top:10px;display:flex;gap:6px;pointer-events:none}
#topRight .hud-btn{position:relative;left:auto;top:auto;width:40px;height:40px;font-size:18px}

/* Хотбар сверху по центру */
#hotbar{position:absolute;left:62px;right:170px;top:10px;height:56px;
  display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;
  pointer-events:auto;padding:0 2px;
  background:rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:1.5px solid rgba(255,255,255,.55);
  border-radius:14px;box-shadow:0 4px 18px rgba(0,40,100,.12);
  scrollbar-width:none;touch-action:pan-x}
#hotbar::-webkit-scrollbar{display:none}
.slot{width:48px;height:48px;flex-shrink:0;border-radius:11px;
  position:relative;background:rgba(255,255,255,.65);
  border:1.5px solid rgba(255,255,255,.4);
  overflow:hidden;touch-action:manipulation;
  transition:transform .12s, border-color .15s, box-shadow .15s, background .15s;
  align-self:center}
.slot.active{border-color:var(--blue);
  box-shadow:0 0 0 2px rgba(0,122,255,.25),0 4px 12px rgba(0,122,255,.3);
  background:#fff;transform:translateY(-2px)}
.slot .num{position:absolute;top:2px;left:5px;font-size:9px;font-weight:700;
  color:var(--text-3);z-index:3}
.slot.active .num{color:var(--blue)}
.slot .ico{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:22px;z-index:2}
.slot .sw{position:absolute;inset:5px;background-size:cover;border-radius:4px;
  image-rendering:pixelated}

/* Джойстик */
#joystick{position:absolute;left:16px;bottom:20px;width:130px;height:130px;
  pointer-events:auto;touch-action:none;z-index:15}
#joyBase{position:absolute;inset:0;border-radius:50%;
  background:rgba(255,255,255,.13);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:2px solid rgba(255,255,255,.35);
  box-shadow:0 6px 22px rgba(0,40,100,.18)}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;
  border-radius:50%;background:rgba(255,255,255,.8);
  border:2px solid rgba(255,255,255,.95);
  transform:translate(-50%,-50%);
  box-shadow:0 3px 12px rgba(0,40,100,.3);
  pointer-events:none;will-change:transform}

/* Кнопки действий справа снизу */
#rightBtns{position:absolute;right:16px;bottom:20px;
  display:flex;flex-direction:column;gap:10px;align-items:center;
  pointer-events:none;z-index:15}
#rightBtns .act{pointer-events:auto;width:60px;height:60px;border-radius:50%;
  border:2px solid rgba(255,255,255,.6);
  background:rgba(255,255,255,.6);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  font-size:24px;color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-family:inherit;padding:0;
  box-shadow:0 5px 20px rgba(0,40,100,.22);
  transition:transform .1s, background .15s;user-select:none}
#rightBtns .act:active{transform:scale(.9);background:rgba(255,255,255,.92)}
#rightBtns .act.big{width:72px;height:72px;font-size:28px;
  background:rgba(0,122,255,.88);color:#fff;
  border-color:rgba(255,255,255,.7);
  box-shadow:0 6px 24px rgba(0,122,255,.45)}
#rightBtns .act.big:active{background:rgba(0,100,220,.98)}
#rightBtns .act.breakBtn{background:rgba(255,149,0,.9);color:#fff;
  border-color:rgba(255,255,255,.7)}
#rightBtns .act.breakBtn:active{background:rgba(220,120,0,.95)}
#rightBtns .act.placeBtn{background:rgba(52,199,89,.9);color:#fff;
  border-color:rgba(255,255,255,.7)}
#rightBtns .act.placeBtn:active{background:rgba(30,170,60,.95)}
#rightBtns .act.viewBtn{width:50px;height:50px;font-size:20px}

/* Тост */
#toast{position:absolute;left:50%;top:76px;transform:translateX(-50%) translateY(-8px);
  padding:8px 18px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1.5px solid rgba(255,255,255,.75);border-radius:12px;
  color:var(--blue);box-shadow:0 8px 28px rgba(0,40,100,.22);
  opacity:0;transition:opacity .22s, transform .22s;pointer-events:none;
  white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;
  z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Меню эмоций — снизу */
#emoteBar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%) translateY(120%);
  display:flex;gap:8px;padding:10px 12px;
  background:rgba(255,255,255,.75);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);
  border:1.5px solid rgba(255,255,255,.7);border-radius:18px;
  box-shadow:0 12px 40px rgba(0,40,100,.28);
  pointer-events:auto;touch-action:manipulation;
  transition:transform .28s cubic-bezier(.2,.9,.3,1.05);
  z-index:16;overflow-x:auto;scrollbar-width:none;max-width:92vw}
#emoteBar::-webkit-scrollbar{display:none}
#emoteBar.open{transform:translateX(-50%) translateY(0)}
.emote-btn{width:56px;height:56px;flex-shrink:0;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.7);
  background:rgba(255,255,255,.85);font-size:26px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-family:inherit;padding:0;touch-action:manipulation;
  box-shadow:0 3px 12px rgba(0,40,100,.15);
  transition:transform .12s, background .15s}
.emote-btn:active{transform:scale(1.08);background:#fff}
.emote-btn .lbl{position:absolute;bottom:-16px;font-size:9px;font-weight:600;
  color:var(--text-2);white-space:nowrap;pointer-events:none}
.emote-btn{position:relative}

/* Эффекты */
#dmgFlash{position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 50%,
    rgba(255,59,48,0) 30%, rgba(255,59,48,.65) 100%);
  opacity:0;pointer-events:none;z-index:40;transition:opacity .12s}
#underwater{position:fixed;inset:0;pointer-events:none;z-index:35;
  background:radial-gradient(ellipse at 50% 50%,
    rgba(30,90,180,.28) 0%, rgba(10,50,120,.55) 100%);
  opacity:0;transition:opacity .35s}
#rainOverlay{position:fixed;inset:0;pointer-events:none;z-index:36;
  background:linear-gradient(180deg,rgba(40,50,70,.35) 0%,rgba(30,40,60,.15) 100%);
  opacity:0;transition:opacity 1s}

/* Оверлеи */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:50;padding:14px;touch-action:auto;
  background:radial-gradient(ellipse 90% 70% at 50% 0%,
    rgba(220,234,255,.5) 0%, rgba(245,245,247,.7) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  backdrop-filter:blur(22px) saturate(140%);
  animation:fadeIn .25s ease}
.overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.8);border-radius:22px;
  box-shadow:0 20px 60px rgba(0,40,100,.25);padding:18px;width:100%;
  max-width:460px;max-height:88vh;display:flex;flex-direction:column;gap:14px;
  animation:panelIn .3s cubic-bezier(.2,.9,.3,1.05);overflow-y:auto}
.panel.narrow{max-width:380px}
@keyframes panelIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.panel-header{display:flex;align-items:center;gap:10px}
.panel-header h2{font-size:20px;font-weight:700;letter-spacing:-.5px}
.btn-icon{width:36px;height:36px;border-radius:11px;border:none;
  background:rgba(245,245,247,.8);color:var(--text);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:inherit;flex-shrink:0;transition:background .15s}
.btn-icon:active{background:rgba(225,225,232,.95)}
.menu-content{display:flex;flex-direction:column;align-items:center;
  gap:12px;text-align:center;max-width:440px;width:100%}
.menu-logo{width:76px;height:76px;border-radius:22px;
  background:linear-gradient(145deg,#0A84FF 0%,#0062CC 100%);
  box-shadow:0 14px 36px rgba(0,98,204,.4);
  display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.menu-logo::after{content:'';width:30px;height:30px;border-radius:8px;background:#fff}
.menu-content h1{font-size:44px;font-weight:800;letter-spacing:-1.8px;line-height:1;
  background:linear-gradient(180deg,#1D1D1F 0%,#007AFF 130%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tagline{color:var(--text-2);font-size:15px}
.btn{padding:14px 24px;border-radius:12px;font-size:15px;font-weight:600;
  font-family:inherit;border:none;cursor:pointer;width:100%;
  transition:background .15s, transform .15s;letter-spacing:-.2px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 3px 14px rgba(0,122,255,.4)}
.btn.primary:active{background:var(--blue-h);transform:scale(.98)}
.btn.secondary{background:rgba(245,245,247,.85);color:var(--text);
  border:1px solid rgba(0,0,0,.08)}
.btn.secondary:active{background:rgba(230,230,235,.95)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px}
.form label>span{font-size:12px;font-weight:600;color:var(--text-2)}
.form input,.form select{padding:12px 14px;border-radius:11px;
  border:1.5px solid transparent;background:rgba(245,245,247,.8);
  font-size:15px;font-family:inherit;color:var(--text);outline:none;
  transition:border-color .15s, background .15s, box-shadow .15s;
  -webkit-appearance:none;appearance:none;width:100%}
.form input:focus,.form select:focus{background:#fff;
  border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.12)}
.worlds-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;
  max-height:50vh;padding:2px}
.world-card{display:flex;align-items:center;gap:12px;
  padding:12px;background:rgba(245,245,247,.65);border-radius:14px;
  cursor:pointer;border:1.5px solid transparent;
  transition:background .15s, border-color .15s}
.world-card:active{background:rgba(232,241,255,.95);
  border-color:rgba(0,122,255,.2)}
.world-thumb{width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(145deg,#5AC8FA 0%,#007AFF 100%);
  display:flex;align-items:center;justify-content:center}
.world-thumb::after{content:'';width:16px;height:16px;border-radius:5px;background:#fff}
.world-info{flex:1;min-width:0}
.world-name{font-size:14px;font-weight:600;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.world-meta{font-size:11px;color:var(--text-2)}
.world-delete{width:32px;height:32px;border-radius:9px;border:none;
  background:transparent;color:var(--text-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  font-family:inherit;flex-shrink:0}
.world-delete:active{background:rgba(255,59,48,.12);color:var(--danger)}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:28px 16px;text-align:center}
.empty-icon{width:54px;height:54px;border-radius:15px;
  background:rgba(0,122,255,.1);color:var(--blue);font-size:24px;
  display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.empty-state p{font-size:14px;font-weight:600}
.empty-state .sub{color:var(--text-2);font-size:12px;font-weight:400}
.pause-actions{display:flex;flex-direction:column;gap:9px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 12px;background:rgba(245,245,247,.6);border-radius:10px}
.setting label{font-size:13px;font-weight:500;color:var(--text);flex:1}
.setting .val{font-size:12px;color:var(--text-2);
  font-family:ui-monospace,monospace;min-width:36px;text-align:right}
.setting input[type=range]{width:110px;accent-color:var(--blue);flex-shrink:0}
.setting input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue);flex-shrink:0}
.sec-title{font-size:11px;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.6px;margin-top:4px}

/* Инвентарь */
#invGrid,#chestGrid,#invGridChest{display:grid;grid-template-columns:repeat(6,1fr);
  gap:6px;max-height:36vh;overflow-y:auto;padding:2px}
.inv-cell{aspect-ratio:1;border-radius:10px;cursor:pointer;position:relative;
  background:rgba(245,245,247,.6);border:1.5px solid transparent;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:background .15s, border-color .15s}
.inv-cell:active{background:rgba(232,241,255,.95);border-color:rgba(0,122,255,.25)}
.inv-cell.active{background:#fff;border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(0,122,255,.18)}
.inv-cell .ic{width:78%;height:78%;background-size:cover;image-rendering:pixelated;
  display:flex;align-items:center;justify-content:center;font-size:22px}
.inv-cell .ct{position:absolute;bottom:2px;right:4px;font-size:10px;
  font-weight:700;color:#fff;text-shadow:1px 1px 2px #000,0 0 3px #000}
.inv-cell.empty{background:rgba(0,0,0,.05);cursor:default}
.panel-hint{font-size:11px;color:var(--text-3);text-align:center}

@media (max-width:420px){
  #hotbar{left:60px;right:160px;height:52px}
  .slot{width:44px;height:44px}
  #joystick{width:118px;height:118px;bottom:16px;left:14px}
  #joyKnob{width:48px;height:48px}
  #rightBtns .act{width:56px;height:56px;font-size:22px}
  #rightBtns .act.big{width:66px;height:66px;font-size:26px}
  #rightBtns .act.viewBtn{width:46px;height:46px;font-size:18px}
}
</style>
</head>
<body>

<div id="hud">
  <div id="cross"><div class="dot"></div></div>
  <div id="toast"></div>
  <div id="hotbar"></div>

  <button class="hud-btn" id="btnPause" title="Меню">☰</button>

  <div id="topRight">
    <button class="hud-btn" id="btnInventory" title="Инвентарь">🎒</button>
    <button class="hud-btn" id="btnEmotes" title="Эмоции">😊</button>
  </div>

  <div id="joystick">
    <div id="joyBase"></div>
    <div id="joyKnob"></div>
  </div>

  <div id="rightBtns">
    <button class="act viewBtn" id="btnView" title="Вид">👁</button>
    <button class="act placeBtn" id="btnPlace" title="Поставить блок">✚</button>
    <button class="act breakBtn" id="btnBreak" title="Сломать блок">⛏</button>
    <button class="act big" id="btnJump" title="Прыжок">↑</button>
  </div>

  <div id="emoteBar"></div>
</div>

<div id="dmgFlash"></div>
<div id="underwater"></div>
<div id="rainOverlay"></div>

<!-- ═══════ МЕНЮ ═══════ -->
<div id="mainMenu" class="overlay">
  <div class="menu-content">
    <div class="menu-logo"></div>
    <h1>Песочница</h1>
    <p class="tagline">Стройте. Исследуйте. Выживайте.</p>
    <button class="btn primary" id="btnPlay">Начать игру</button>
  </div>
</div>

<div id="worldList" class="overlay hidden">
  <div class="panel">
    <div class="panel-header">
      <button class="btn-icon" id="btnBackFromWorlds">←</button>
      <h2>Мои миры</h2>
    </div>
    <div id="worldsList" class="worlds-list"></div>
    <button class="btn primary" id="btnNewWorld">+ Создать новый мир</button>
  </div>
</div>

<div id="createWorld" class="overlay hidden">
  <div class="panel">
    <div class="panel-header">
      <button class="btn-icon" id="btnBackFromNew">←</button>
      <h2>Новый мир</h2>
    </div>
    <div class="form">
      <label><span>Название</span>
        <input id="worldNameInput" type="text" placeholder="Мой мир" maxlength="40"
               autocomplete="off" spellcheck="false"></label>
      <label><span>Сид (необязательно)</span>
        <input id="worldSeedInput" type="text" placeholder="Случайный"
               autocomplete="off" spellcheck="false"></label>
      <label><span>Режим</span>
        <select id="worldModeSelect">
          <option value="survival">Выживание</option>
          <option value="creative">Творчество (полёт)</option>
        </select></label>
    </div>
    <button class="btn primary" id="btnCreateWorld">Создать и играть</button>
  </div>
</div>

<div id="inventoryScreen" class="overlay hidden">
  <div class="panel">
    <div class="panel-header">
      <button class="btn-icon" id="btnCloseInventory">✕</button>
      <h2>Инвентарь</h2>
    </div>
    <div class="sec-title">Выберите блок</div>
    <div id="invGrid"></div>
  </div>
</div>

<div id="chestScreen" class="overlay hidden">
  <div class="panel">
    <div class="panel-header">
      <button class="btn-icon" id="btnCloseChest">✕</button>
      <h2>Сундук</h2>
    </div>
    <div class="sec-title">Содержимое</div>
    <div id="chestGrid"></div>
    <div class="sec-title" style="margin-top:6px">Ваш инвентарь</div>
    <div id="invGridChest"></div>
  </div>
</div>

<div id="settingsScreen" class="overlay hidden">
  <div class="panel narrow">
    <div class="panel-header">
      <button class="btn-icon" id="btnCloseSettings">✕</button>
      <h2>Настройки</h2>
    </div>
    <div class="form">
      <div class="sec-title">Камера</div>
      <div class="setting">
        <label>Обзор (FOV)</label>
        <input type="range" id="setFov" min="60" max="110" step="1" value="72">
        <span class="val" id="setFovV">72</span>
      </div>
      <div class="setting">
        <label>Дальность</label>
        <input type="range" id="setFar" min="100" max="400" step="10" value="220">
        <span class="val" id="setFarV">220</span>
      </div>
      <div class="setting">
        <label>Чувствительность</label>

    const s = 0.4+rng()*0.6;
    decorGroup.add(makeRock(x,z,s,rng, biome==='snow'));
    obstacles.push({x,z,r:s*0.95});
  }
}

function makeBlockTexture(baseColor, variance, opts){
  opts = opts || {};
  const S=64, c=document.createElement('canvas'); c.width=c.height=S;
  const x=c.getContext('2d');
  const base = new THREE.Color(baseColor);
  const br=base.r*255, bg=base.g*255, bb=base.b*255;
  x.fillStyle=`rgb(${br|0},${bg|0},${bb|0})`;
  x.fillRect(0,0,S,S);
  const count = opts.detail || 700;
  for(let i=0;i<count;i++){
    const l=(Math.random()-.5)*variance;
    const r=Math.max(0,Math.min(255,br+l))|0;
    const g=Math.max(0,Math.min(255,bg+l))|0;
    const b=Math.max(0,Math.min(255,bb+l))|0;
    x.fillStyle=`rgb(${r},${g},${b})`;
    const s = 1+Math.random()*3;
    x.fillRect(Math.random()*S, Math.random()*S, s, s);
  }
  if(opts.brick){
    x.strokeStyle='rgba(0,0,0,.25)'; x.lineWidth=1;
    for(let yy=0;yy<S;yy+=16){
      x.beginPath(); x.moveTo(0,yy); x.lineTo(S,yy); x.stroke();
      const off=(Math.floor(yy/16)%2)?16:0;
      for(let xx=off;xx<S;xx+=32){ x.beginPath(); x.moveTo(xx,yy); x.lineTo(xx,yy+16); x.stroke(); }
    }
  }
  if(opts.plank){
    x.strokeStyle='rgba(0,0,0,.22)'; x.lineWidth=1;
    for(let yy=0;yy<S;yy+=10){ x.beginPath(); x.moveTo(0,yy); x.lineTo(S,yy); x.stroke(); }
  }
  if(opts.glass){
    x.clearRect(0,0,S,S);
    x.fillStyle=`rgba(${br|0},${bg|0},${bb|0},0.18)`;
    x.fillRect(0,0,S,S);
    x.strokeStyle='rgba(255,255,255,.85)'; x.lineWidth=4;
    x.strokeRect(2,2,S-4,S-4);
  }
  if(opts.ore){
    const cols={coal:'#1a1a1a', iron:'#c9b8a0', gold:'#f0c14b', diamond:'#6fe8d8'};
    x.fillStyle = cols[opts.ore] || '#fff';
    for(let i=0;i<7;i++){
      const px=8+Math.random()*(S-16), py=8+Math.random()*(S-16);
      const sz=5+Math.random()*4;
      x.beginPath();
      x.moveTo(px,py-sz/2); x.lineTo(px+sz/2,py);
      x.lineTo(px,py+sz/2); x.lineTo(px-sz/2,py);
      x.closePath(); x.fill();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestMipmapLinearFilter;
  t.anisotropy = 4;
  return t;
}

const blocks = [];

const keyOf = (x,y,z) => `${x},${y},${z}`;
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}

function addBlock(x, y, z, typeIdx, instant, rotation){
  if(blocks.length >= MAX_BLOCKS) return false;
  const k = keyOf(x,y,z);
  if(blockIndex.has(k)) return false;
  if(y < 0.5) return false;
  let t;
  if(typeof typeIdx === 'number') t = typeIdx;
  else {
    const slot = currentSlot();
    t = (slot && slot.type === 'block') ? slot.idx : 0;
  }
  const m = buildBlockGroup(t, rotation || 0);
  m.position.set(x,y,z);
  m.userData.key = k;
  if(instant){
    m.scale.setScalar(1); m.userData.spawn = 1;
  } else {
    m.userData.spawn = 0; m.scale.setScalar(0.01); spawning.push(m);
  }
  scene.add(m); blocks.push(m); blockIndex.set(k, m);
  if(t === CHEST_IDX && !chests.has(k)) chests.set(k, new Array(27).fill(null));
  return true;
}
function spawnDebris(pos, material, count){
  count = count || 8;
  for(let i=0;i<count;i++){
    if(debris.length >= MAX_DEBRIS){
      const old = debris.shift();
      scene.remove(old.mesh);
    }
    const dir = new THREE.Vector3(Math.random()-.5, Math.random()*.8+.1, Math.random()-.5).normalize();

function findBlockRoot(obj){
  while(obj && !obj.userData.isBlockRoot) obj = obj.parent;
  return obj;
}
function removeBlock(root, spawnFx){
  if(spawnFx === undefined) spawnFx = true;
  const k = root.userData.key;
  if(!blockIndex.has(k)) return;
  blockIndex.delete(k);
  const idx = blocks.indexOf(root);
  if(idx >= 0) blocks.splice(idx, 1);
  const sIdx = spawning.indexOf(root);
  if(sIdx >= 0) spawning.splice(sIdx, 1);
  scene.remove(root);
  if(root.userData.typeIdx === CHEST_IDX){
    chests.delete(k);
  }
  if(spawnFx){
    const t = BLOCK_TYPES[root.userData.typeIdx];
    if(t) spawnDebris(root.position.clone(), t.material);
    AUDIO.breakBlock();
    if(settings.particles && t) particlesBlockBreak(root.position.clone(), t);
  }
}
function updateSpawning(dt){
  for(let i=spawning.length-1;i>=0;i--){
    const m = spawning[i];
    m.userData.spawn += dt*5.5;
    if(m.userData.spawn >= 1){
      m.userData.spawn = 1; m.scale.setScalar(1); spawning.splice(i,1);
    } else {
      m.scale.setScalar(Math.max(0.01, easeOutBack(m.userData.spawn)));
    }
  }
}
function updateDebris(dt){
  for(let i=debris.length-1;i>=0;i--){
    const d = debris[i];
    d.life -= dt;
    if(d.life <= 0){ scene.remove(d.mesh); debris.splice(i,1); continue; }
    d.vy -= 22*dt;
    d.mesh.position.x += d.vx*dt;
    d.mesh.position.y += d.vy*dt;
    d.mesh.position.z += d.vz*dt;
    if(d.mesh.position.y < 0.12){
      d.mesh.position.y = 0.12; d.vy *= -0.35;
      d.vx *= 0.7; d.vz *= 0.7;
      d.ax *= 0.6; d.ay *= 0.6; d.az *= 0.6;
    }
    d.mesh.rotation.x += d.ax*dt;
    d.mesh.rotation.y += d.ay*dt;
    d.mesh.rotation.z += d.az*dt;
    d.mesh.scale.multiplyScalar(1 - dt*0.8);
  }
}

function groundHeightAt(x, z, currentY, radius, stepUp){
  if(radius === undefined) radius = PLAYER_R;
  if(stepUp === undefined) stepUp = 0.36;
  let h = 0;
  for(const b of blocks){
    const bp = b.position;
    if(x > bp.x-0.5-radius && x < bp.x+0.5+radius &&
       z > bp.z-0.5-radius && z < bp.z+0.5+radius){
      const top = bp.y + 0.5;
      if(top <= currentY + stepUp && top > h) h = top;
    }
  }
  return h;
}
function resolveBlockCollisions(){
  const feet = player.y;
  const headY = feet + PLAYER_H;
  for(const b of blocks){
    const bt = BLOCK_TYPES[b.userData.typeIdx];
    if(!bt) continue;
    if(bt.kind === 'water' || bt.kind === 'flower' || bt.kind === 'torch') continue;
    const bp = b.position;
    const minX = bp.x-0.5, maxX = bp.x+0.5;
    const minY = bp.y-0.5, maxY = bp.y+0.5;
    const minZ = bp.z-0.5, maxZ = bp.z+0.5;
    if(headY < minY+0.02) continue;
    if(feet > maxY-0.06) continue;
    const cx = Math.max(minX, Math.min(player.x, maxX));
    const cz = Math.max(minZ, Math.min(player.z, maxZ));
    let dx = player.x-cx, dz = player.z-cz;
    let d = Math.hypot(dx,dz);
    if(d < PLAYER_R){
      if(d < 1e-5){ dx = 1; dz = 0; d = 1; }
      const push = (PLAYER_R-d)/d;
      player.x += dx*push; player.z += dz*push;
    }
  }
}
function resolveObstacleCollisions(){
  for(const o of obstacles){
    const dx = player.x-o.x, dz = player.z-o.z;
    const d = Math.hypot(dx,dz);
    const minD = o.r + PLAYER_R;
    if(d < minD){
      if(d < 1e-5){ player.x += minD; continue; }
      const push = (minD-d)/d;
      player.x += dx*push; player.z += dz*push;
    }
  }
}
function isInWater(){
  return player.y < WATER_LEVEL+0.3 && player.z > OCEAN_START_Z-2 &&
         Math.abs(player.x) < GROUND_SIZE/2 && player.z < OCEAN_END_Z+10;
}
function blockUnderFeet(){
  const x = player.x, y = player.y - 0.05, z = player.z;
  for(const b of blocks){
    if(Math.abs(b.position.x - Math.round(x)) < 0.55 &&
       Math.abs(b.position.y - (Math.round(y-0.5)+0.5)) < 0.6 &&
       Math.abs(b.position.z - Math.round(z)) < 0.55){
      return b;
    }
  }
  return null;
}

const particles = [];
const particlePool = [];
function spawnParticle(pos, opts){
  if(!settings.particles) return;
  const size = opts.size || 0.1;
  const color = opts.color || 0xffffff;
  const life = opts.life || 0.8;
  let mesh;
  if(particlePool.length > 0){
    mesh = particlePool.pop();
    mesh.material.color.setHex(color);
    mesh.material.opacity = 1;
    mesh.visible = true;
  } else {
    mesh = new THREE.Mesh(new THREE.SphereGeometry(0.1,4,3),
      new THREE.MeshBasicMaterial({color, transparent:true}));
    scene.add(mesh);
  }
  mesh.position.copy(pos);
  mesh.scale.setScalar(size*10);
  particles.push({
    mesh,
    vx:opts.vx||0, vy:opts.vy||0, vz:opts.vz||0,
    gravity:opts.gravity||0, rise:opts.rise||0,
    life, maxLife:life, fade: opts.fade !== false, size,
  });
  if(particles.length > MAX_PARTICLES){
    const old = particles.shift();
    scene.remove(old.mesh);
    particlePool.push(old.mesh);
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){
      scene.remove(p.mesh);
      particlePool.push(p.mesh);
      particles.splice(i,1);
      continue;
    }
    p.vy -= p.gravity*dt;
    p.mesh.position.x += p.vx*dt;
    p.mesh.position.y += p.vy*dt + p.rise*dt;
    p.mesh.position.z += p.vz*dt;
    const t = p.life/p.maxLife;
    if(p.fade) p.mesh.material.opacity = t;
    p.mesh.scale.setScalar(p.size*10*(0.4+0.6*t));
  }
}

function surfaceAt(x, z){
  const biome = biomeAt(x, z, 0);
  if(biome === 'desert') return 'sand';
  if(biome === 'snow') return 'snow';
  for(const b of blocks){
    if(Math.abs(b.position.x - Math.round(x)) < 0.55 &&
       b.position.y > 0 && b.position.y < 0.6 &&
       Math.abs(b.position.z - Math.round(z)) < 0.55){

function hitAnimal(animal, dmg){
  if(animal.dead) return;
  animal.hp -= dmg;
  animal.hitFlash = 1;
  animal.state = 'flee'; animal.stateTimer = 2.5;
  const dx = animal.x-player.x, dz = animal.z-player.z;
  const len = Math.hypot(dx,dz) || 1;
  animal.targetX = animal.x + (dx/len)*8;
  animal.targetZ = animal.z + (dz/len)*8;
  particlesBlood(new THREE.Vector3(animal.x, 0.9, animal.z));
  if(animal.hp <= 0){
    animal.dead = true;
    scene.remove(animal.root);
    toast(`${animal.type==='cow'?'Корова':animal.type==='pig'?'Свинья':'Собака'} побеждена`);
  }
}
function updateAnimals(dt){
  const alive = animals.filter(a => !a.dead).length;
  if(alive < 6 && Math.random() < dt*0.15 && !isNight){
    spawnAnimal(['cow','pig','dog'][Math.floor(Math.random()*3)]);
  }
  for(let i=animals.length-1;i>=0;i--){
    const a = animals[i];
    if(a.dead){ animals.splice(i,1); continue; }
    a.stateTimer -= dt;
    a.mooTimer -= dt;
    if(a.mooTimer <= 0 && Math.hypot(a.x-player.x, a.z-player.z) < 12){
      if(a.type === 'cow' && Math.random() < 0.4) AUDIO.moo();
      a.mooTimer = 6+Math.random()*12;
    }
    if(a.stateTimer <= 0){
      const r = Math.random();
      if(r < 0.35){ a.state = 'idle'; a.stateTimer = 1.5+Math.random()*3; }
      else if(r < 0.8){
        a.state = 'wander'; a.stateTimer = 2+Math.random()*3;
        const ang = Math.random()*6.283, dist = 2+Math.random()*5;
        a.targetX = a.x+Math.cos(ang)*dist;
        a.targetZ = a.z+Math.sin(ang)*dist;
      } else { a.state = 'look'; a.stateTimer = 1+Math.random()*2; }
    }
    let moving = false, targetSpeed = 0;
    if(a.state === 'wander') targetSpeed = 1.3;
    else if(a.state === 'flee') targetSpeed = 3.4;
    if(targetSpeed > 0){
      const dx = a.targetX-a.x, dz = a.targetZ-a.z;
      const dist = Math.hypot(dx,dz);
      if(dist > 0.15){
        const nx = dx/dist, nz = dz/dist;
        a.speed += (targetSpeed-a.speed)*Math.min(1, dt*5);
        a.x += nx*a.speed*dt; a.z += nz*a.speed*dt;
        const tf = Math.atan2(nx, nz);
        let d = (tf-a.facing) % (Math.PI*2);
        if(d > Math.PI) d -= Math.PI*2;
        if(d < -Math.PI) d += Math.PI*2;
        a.facing += d*Math.min(1, dt*5);
        moving = true;
      } else { a.state = 'idle'; a.stateTimer = 1+Math.random()*2; }
    } else { a.speed *= Math.exp(-dt*4); }
    for(const o of obstacles){
      const dx = a.x-o.x, dz = a.z-o.z;
      const d = Math.hypot(dx,dz);
      const minD = o.r+0.45;
      if(d < minD && d > 0.0001){
        const push = (minD-d)/d;
        a.x += dx*push; a.z += dz*push;
      }
    }
    const LIMIT = GROUND_SIZE/2-3;
    a.x = Math.max(-LIMIT, Math.min(LIMIT, a.x));
    a.z = Math.max(-LIMIT, Math.min(LIMIT, a.z));
    const gh = groundHeightAt(a.x, a.z, a.y, 0.35, 0.55);
    a.y += (gh-a.y)*Math.min(1, dt*8);
    const walkAmt = moving ? 1 : 0;
    a.phase += dt*(moving ? a.speed*3.4 : 0);
    const bob = Math.abs(Math.sin(a.phase))*0.025*walkAmt;
    a.root.position.set(a.x, a.y+bob, a.z);
    a.root.rotation.y = a.facing;
    const sw = Math.sin(a.phase);
    if(a.parts.legFL){
      a.parts.legFL.rotation.x =  sw*0.55*walkAmt;
      a.parts.legFR.rotation.x = -sw*0.55*walkAmt;
      a.parts.legBL.rotation.x = -sw*0.55*walkAmt;
      a.parts.legBR.rotation.x =  sw*0.55*walkAmt;
    }
    if(a.parts.head){
      const dx = player.x-a.x, dz = player.z-a.z;
      const dist = Math.hypot(dx,dz);
      if(dist < 8){
        const tp = Math.atan2(dx, dz);
        let hy = tp-a.facing;
        while(hy > Math.PI) hy -= Math.PI*2;
        while(hy < -Math.PI) hy += Math.PI*2;
        hy = Math.max(-0.7, Math.min(0.7, hy));
        a.parts.head.rotation.y += (hy-a.parts.head.rotation.y)*Math.min(1, dt*3);
      }
    }
    if(a.hitFlash > 0){
      a.hitFlash = Math.max(0, a.hitFlash-dt*3.5);
      a.root.traverse(o => {
        if(o.isMesh && o.material.emissive) o.material.emissive.setHex(0xff2020);
      });
    } else {
      a.root.traverse(o => {
        if(o.isMesh && o.material.emissive) o.material.emissive.setHex(0x000000);
      });
    }
  }
}

const mobs = [];
const ZOMBIE_MAT = {
  body: new THREE.MeshStandardMaterial({color:0x2a5a3a, roughness:0.9}),
  head: new THREE.MeshStandardMaterial({color:0x4a7a5a, roughness:0.9}),
  eye:  new THREE.MeshStandardMaterial({color:0x101010}),
  pants:new THREE.MeshStandardMaterial({color:0x2a3a5a, roughness:0.9}),
};
function createZombie(){
  const root = new THREE.Group(); const parts = {};
  const torso = animalBox(0.5,0.75,0.28,ZOMBIE_MAT.body);
  torso.position.y = 1.15; torso.castShadow = true; root.add(torso);
  const head = new THREE.Group(); head.position.y = 1.7; root.add(head);
  const hb = animalBox(0.42,0.42,0.42,ZOMBIE_MAT.head); hb.castShadow = true; head.add(hb);
  const eL = animalBox(0.06,0.06,0.02,ZOMBIE_MAT.eye); eL.position.set(-0.1,0.05,0.22); head.add(eL);
  const eR = animalBox(0.06,0.06,0.02,ZOMBIE_MAT.eye); eR.position.set(0.1,0.05,0.22); head.add(eR);
  parts.head = head;
  parts.armL = new THREE.Group(); parts.armL.position.set(-0.35,1.45,0); root.add(parts.armL);
  const aL = animalBox(0.18,0.7,0.18,ZOMBIE_MAT.body); aL.position.y=-0.35; parts.armL.add(aL);
  parts.armR = new THREE.Group(); parts.armR.position.set(0.35,1.45,0); root.add(parts.armR);
  const aR = animalBox(0.18,0.7,0.18,ZOMBIE_MAT.body); aR.position.y=-0.35; parts.armR.add(aR);
  parts.armL.rotation.x = -Math.PI/2; parts.armR.rotation.x = -Math.PI/2;
  parts.legL = new THREE.Group(); parts.legL.position.set(-0.15,0.75,0); root.add(parts.legL);
  const lL = animalBox(0.18,0.75,0.18,ZOMBIE_MAT.pants); lL.position.y=-0.375; parts.legL.add(lL);
  parts.legR = new THREE.Group(); parts.legR.position.set(0.15,0.75,0); root.add(parts.legR);
  const lR = animalBox(0.18,0.75,0.18,ZOMBIE_MAT.pants); lR.position.y=-0.375; parts.legR.add(lR);
  return {root, parts};
}
function spawnMob(){
  const ang = Math.random()*6.283;
  const d = 18+Math.random()*10;
  const x = player.x+Math.cos(ang)*d;
  const z = player.z+Math.sin(ang)*d;
  if(z > OCEAN_START_Z-4) return null;
  const m = createZombie();
  isolateMaterials(m.root);
  m.root.position.set(x,0,z);
  scene.add(m.root);
  const mob = {
    root:m.root, parts:m.parts, type:'zombie',
    x, z, y:0, facing:0,
    hp:40, attackCd:0, phase:0, hitFlash:0, dead:false, burnTimer:0,
  };
  mobs.push(mob);
  return mob;
}
function damageMob(mob, dmg){
  if(mob.dead) return;
  mob.hp -= dmg;
  mob.hitFlash = 1;
  particlesBlood(new THREE.Vector3(mob.x, mob.y+1.0, mob.z));
  if(mob.hp <= 0){
    mob.dead = true;
    spawnDebris(new THREE.Vector3(mob.x, 0.8, mob.z), ZOMBIE_MAT.body, 8);
    scene.remove(mob.root);
    toast('Зомби повержен');
  }
}
function updateMobs(dt){
  if(isNight){
    const alive = mobs.filter(m => !m.dead).length;
    if(alive < 5 && Math.random() < dt*0.4){
      spawnMob();
    }
  } else {
    for(const m of mobs){
      if(m.dead) continue;
      m.burnTimer += dt;
      if(m.burnTimer > 0.6){
        m.burnTimer = 0;
        damageMob(m, 3);
      }
    }
  }
  for(let i=mobs.length-1;i>=0;i--){
    const m = mobs[i];
    if(m.dead){ mobs.splice(i,1); continue; }
    if(Math.hypot(m.x-player.x, m.z-player.z) > 55){
      scene.remove(m.root); mobs.splice(i,1); continue;
    }
    const dx = player.x-m.x, dz = player.z-m.z;
    const dist = Math.hypot(dx,dz);
    const tf = Math.atan2(dx, dz);
    let d = (tf-m.facing) % (Math.PI*2);
    if(d > Math.PI) d -= Math.PI*2;
    if(d < -Math.PI) d += Math.PI*2;
    m.facing += d*Math.min(1, dt*4);
    m.root.rotation.y = m.facing;
    const speed = 1.6;
    if(dist > 1.4 && dist < 30){
      m.x += (dx/dist)*speed*dt; m.z += (dz/dist)*speed*dt;
      m.phase += dt*speed*3.4;
      const sw = Math.sin(m.phase);
      m.parts.legL.rotation.x =  sw*0.5;
      m.parts.legR.rotation.x = -sw*0.5;
    } else {
      m.parts.legL.rotation.x *= Math.exp(-dt*5);
      m.parts.legR.rotation.x *= Math.exp(-dt*5);
    }
    for(const o of obstacles){
      const ox = m.x-o.x, oz = m.z-o.z;
      const od = Math.hypot(ox,oz);
      const minD = o.r+0.4;
      if(od < minD && od > 0.0001){
        const push = (minD-od)/od;
        m.x += ox*push; m.z += oz*push;
      }
    }
    const LIMIT = GROUND_SIZE/2-3;
    m.x = Math.max(-LIMIT, Math.min(LIMIT, m.x));
    m.z = Math.max(-LIMIT, Math.min(LIMIT, m.z));
    m.y = groundHeightAt(m.x, m.z, 0, 0.35, 0.55);
    m.root.position.set(m.x, m.y, m.z);
    m.attackCd -= dt;
    if(dist < 1.6 && m.attackCd <= 0 && player.alive){
      damagePlayer(8);
      m.attackCd = 1.0;
      AUDIO.zombie();
    }
    if(m.hitFlash > 0){
      m.hitFlash = Math.max(0, m.hitFlash-dt*4);
      m.root.traverse(o => {
        if(o.isMesh && o.material.emissive) o.material.emissive.setHex(0xff2020);
      });
    } else {
      m.root.traverse(o => {
        if(o.isMesh && o.material.emissive) o.material.emissive.setHex(0x000000);
      });
    }
  }
}

/* ═══════════ ВВОД — КАМЕРА И ДЖОЙСТИК ═══════════ */
let yaw = 0, pitch = -0.22;
const PITCH_MIN = -1.45, PITCH_MAX = 1.45;
let camDist = settings.camDist;

const touchState = {
  joyId: null, joyCenterX: 0, joyCenterY: 0, joyX: 0, joyY: 0,
  lookId: null, lookLastX: 0, lookLastY: 0, lookStartX: 0, lookStartY: 0, lookStartTime: 0, lookMoved: false,
  pinchActive: false, pinchDist: 0, pinchStartCamDist: 0,
};

const joystickEl = document.getElementById('joystick');
const joyKnob = document.getElementById('joyKnob');
const JOY_RADIUS = 46;

function updateJoy(cx, cy){
  const dx = cx - touchState.joyCenterX;
  const dy = cy - touchState.joyCenterY;
  const d = Math.hypot(dx, dy);
  const clampedD = Math.min(d, JOY_RADIUS);
  const nx = d > 0.01 ? dx/d : 0;
  const ny = d > 0.01 ? dy/d : 0;
  touchState.joyX = nx * (clampedD/JOY_RADIUS);
  touchState.joyY = ny * (clampedD/JOY_RADIUS);
  joyKnob.style.transform = `translate(calc(-50% + ${nx*clampedD}px), calc(-50% + ${ny*clampedD}px))`;
}
function resetJoy(){
  touchState.joyId = null;
  touchState.joyX = 0;
  touchState.joyY = 0;
  joyKnob.style.transform = 'translate(-50%,-50%)';
}

joystickEl.addEventListener('touchstart', e => {
  e.preventDefault();
  if(touchState.joyId !== null) return;
  const t = e.changedTouches[0];
  touchState.joyId = t.identifier;
  const rect = joystickEl.getBoundingClientRect();
  touchState.joyCenterX = rect.left + rect.width/2;
  touchState.joyCenterY = rect.top + rect.height/2;
  updateJoy(t.clientX, t.clientY);
}, {passive:false});

/* Тач на canvas — камера + pinch */
const canvasEl = renderer.domElement;
canvasEl.addEventListener('touchstart', e => {
  if(state !== 'playing') return;
  /* Pinch detection */
  if(e.touches.length === 2){
    e.preventDefault();
    touchState.pinchActive = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchState.pinchDist = Math.hypot(dx, dy);
    touchState.pinchStartCamDist = camDist;
    touchState.lookId = null;
    return;
  }
  if(e.touches.length === 1 && !touchState.pinchActive){
    if(touchState.lookId !== null) return;
    const t = e.changedTouches[0];
    touchState.lookId = t.identifier;
    touchState.lookLastX = t.clientX;
    touchState.lookLastY = t.clientY;
    touchState.lookStartX = t.clientX;
    touchState.lookStartY = t.clientY;
    touchState.lookStartTime = performance.now();
    touchState.lookMoved = false;
  }
}, {passive:false});

canvasEl.addEventListener('touchmove', e => {
  if(state !== 'playing') return;
  /* Pinch */
  if(touchState.pinchActive && e.touches.length === 2){
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const ratio = touchState.pinchDist / Math.max(dist, 1);
    camDist = clamp(touchState.pinchStartCamDist * ratio, CAM_MIN, CAM_MAX);
    return;
  }
  /* Camera look */
  if(e.touches.length === 1 && !touchState.pinchActive && touchState.lookId !== null){
    for(const t of e.changedTouches){
      if(t.identifier !== touchState.lookId) continue;
      e.preventDefault();
      const dx = t.clientX - touchState.lookLastX;
      const dy = t.clientY - touchState.lookLastY;
      if(Math.abs(t.clientX - touchState.lookStartX) + Math.abs(t.clientY - touchState.lookStartY) > 22){
        touchState.lookMoved = true;
      }
      const sx = settings.sensitivity * (settings.invertX ? -1 : 1);
      const sy = settings.sensitivity * (settings.invertY ? -1 : 1);
      yaw   -= dx * 0.006 * sx;
      pitch -= dy * 0.006 * sy;
      pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
      touchState.lookLastX = t.clientX;
      touchState.lookLastY = t.clientY;
      return;
    }
  }
}, {passive:false});

canvasEl.addEventListener('touchend', e => {
  if(e.touches.length < 2){
    touchState.pinchActive = false;
    settings.camDist = camDist;
    settings.save();
  }
  for(const t of e.changedTouches){
    if(t.identifier === touchState.lookId){
      touchState.lookId = null;
    }
    if(t.identifier === touchState.joyId){
      resetJoy();
    }
  }
});
canvasEl.addEventListener('touchcancel', e => {
  touchState.pinchActive = false;
  touchState.lookId = null;
});

/* Глобальный touchmove для джойстика */
document.addEventListener('touchmove', e => {
  if(touchState.joyId === null) return;
  for(const t of e.changedTouches){
    if(t.identifier === touchState.joyId){
      e.preventDefault();
      updateJoy(t.clientX, t.clientY);
      return;
    }
  }
}, {passive:false});

/* ═══════════ ДЕЙСТВИЯ С БЛОКАМИ ═══════════ */
const raycaster = new THREE.Raycaster();
const CENTER = new THREE.Vector2(0, 0);

function snapRotation(){ return Math.round(player.facing/(Math.PI/2))*(Math.PI/2); }

function tryPlaceBlock(){
  if(!player.alive) return;
  raycaster.setFromCamera(CENTER, camera);
  raycaster.far = REACH;
  const hits = raycaster.intersectObjects([ground, ...blocks], true);
  const hit = hits.find(h => h.object.isMesh && h.face);
  if(!hit) return;
  const root = findBlockRoot(hit.object);
  if(root && root.userData.typeIdx === CHEST_IDX && hit.distance < 3){
    openChest(root.userData.key);
    return;
  }
  const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const p = hit.point.clone().addScaledVector(normal, 0.5);
  const bx = Math.floor(p.x)+0.5, by = Math.floor(p.y)+0.5, bz = Math.floor(p.z)+0.5;
  if(by < 0.5) return;
  const dx = bx-player.x, dz = bz-player.z;
  if(Math.hypot(dx,dz) < 0.85 && by < player.y+PLAYER_H && by+0.5 > player.y) return;
  if(addBlock(bx, by, bz, undefined, false, snapRotation())){
    player.swing = 1; player.swingT = 0.28;
    AUDIO.place();
  }
}
function tryRemoveBlock(){
  raycaster.setFromCamera(CENTER, camera);
  raycaster.far = REACH;
  const hits = raycaster.intersectObjects(blocks, true);
  const hit = hits.find(h => h.object.isMesh && h.face);
  if(hit){
    const root = findBlockRoot(hit.object);
    if(root){ removeBlock(root); player.swing = 1; player.swingT = 0.28; }
  }
}

const weatherState = { type:'clear', intensity:0, targetIntensity:0, timer:60 };
const rainOverlayEl = document.getElementById('rainOverlay');
function setWeather(type){
  weatherState.type = type;
  if(type === 'clear') weatherState.targetIntensity = 0;
  else if(type === 'rain') weatherState.targetIntensity = 0.6;
  else weatherState.targetIntensity = 0.9;
}
function updateWeather(dt){
  weatherState.timer -= dt;
  if(weatherState.timer <= 0){
    const r = Math.random();
    if(weatherState.type === 'clear'){
      if(r < 0.25) setWeather('rain');
      else if(r < 0.35) setWeather('thunder');
    } else {
      if(r < 0.5) setWeather('clear');
    }
    weatherState.timer = 60 + Math.random()*80;
  }
  weatherState.intensity += (weatherState.targetIntensity - weatherState.intensity)*Math.min(1, dt*0.5);
  rainOverlayEl.style.opacity = weatherState.intensity > 0.02 ? String(weatherState.intensity*0.7) : '0';
}

/* ═══════════ СОХРАНЕНИЕ ═══════════ */
const WORLDS_KEY = 'sandbox3d_worlds_v5';
let memoryFallbackWorlds = null;
function getWorlds(){
  if(memoryFallbackWorlds) return memoryFallbackWorlds;
  try{
    const raw = localStorage.getItem(WORLDS_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    if(!memoryFallbackWorlds) memoryFallbackWorlds = [];
    return memoryFallbackWorlds;
  }
}
function putWorlds(list){
  if(memoryFallbackWorlds !== null){ memoryFallbackWorlds = list; return; }
  try{ localStorage.setItem(WORLDS_KEY, JSON.stringify(list)); }
  catch(e){ memoryFallbackWorlds = list; }
}
function createWorldRecord(name, seedStr, mode){
  const seed = seedStr ? hashSeed(seedStr) : (Math.random()*0x7FFFFFFF|0);
  const w = {
    id: uuid(),
    name: (name || 'Новый мир').trim().slice(0,40),
    seed, mode: mode || 'survival',
    createdAt: Date.now(), savedAt: Date.now(), data: null,
  };
  const list = getWorlds();
  list.unshift(w); putWorlds(list);
  return w;
}
function serializeWorld(){
  const blockData = blocks.map(m => ({
    x: m.position.x, y: m.position.y, z: m.position.z,
    t: m.userData.typeIdx || 0, r: m.rotation.y || 0,
  }));
  const animalData = animals.filter(a => !a.dead).map(a => ({
    type: a.type, x: a.x, z: a.z, hp: a.hp,
  }));
  const chestData = [];
  for(const [k, cont] of chests){
    if(cont.some(c => c)) chestData.push({key:k, cont});
  }
  return {
    blocks: blockData, animals: animalData, chests: chestData,
    player: {
      x: player.x, y: player.y, z: player.z, yaw, pitch, camDist,
      hp: player.hp, flying: player.flying, hunger,
      spawnX: player.spawnX, spawnY: player.spawnY, spawnZ: player.spawnZ,
    },
    worldTime,
  };
}
function saveCurrentWorld(){
  if(!currentWorldId) return;
  const list = getWorlds();
  const idx = list.findIndex(w => w.id === currentWorldId);
  if(idx < 0) return;
  list[idx].savedAt = Date.now();
  list[idx].data = serializeWorld();
  putWorlds(list);
}
function clearWorldEntities(){
  for(const m of [...blocks]) scene.remove(m);
  blocks.length = 0; blockIndex.clear(); spawning.length = 0;
  chests.clear();
  for(const d of debris) scene.remove(d.mesh);
  debris.length = 0;
  for(const a of animals) scene.remove(a.root);
  animals.length = 0;
  for(const m of mobs) scene.remove(m.root);
  mobs.length = 0;
  for(const p of particles) scene.remove(p.mesh);
  particles.length = 0;
  for(const f of footprints) scene.remove(f.mesh);
  footprints.length = 0;
}
function seedStarterWorld(){
  for(let i=0;i<4;i++){
    for(let j=0;j<=i;j++){
      addBlock(4.5+i, 0.5+j, -3.5, (i%2) ? 2 : 4, true);
    }
  }
  addBlock(2.5, 0.5, 5.5, 6, true);
  addBlock(3.5, 0.5, 6.5, 6, true);
  addBlock(4.5, 1.5, -4.5, 25, true);
  addBlock(4.5, 1.5, -2.5, 27, true);
  spawnAnimal('cow');
  spawnAnimal('pig');
  spawnAnimal('dog');
}
function loadWorld(id){
  const w = getWorlds().find(x => x.id === id);
  if(!w) return false;
  currentWorldId = id;
  gameMode = w.mode || 'survival';
  generateDecor(w.seed);
  clearWorldEntities();
  player.alive = true; player.vy = 0; player.speed = 0;
  player.firstPerson = false; player.flying = false;
  player.crouch = 0; player.crouchTarget = 0; player.crouchToggle = false;
  activeEmote = null;
  player.spawnX = SPAWN_X; player.spawnY = 0; player.spawnZ = SPAWN_Z;
  setCharacterColorWrite(true);
  const d = w.data;
  if(d){
    player.x = (d.player && d.player.x != null) ? d.player.x : SPAWN_X;
    player.y = (d.player && d.player.y != null) ? d.player.y : 0;
    player.z = (d.player && d.player.z != null) ? d.player.z : SPAWN_Z;
    player.hp = (d.player && d.player.hp != null) ? d.player.hp : player.hpMax;
    hunger = (d.player && d.player.hunger != null) ? d.player.hunger : hungerMax;
    player.flying = (d.player && d.player.flying) || false;
    player.spawnX = (d.player && d.player.spawnX != null) ? d.player.spawnX : SPAWN_X;
    player.spawnY = (d.player && d.player.spawnY != null) ? d.player.spawnY : 0;
    player.spawnZ = (d.player && d.player.spawnZ != null) ? d.player.spawnZ : SPAWN_Z;
    yaw = (d.player && d.player.yaw != null) ? d.player.yaw : 0;
    pitch = (d.player && d.player.pitch != null) ? d.player.pitch : -0.22;
    camDist = (d.player && d.player.camDist != null) ? d.player.camDist : settings.camDist;
    worldTime = (d.worldTime != null) ? d.worldTime : 0.22;
    if(Array.isArray(d.blocks)){
      for(const b of d.blocks) addBlock(b.x, b.y, b.z, b.t, true, b.r || 0);
    }
    if(Array.isArray(d.animals)){
      for(const a of d.animals){
        const animal = spawnAnimalAt(a.type, a.x, a.z);
        if(animal && typeof a.hp === 'number') animal.hp = a.hp;
      }
    }
    if(Array.isArray(d.chests)){
      for(const c of d.chests) chests.set(c.key, c.cont);
    }
  } else {
    player.x = SPAWN_X; player.y = 0; player.z = SPAWN_Z;
    player.hp = player.hpMax; hunger = hungerMax;
    yaw = 0; pitch = -0.22;
    worldTime = 0.22;
    seedStarterWorld();
  }
  return true;
}
function deleteWorld(id){ putWorlds(getWorlds().filter(w => w.id !== id)); }

  listEl.innerHTML = '';
  for(const w of list){

    const card = document.createElement('div');
    card.className = 'world-card';
    card.innerHTML = `
      <div class="world-thumb"></div>
      <div class="world-info">
        <div class="world-name">${escapeHTML(w.name)}</div>

    `;

      if(e.target.closest('.world-delete')) return;
      startWorld(w.id);

    });
    listEl.appendChild(card);
  }

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

  closeSettings();
});

/* Тост */
const toastEl = document.getElementById('toast');
let toastTimeout = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 1500);
}

/* Автосохранение */
function tickAutosave(dt){
  if(state !== 'playing' || !currentWorldId) return;
  autosaveAcc += dt;
  if(autosaveAcc >= 20){ autosaveAcc = 0; saveCurrentWorld(); }
}
addEventListener('beforeunload', () => { saveCurrentWorld(); });
document.addEventListener('visibilitychange', () => { if(document.hidden) saveCurrentWorld(); });

/* ═══════════ ДЕНЬ/НОЧЬ ═══════════ */
const DAY_SKY = new THREE.Color(0x9fd8ff);
const NIGHT_SKY = new THREE.Color(0x0a1428);
const DUSK_SKY = new THREE.Color(0xff8844);
const skyColor = new THREE.Color();
const underwaterEl = document.getElementById('underwater');
let smokeTimer = 0;

function updateDayNight(dt){
  worldTime = (worldTime + dt/DAY_LENGTH) % 1;
  const angle = worldTime*Math.PI*2;
  const sinA = Math.sin(angle);
  const sunX = Math.cos(angle)*100;
  const sunY = sinA*100;
  sun.position.set(player.x+sunX, Math.max(0.01, sunY), player.z+40);
  sun.target.position.set(player.x, player.y, player.z);
  sun.target.updateMatrixWorld();
  const dayLight = THREE.MathUtils.smoothstep(sinA, -0.15, 0.35);
  isNight = dayLight < 0.25;
  sun.intensity = dayLight*2.1;
  moonLight.intensity = (1-dayLight)*0.35;
  moonLight.position.set(player.x-sunX, -sunY, player.z+40);
  moonLight.target.position.set(player.x, 0, player.z);
  moonLight.target.updateMatrixWorld();
  hemi.intensity = 0.35 + dayLight*0.85;
  const horizonFactor = 1-Math.abs(sinA);
  if(dayLight > 0.5){
    skyColor.copy(DAY_SKY).lerp(DUSK_SKY, horizonFactor*(1-dayLight)*2);
  } else {
    skyColor.copy(NIGHT_SKY).lerp(DUSK_SKY, (1-dayLight)*2*Math.max(0, sinA+0.3));
  }
  scene.background.copy(skyColor);
  scene.fog.color.copy(skyColor);
  scene.fog.near = 55 - (1-dayLight)*25;
  scene.fog.far = settings.far - (1-dayLight)*70;
  stars.material.opacity = Math.max(0, 1-dayLight*3);
  stars.position.copy(camera.position);
  underwaterEl.style.opacity = player.inWater ? '1' : '0';

  /* Дым от факелов */
  smokeTimer -= dt;
  if(smokeTimer <= 0 && settings.particles){
    smokeTimer = 0.3;
    for(const b of blocks){
      if(b.userData.typeIdx !== TORCH_IDX) continue;
      if(b.position.distanceToSquared(player.root.position) > 400) continue;
      if(Math.random() < 0.5){
        particlesSmoke(new THREE.Vector3(
          b.position.x + (Math.random()-0.5)*0.1,
          b.position.y + 0.4,
          b.position.z + (Math.random()-0.5)*0.1
        ));
      }
    }
  }
}

/* ═══════════ АВТО-КАЧЕСТВО ═══════════ */
const qualityMgr = {
  fpsSamples: [],
  lowStreak: 0, highStreak: 0,
  applied: 'high',
  apply(level){
    if(level === 'low'){
      renderer.shadowMap.enabled = false;
      sun.castShadow = false;
      settings.particles = false;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.0));
    } else if(level === 'high'){
      renderer.shadowMap.enabled = settings.shadows;
      sun.castShadow = settings.shadows;
      renderer.setPixelRatio(pickPixelRatio());
    }
    this.applied = level;
  },
  tick(dt){
    if(!settings.autoQ) return;
    this.fpsSamples.push(dt);
    if(this.fpsSamples.length > 60) this.fpsSamples.shift();
    if(this.fpsSamples.length < 40) return;
    const avg = this.fpsSamples.reduce((a,b)=>a+b,0) / this.fpsSamples.length;
    const fps = 1 / avg;
    if(fps < 26){
      this.lowStreak++; this.highStreak = 0;
      if(this.lowStreak > 4 && this.applied !== 'low'){
        this.apply('low');
        this.lowStreak = 0;
      }
    } else if(fps > 52){
      this.highStreak++; this.lowStreak = 0;
      if(this.highStreak > 8 && this.applied !== 'high'){
        this.apply('high');
        this.highStreak = 0;
      }
    } else {
      this.lowStreak = 0; this.highStreak = 0;
    }
  }
};

/* ═══════════ ПОЗА ═══════════ */
function lerpAngle(a, b, t){
  let d = (b-a) % (Math.PI*2);
  if(d > Math.PI) d -= Math.PI*2;
  if(d < -Math.PI) d += Math.PI*2;
  return a + d*t;
}
function updatePose(dt, speed, grounded){
  const rig = player.rig;
  const rb = Math.min(1, Math.max(0, (speed-WALK_SPEED)/(RUN_SPEED-WALK_SPEED)));
  const targetBlend = Math.min(1, speed/1.1);
  player.blend += (targetBlend-player.blend)*Math.min(1, dt*11);
  const b = player.blend;
  const cr = player.crouch;
  const crouchScale = 1 - cr*0.85;
  if(speed > 0.08 && grounded) player.phase += dt*2.0*speed*(0.55+0.45*crouchScale);
  else if(!grounded) player.phase += dt*2.5;
  const sw = Math.sin(player.phase), cw = Math.cos(player.phase);
  const legAmp = (0.50+0.48*rb)*b*crouchScale;
  const armAmp = (0.36+0.62*rb)*b*(0.4+0.6*crouchScale);
  const kneeAmp = (0.85+1.10*rb)*b*crouchScale;
  const elbowBase = (0.18+0.65*rb)*b;
  rig.legL.hip.rotation.x = -legAmp*cw;
  rig.legR.hip.rotation.x =  legAmp*cw;
  rig.legL.knee.rotation.x = kneeAmp*Math.max(0, -sw)+0.03;
  rig.legR.knee.rotation.x = kneeAmp*Math.max(0,  sw)+0.03;
  rig.armL.shoulder.rotation.x =  armAmp*cw;
  rig.armR.shoulder.rotation.x = -armAmp*cw;
  rig.armL.shoulder.rotation.z = -0.06-elbowBase*0.12;
  rig.armR.shoulder.rotation.z =  0.06+elbowBase*0.12;
  rig.armL.elbow.rotation.x = -elbowBase;
  rig.armR.elbow.rotation.x = -elbowBase;
  const bob = Math.abs(Math.sin(player.phase))*(0.018+0.045*rb)*b;
  rig.hips.position.y = BASE_HIP_Y + bob - 0.022*b;
  rig.hips.rotation.y = -sw*0.10*b;
  rig.torso.rotation.y = sw*0.13*b;
  rig.torso.rotation.x = (0.05+0.16*rb)*b;
  rig.head.rotation.x = -(0.03+0.12*rb)*b;

  if(player.inWater){
    rig.torso.rotation.x = 0.35;
    rig.head.rotation.x = 0.25;
    rig.hips.position.y = BASE_HIP_Y - 0.35;
    const t = clockTime*4;
    rig.armL.shoulder.rotation.x = -0.5 + Math.sin(t)*1.2;
    rig.armR.shoulder.rotation.x = -0.5 + Math.sin(t+Math.PI)*1.2;
    rig.armL.shoulder.rotation.z = -0.35;
    rig.armR.shoulder.rotation.z = 0.35;
    rig.legL.hip.rotation.x = Math.sin(t*1.5)*0.4 - 0.3;
    rig.legR.hip.rotation.x = Math.sin(t*1.5+Math.PI)*0.4 - 0.3;
    rig.legL.knee.rotation.x = 0.5;
    rig.legR.knee.rotation.x = 0.5;
  }
  if(b < 0.06 && grounded && !player.inWater){
    const breath = Math.sin(clockTime*1.6);
    rig.torso.rotation.x = breath*0.020;
    rig.hips.position.y = BASE_HIP_Y + breath*0.006;
    rig.head.rotation.x = breath*0.024;
    rig.armL.shoulder.rotation.x = breath*0.04;
    rig.armR.shoulder.rotation.x = -breath*0.04;
    rig.armL.elbow.rotation.x = -0.16;
    rig.armR.elbow.rotation.x = -0.16;
  }
  if(!grounded && !player.flying && !player.inWater){
    const k = 1 - Math.exp(-dt*15);
    const vy = player.vy;
    let legL, legR, kneeL, kneeR, armLX;
    if(vy > 1.5){ legL = -0.85; legR = 0.35; kneeL = 1.55; kneeR = 0.65; armLX = -2.3; }
    else if(vy > -2){ legL = -0.55; legR = 0.25; kneeL = 0.90; kneeR = 0.45; armLX = -1.5; }
    else { legL = -0.4; legR = 0.55; kneeL = 0.6; kneeR = 0.7; armLX = -0.3; }
    rig.legL.hip.rotation.x = THREE.MathUtils.lerp(rig.legL.hip.rotation.x, legL, k);
    rig.legR.hip.rotation.x = THREE.MathUtils.lerp(rig.legR.hip.rotation.x, legR, k);
    rig.legL.knee.rotation.x = THREE.MathUtils.lerp(rig.legL.knee.rotation.x, kneeL, k);
    rig.legR.knee.rotation.x = THREE.MathUtils.lerp(rig.legR.knee.rotation.x, kneeR, k);
    rig.armL.shoulder.rotation.x = THREE.MathUtils.lerp(rig.armL.shoulder.rotation.x, armLX, k);
    rig.armR.shoulder.rotation.x = THREE.MathUtils.lerp(rig.armR.shoulder.rotation.x, armLX, k);
  }
  if(cr > 0.001){
    rig.hips.position.y -= cr*0.42;
    rig.legL.knee.rotation.x += cr*1.05;
    rig.legR.knee.rotation.x += cr*1.05;
    rig.legL.hip.rotation.x -= cr*0.55;
    rig.legR.hip.rotation.x -= cr*0.55;
    rig.torso.rotation.x += cr*0.42;
    rig.head.rotation.x -= cr*0.30;
  }
  player.swing *= Math.exp(-dt*8.5);
  if(player.swing < 0.002) player.swing = 0;
  const sg = player.swing;
  if(sg > 0){
    rig.armR.shoulder.rotation.x -= sg*2.0;
    rig.armR.elbow.rotation.x -= sg*1.0;
  }
  player.painK *= Math.exp(-dt*8);
  if(player.painK > 0.01){
    const pk = player.painK;
    rig.torso.rotation.x -= pk*0.25;
    rig.head.rotation.x += pk*0.15;
  }
  applyEmote(rig);
}

/* ═══════════ ГЛАВНЫЙ ЦИКЛ ═══════════ */
const clock = new THREE.Clock();

function update(dt){
  clockTime += dt;

  /* Ввод — движение */
  let ix = 0, iz = 0;
  if(state === 'playing' && player.alive){
    if(keys['KeyW'] || keys['ArrowUp']) iz += 1;
    if(keys['KeyS'] || keys['ArrowDown']) iz -= 1;
    if(keys['KeyD'] || keys['ArrowRight']) ix += 1;
    if(keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
    ix += touchState.joyX;
    iz -= touchState.joyY;
  }
  if(activeEmote && (Math.abs(ix) > 0.05 || Math.abs(iz) > 0.05)) activeEmote = null;
  updateEmote(dt);

  /* Спринт — клавиша или полное отклонение джойстика */
  const joyMag = Math.hypot(touchState.joyX, touchState.joyY);
  const running = !!(keys['ShiftLeft'] || keys['ShiftRight']) || joyMag > 0.85;

  const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  const rx = Math.cos(yaw), rz = -Math.sin(yaw);
  let dx = fx*iz+rx*ix, dz = fz*iz+rz*ix;
  const len = Math.hypot(dx,dz);
  if(len > 0.001){ dx /= len; dz /= len; }

  const wasInWater = player.inWater;
  const inWater = isInWater();
  player.inWater = inWater;
  if(inWater && !wasInWater) AUDIO.splash();

  if(player.flying){
    const flyTarget = len > 0.001 ? FLY_SPEED*(running ? 1.6 : 1) : 0;
    const accel = flyTarget > player.speed ? 25 : 30;
    player.speed += Math.sign(flyTarget-player.speed) *
                    Math.min(Math.abs(flyTarget-player.speed), accel*dt);
    if(len > 0.001){
      player.x += dx*player.speed*dt;
      player.z += dz*player.speed*dt;
      const tf = Math.atan2(dx, dz);
      player.facing = lerpAngle(player.facing, tf, Math.min(1, dt*13));
    }
    let vy = 0;
    if(keys['Space'] || jumpRequested) vy += 1;
    if(keys['ShiftLeft'] || keys['ControlLeft']) vy -= 1;
    player.vy = vy*FLY_SPEED;
    player.y += player.vy*dt;
    jumpRequested = false;
  } else {
    const baseSpeed = running ? RUN_SPEED : WALK_SPEED;
    let targetSpeed = len > 0.001 ? baseSpeed : 0;
    if(inWater) targetSpeed *= 0.5;
    const accel = targetSpeed > player.speed ? 22 : 26;
    player.speed += Math.sign(targetSpeed-player.speed) *
                    Math.min(Math.abs(targetSpeed-player.speed), accel*dt);
    if(player.speed < 0.02) player.speed = 0;
    if(len > 0.001 && player.speed > 0 && player.alive){
      player.x += dx*player.speed*dt;
      player.z += dz*player.speed*dt;
      const tf = Math.atan2(dx, dz);
      player.facing = lerpAngle(player.facing, tf, Math.min(1, dt*13));
    }
    player.jumpCooldown = Math.max(0, player.jumpCooldown-dt);
    player.doubleJumpCd = Math.max(0, player.doubleJumpCd-dt);
    const spacePressed = keys['Space'];
    const prevSpace = player._prevSpace;
    const jumpNow = (spacePressed && !prevSpace) || jumpRequested;
    jumpRequested = false;
    if(jumpNow && state === 'playing'){
      if(player.onGround && player.jumpCooldown <= 0){
        if(inWater) player.vy = 3;
        else { player.vy = JUMP_POWER; AUDIO.jump(); }
        player.onGround = false;
        player.jumpCooldown = 0.18;
        activeEmote = null;
      } else if(!player.onGround && !player.doubleJumpUsed && player.doubleJumpCd <= 0){
        player.doubleJumpUsed = true;
        player.glideT = 2.0;
        player.vy = 4;
        player.doubleJumpCd = 6.0;
        AUDIO.jump();
      }
    }
    player._prevSpace = spacePressed;
    if(inWater){
      player.vy -= GRAVITY*0.35*dt;
      player.vy = Math.max(player.vy, -3);
    } else {
      player.vy -= GRAVITY*dt;
    }
    player.y += player.vy*dt;
    if(player.glideT > 0){
      player.glideT -= dt;
      if(player.vy < 0) player.vy = Math.max(player.vy, -2);
    }
  }
  resolveBlockCollisions();
  resolveObstacleCollisions();
  const gh = groundHeightAt(player.x, player.z, player.y);
  player.wasGround = player.onGround;
  if(!player.flying && player.y <= gh){
    if(!player.wasGround && player.vy < -4){
      player.landK = Math.min(1, -player.vy/12);
      if(player.vy < -8){
        particlesDust(new THREE.Vector3(player.x, gh+0.05, player.z));
        AUDIO.land();
      }
      if(player.vy < -16 && gameMode === 'survival')
        damagePlayer(Math.min(50, (-player.vy-16)*4));
    }
    player.y = gh;
    player.vy = 0;
    player.onGround = true;
    player.airTime = 0;
    player.doubleJumpUsed = false;
    player.glideT = 0;
  } else {
    player.onGround = false;
    player.airTime += dt;
  }
  if(gameMode === 'survival'){
    for(const b of blocks){
      if(b.userData.typeIdx !== LAVA_IDX) continue;
      const ddx = player.x-b.position.x;
      const ddy = player.y-b.position.y;
      const ddz = player.z-b.position.z;
      if(Math.abs(ddx) < 0.9 && Math.abs(ddz) < 0.9 && ddy > -1 && ddy < 1){
        damagePlayer(4);
        break;
      }
    }
  }
  if(gameMode === 'survival' && player.alive){
    foodTimer += dt;
    if(foodTimer > 6){
      foodTimer = 0;
      hunger = Math.max(0, hunger - (player.speed > WALK_SPEED ? 1.5 : 0.6));
      if(hunger <= 0){ if(Math.random() < 0.5) damagePlayer(1); }
    }
  }
  const LIMIT = GROUND_SIZE/2-3;
  player.x = Math.max(-LIMIT, Math.min(LIMIT, player.x));
  player.z = Math.max(-LIMIT, Math.min(LIMIT, player.z));
  player.root.position.set(player.x, player.y, player.z);
  player.root.rotation.y = player.facing;
  player.attackCooldown = Math.max(0, player.attackCooldown-dt);
  player.swingT = Math.max(0, player.swingT-dt);
  player.hurtCooldown = Math.max(0, player.hurtCooldown-dt);
  updatePose(dt, player.speed, player.onGround);

  if(player.onGround && player.speed > 0.5){
    stepTimer -= dt*player.speed;
    footTimer -= dt*player.speed;
    if(stepTimer <= 0){
      const under = blockUnderFeet();
      const kind = under ? BLOCK_TYPES[under.userData.typeIdx].sound : 'grass';
      AUDIO.step(kind);
      stepTimer = 1.2;
    }
    if(footTimer <= 0 && !player.inWater){
      const surface = surfaceAt(player.x, player.z);
      if(surface){
        makeFootprint({x:player.x, y:0, z:player.z}, player.facing, surface);
      }
      footTimer = 0.5;
    }
  }
  if(player.inWater && Math.random() < dt*3){
    particlesBubble(new THREE.Vector3(
      player.x+(Math.random()-0.5)*0.6,
      player.y+EYE_HEIGHT+0.2,
      player.z+(Math.random()-0.5)*0.6
    ));
  }
  updateSpawning(dt);
  updateDebris(dt);
  updateParticles(dt);
  updateFootprints(dt);
  updateAnimals(dt);
  updateMobs(dt);
  updateTorchLights(dt);
  updateWeather(dt);
  tickAutosave(dt);
  updateDayNight(dt);

  /* Камера */
  if(player.firstPerson){
    const eyeY = player.y+EYE_HEIGHT - player.crouch*0.42;
    camera.position.set(player.x, eyeY, player.z);
    const cp = Math.cos(pitch);
    const dir = new THREE.Vector3(-Math.sin(yaw)*cp, Math.sin(pitch), -Math.cos(yaw)*cp);
    camera.lookAt(camera.position.x+dir.x, camera.position.y+dir.y, camera.position.z+dir.z);
  } else {
    const camTarget = new THREE.Vector3(player.x, player.y+1.42 - player.crouch*0.42, player.z);
    const cp = Math.cos(pitch);
    const offX = Math.sin(yaw)*cp*camDist;
    const offY = -Math.sin(pitch)*camDist;
    const offZ = Math.cos(yaw)*cp*camDist;
    const desired = new THREE.Vector3(
      camTarget.x+offX, camTarget.y+offY+0.35, camTarget.z+offZ);
    desired.y = Math.max(desired.y, 0.55);
    const dirToCam = desired.clone().sub(camTarget);
    const distToCam = dirToCam.length();
    if(distToCam > 0.001){
      dirToCam.divideScalar(distToCam);
      raycaster.set(camTarget, dirToCam);
      raycaster.far = distToCam;
      const camHits = raycaster.intersectObjects([ground, ...blocks], true);
      const camHit = camHits.find(h => h.object.isMesh && h.face);
      if(camHit){
        const safeDist = Math.max(0.35, camHit.distance-0.25);
        desired.copy(camTarget).addScaledVector(dirToCam, safeDist);
      }
    }
    camera.position.lerp(desired, 1-Math.exp(-dt*20));
    camera.lookAt(camTarget);
  }
}

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  qualityMgr.tick(dt);
  if(state === 'playing' || state === 'paused' || state === 'inventory' ||
     state === 'chest' || state === 'dead'){
    try{ update(dt); }catch(e){ console.error('Update:', e); }
  } else {
    clockTime += dt;
    camera.position.set(Math.sin(clockTime*0.05)*10, 5, Math.cos(clockTime*0.05)*10);
    camera.lookAt(0, 1.4, 0);
    try{ updateDayNight(dt*0.3); }catch(e){}
  }
  try{ renderer.render(scene, camera); }catch(e){ console.error('Render:', e); }
}

/* ═══════════ ИНИЦИАЛИЗАЦИЯ ═══════════ */
try{
  generateDecor(123456);
  setState('menu');
  loop();
}catch(e){
  console.error('Init error:', e);
  document.body.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#fff;background:#1a1a1a">'+
    '<h2>Ошибка запуска</h2><pre style="background:#333;padding:14px;'+
    'border-radius:8px;overflow:auto;white-space:pre-wrap">'+
    String(e.message+'\n'+e.stack).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+
    '</pre></div>';
}
