<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Voicefriend</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #1e1f22;
    --bg-2: #2b2d31;
    --bg-3: #313338;
    --bg-hover: #383a40;
    --border: #1a1b1e;
    --text: #f2f3f5;
    --text-2: #b5bac1;
    --text-3: #80848e;
    --blurple: #5865f2;
    --blurple-hover: #4752c4;
    --green: #23a559;
    --green-glow: rgba(35, 165, 89, 0.4);
    --red: #f23f43;
    --red-hover: #da373c;
    --yellow: #f0b232;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  #app { height: 100vh; height: 100dvh; position: relative; overflow: hidden; }

  /* ============ ЭКРАНЫ ============ */
  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }
  .screen.active {
    display: flex;
    animation: screenIn 0.4s var(--ease);
  }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ HEADER ============ */
  .screen-header {
    padding: 20px 20px 12px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    flex-shrink: 0;
    position: relative;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .logo-mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--blurple) 0%, #7c85ff 100%);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 900;
    font-size: 24px;
    letter-spacing: -1px;
    position: relative;
    overflow: hidden;
    animation: logoBreathe 4s ease-in-out infinite;
  }
  .logo-mark::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: shine 4s ease-in-out infinite;
  }
  @keyframes logoBreathe {
    0%, 100% { box-shadow: 0 8px 32px rgba(88, 101, 242, 0.3); }
    50%      { box-shadow: 0 8px 44px rgba(88, 101, 242, 0.55); }
  }
  @keyframes shine {
    0%, 60% { transform: translateX(-100%); }
    100%    { transform: translateX(100%); }
  }

  /* ============ ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА ============ */
  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 3px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 100px;
    height: 38px;
    position: relative;
  }

  .lang-btn {
    padding: 0 12px;
    height: 32px;
    background: transparent;
    border: none;
    color: var(--text-3);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 100px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.3s, transform 0.15s;
    -webkit-user-select: none;
    user-select: none;
    position: relative;
    z-index: 1;
  }

  .lang-btn.active {
    color: #fff;
  }

  .lang-btn:active {
    transform: scale(0.94);
  }

  .lang-btn .flag {
    font-size: 14px;
    line-height: 1;
  }

  .lang-pill {
    position: absolute;
    top: 3px;
    height: 32px;
    background: var(--blurple);
    border-radius: 100px;
    transition: all 0.4s var(--ease-back);
    z-index: 0;
    pointer-events: none;
  }

  .screen-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.7px;
    margin-bottom: 6px;
  }
  .screen-subtitle {
    font-size: 14px;
    color: var(--text-3);
    line-height: 1.4;
  }

  /* ============ SCROLL ============ */
  .screen-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 16px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  /* ============ LIST ITEM ============ */
  .list-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--bg-2);
    border-radius: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
    border: 1px solid transparent;
    -webkit-user-select: none;
    user-select: none;
    opacity: 0;
    transform: translateY(12px);
    animation: listItemIn 0.4s var(--ease) forwards;
  }

  @keyframes listItemIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .list-item:active {
    transform: scale(0.98);
    background: var(--bg-hover);
  }

  .list-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg);
    display: grid;
    place-items: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .list-icon.hashtag {
    background: rgba(88, 101, 242, 0.15);
    color: var(--blurple);
    font-size: 20px;
    font-weight: 700;
  }

  .list-info { flex: 1; min-width: 0; }
  .list-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .list-subtitle {
    font-size: 12.5px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .online-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
    display: inline-block;
  }
  .online-dot.empty { background: var(--text-3); }

  .list-arrow {
    color: var(--text-3);
    flex-shrink: 0;
  }

  /* ============ BACK BTN ============ */
  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--bg-3);
    border: none;
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.15s;
    margin-bottom: 14px;
  }
  .back-btn:active {
    transform: scale(0.9);
    background: var(--bg-hover);
  }
  .back-btn svg { width: 18px; height: 18px; }

  /* ============================================================
     ГОЛОСОВОЙ ЭКРАН — DISCORD STYLE
  ============================================================ */
  .voice-screen {
    background: radial-gradient(ellipse at top, #2b2d31 0%, #1e1f22 60%);
  }

  .voice-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: rgba(30, 31, 34, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .voice-header .back-btn {
    width: 36px;
    height: 36px;
    margin-bottom: 0;
  }

  .voice-header-info { flex: 1; min-width: 0; }
  .voice-header-title {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .voice-header-title .hash {
    color: var(--text-3);
    font-weight: 800;
  }
  .voice-header-sub {
    font-size: 12px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
    font-weight: 600;
  }
  .voice-header-sub.connecting { color: var(--yellow); }
  .voice-header-sub.error { color: var(--red); }

  /* ============ LIVE BADGE ============ */
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: rgba(35, 165, 89, 0.15);
    border: 1px solid rgba(35, 165, 89, 0.35);
    border-radius: 100px;
    font-size: 10px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .live-badge::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
    animation: liveBlink 1.5s ease-in-out infinite;
  }
  @keyframes liveBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.7); }
  }

  /* ============ VOICE BODY ============ */
  .voice-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 20px;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }

  .participants-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-3);
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .participants-count {
    background: var(--bg-3);
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10px;
    color: var(--text-2);
    letter-spacing: 0;
  }

  /* ============ PARTICIPANT — DISCORD STYLE ============ */
  .participant {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: rgba(43, 45, 49, 0.7);
    border-radius: 14px;
    margin-bottom: 8px;
    transition: all 0.25s var(--ease);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.03);
    opacity: 0;
    transform: translateX(-12px);
    animation: participantIn 0.45s var(--ease) forwards;
  }
  @keyframes participantIn {
    to { opacity: 1; transform: translateX(0); }
  }

  .participant.me {
    border-color: rgba(88, 101, 242, 0.4);
    background: rgba(88, 101, 242, 0.12);
  }

  .participant.speaking {
    background: rgba(35, 165, 89, 0.12);
    border-color: rgba(35, 165, 89, 0.4);
    animation: speakingGlow 1.2s ease-in-out infinite;
  }
  @keyframes speakingGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(35, 165, 89, 0.2); }
    50%      { box-shadow: 0 0 0 6px rgba(35, 165, 89, 0); }
  }

  .participant-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--blurple) 0%, #7c85ff 100%);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
    position: relative;
  }

  /* Кольцо вокруг говорящего */
  .participant.speaking .participant-avatar::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2.5px solid var(--green);
    animation: speakingRing 1.2s ease-out infinite;
  }
  @keyframes speakingRing {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  /* Второе кольцо — с задержкой */
  .participant.speaking .participant-avatar::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--green);
    animation: speakingRing 1.2s ease-out infinite 0.4s;
  }

  .participant-avatar.muted::after {
    content: '';
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--red);
    border: 2.5px solid var(--bg-2);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'><line x1='1' y1='1' x2='23' y2='23'/></svg>");
    background-size: 9px 9px;
    background-position: center;
    background-repeat: no-repeat;
    animation: muteAppear 0.3s var(--ease-back);
  }
  @keyframes muteAppear {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }

  .participant-name {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .participant-you {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    background: var(--blurple);
    color: #fff;
    border-radius: 100px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  /* ============ ЗВУКОВАЯ ВОЛНА (у говорящего) ============ */
  .sound-wave {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 16px;
    margin-left: 6px;
    flex-shrink: 0;
  }
  .sound-wave span {
    width: 2.5px;
    background: var(--green);
    border-radius: 2px;
    height: 4px;
  }
  .participant.speaking .sound-wave span {
    animation: wave 0.7s ease-in-out infinite;
  }
  .participant.speaking .sound-wave span:nth-child(1) { animation-delay: 0s;    height: 8px; }
  .participant.speaking .sound-wave span:nth-child(2) { animation-delay: 0.15s; height: 14px; }
  .participant.speaking .sound-wave span:nth-child(3) { animation-delay: 0.3s;  height: 10px; }
  .participant.speaking .sound-wave span:nth-child(4) { animation-delay: 0.45s; height: 12px; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }

  /* ============ EMPTY STATE ============ */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-3);
    font-size: 13.5px;
    line-height: 1.6;
  }
  .empty-state .icon {
    font-size: 48px;
    opacity: 0.4;
    margin-bottom: 12px;
    display: block;
    animation: iconFloat 3s ease-in-out infinite;
  }
  @keyframes iconFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  /* ============ ВОЛНЫ В ЦЕНТРЕ ============ */
  .voice-center-visual {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-bottom: 20px;
    opacity: 0.6;
  }
  .voice-center-visual .bar {
    width: 3px;
    background: linear-gradient(180deg, var(--blurple), var(--green));
    border-radius: 2px;
    animation: centerWave 1.4s ease-in-out infinite;
  }
  @keyframes centerWave {
    0%, 100% { height: 8px; opacity: 0.4; }
    50%      { height: 40px; opacity: 1; }
  }

  /* ============ VOICE CONTROLS — DISCORD STYLE ============ */
  .voice-controls {
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 40%, rgba(30, 31, 34, 0.6));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .control-btn {
    flex: 1;
    height: 54px;
    border-radius: 16px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s, background 0.25s, color 0.25s;
    -webkit-user-select: none;
    user-select: none;
    position: relative;
    overflow: hidden;
  }
  .control-btn:active:not(:disabled) { transform: scale(0.96); }
  .control-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .control-btn svg { width: 20px; height: 20px; flex-shrink: 0; transition: transform 0.3s var(--ease-back); }

  .control-btn.mute {
    background: var(--bg-3);
    color: var(--text);
    flex: 0 0 60px;
  }
  .control-btn.mute:active svg { transform: rotate(-8deg); }
  .control-btn.mute.active {
    background: var(--red);
    color: #fff;
    animation: mutePulse 1.5s ease-in-out infinite;
  }
  @keyframes mutePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(242, 63, 67, 0.3); }
    50%      { box-shadow: 0 0 0 8px rgba(242, 63, 67, 0); }
  }

  .control-btn.leave {
    background: var(--red);
    color: #fff;
    flex: 1;
  }
  .control-btn.leave:active {
    background: var(--red-hover);
  }

  .control-btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    transform: translate(-50%, -50%) scale(0);
    animation: ripple 0.65s ease-out;
    pointer-events: none;
  }
  @keyframes ripple {
    to { transform: translate(-50%, -50%) scale(20); opacity: 0; }
  }

  /* ============ MIC METER ============ */
  .mic-meter {
    height: 4px;
    background: var(--bg-3);
    border-radius: 3px;
    margin-top: 16px;
    overflow: hidden;
    position: relative;
  }
  .mic-meter-bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--blurple), var(--green));
    transition: width 0.06s linear;
    border-radius: 3px;
  }
  .mic-meter-label {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 8px;
    text-align: center;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  /* ============ LOADER ============ */
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid rgba(88, 101, 242, 0.2);
    border-top-color: var(--blurple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: none;
    justify-content: center;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    pointer-events: none;
    z-index: 9999;
  }
  .toast.show { display: flex; }
  .toast-inner {
    background: var(--bg-3);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    border: 1px solid var(--border);
    max-width: 90%;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    animation: toastIn 0.35s var(--ease-back);
    text-align: center;
  }
  .toast.error .toast-inner {
    background: #4a1618;
    border-color: #6b1f22;
    color: #ffb3b5;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-24px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ============ CONNECTION BANNER ============ */
  .banner {
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    background: var(--yellow);
    color: #000;
    display: none;
    animation: bannerIn 0.3s var(--ease);
  }
  .banner.show { display: block; }
  .banner.error { background: var(--red); color: #fff; }
  @keyframes bannerIn {
    from { transform: translateY(-100%); }
    to { transform: translateY(0); }
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 380px) {
    .screen-header { padding: 16px 16px 10px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
    .screen-title { font-size: 22px; }
    .logo-mark { width: 48px; height: 48px; font-size: 21px; }
    .voice-controls { padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    .control-btn { height: 50px; font-size: 13px; }
    .lang-switch { height: 34px; }
    .lang-btn { height: 28px; font-size: 11.5px; padding: 0 10px; }
    .lang-pill { height: 28px; }
    .voice-center-visual { height: 60px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div id="app">

  <!-- ============================================================
       ЭКРАН 1: РЕГИОНЫ
  ============================================================ -->
  <div class="screen active" id="screen-region">
    <div class="screen-header">
      <div class="header-top">
        <div class="logo-mark">V</div>
        <div class="lang-switch" id="langSwitch">
          <div class="lang-pill" id="langPill"></div>

<script>
/* ============================================================
   VOICEFRIEND — Discord-подобный голосовой чат
   RU / ENG · PeerJS · Анимации
============================================================ */

// ============================================================
//  ПЕРЕВОДЫ
// ============================================================
const I18N = {
  ru: {

    connected: 'Connected',

    reconnected: 'Reconnected',
    leave: 'Leave',
    you: 'You',
    guest: 'Guest',
    online: 'Online',
    joinRoom: 'Join room',
    noOneYet: 'No one here yet',
    callFriends: 'Invite friends to this room',
    askMic: 'Requesting microphone access...',

    connFailed: 'Connection error',
    hostLeft: 'Host left, reconnecting...',
    reconnFailed: 'Reconnect failed',
    joined: 'joined',

    room: 'room',

    participant: 'participant',
    participantsFew: 'participants',
    participantsMany: 'participants',
    regions: {
      eu: 'Europe',

      asia: 'Asia',
      us: 'America',

    },
    roomNames: {
      'Общий': 'General',
      'Музыка': 'Music',
      'Игры': 'Games',
      'Чилл': 'Chill',
      'Мемы': 'Memes',
      'Аниме': 'Anime',
    },
  },
};

let currentLang = 'ru';
try { currentLang = localStorage.getItem('vf_lang') || 'ru'; } catch (e) {}

function t(key) {
  return I18N[currentLang][key] || I18N.ru[key] || key;
}

function tRoom(name) {
  return I18N[currentLang].roomNames[name] || name;
}

function tRegion(id) {
  return I18N[currentLang].regions[id] || id;
}

// ============================================================
//  КОНФИГУРАЦИЯ
// ============================================================
const CONFIG = {
  ID_PREFIX: 'voicefriend-v2',
  ICE: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
    ],
  },
  REGIONS: [
    { id: 'eu',    flag: '🇪🇺', rooms: ['Общий', 'Музыка', 'Игры'] },
    { id: 'ru',    flag: '🇷🇺', rooms: ['Общий', 'Чилл', 'Мемы'] },
    { id: 'asia',  flag: '🌏', rooms: ['Общий', 'Аниме', 'Игры'] },
    { id: 'us',    flag: '🇺🇸', rooms: ['Общий', 'Музыка', 'Чилл'] },
    { id: 'other', flag: '🌐', rooms: ['Общий'] },
  ],
};

// ============================================================
//  TELEGRAM
// ============================================================
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try {
    if (tg.setHeaderColor) tg.setHeaderColor('#1e1f22');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#1e1f22');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
}

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
const state = {
  userId: null,
  userName: 'Гость',
  userInitial: 'Г',
  region: null,
  room: null,
  peer: null,
  isHost: false,
  hostConn: null,
  localStream: null,
  muted: false,
  peers: {},
  calls: {},
  participants: {},
  userPeerIds: {},
  audioContext: null,
  analyser: null,
  meterRAF: null,
  speakingChecks: {},
};

(function initUser() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const u = tg.initDataUnsafe.user;
    state.userId = 'tg' + u.id;
    state.userName = ((u.first_name || 'Гость') + (u.last_name ? ' ' + u.last_name : '')).trim();
  } else {
    let saved = null;
    try { saved = localStorage.getItem('vf_userId'); } catch (e) {}
    state.userId = saved || ('guest' + Math.random().toString(36).slice(2, 8));
    try { localStorage.setItem('vf_userId', state.userId); } catch (e) {}
    state.userName = 'Гость';
  }
  state.userInitial = (state.userName.charAt(0) || '?').toUpperCase();
})();

// ============================================================
//  UI ELEMENTS
// ============================================================
const screens = {
  region: document.getElementById('screen-region'),
  rooms:  document.getElementById('screen-rooms'),
  voice:  document.getElementById('screen-voice'),
};

const el = {
  regionList:       document.getElementById('regionList'),
  roomList:         document.getElementById('roomList'),
  regionTitle:      document.getElementById('regionTitle'),
  voiceRoomTitle:   document.getElementById('voiceRoomTitle'),
  voiceRoomSub:     document.getElementById('voiceRoomSub'),
  participantsList: document.getElementById('participantsList'),
  participantsCount:document.getElementById('participantsCount'),
  micBar:           document.getElementById('micBar'),
  muteBtn:          document.getElementById('muteBtn'),
  leaveBtn:         document.getElementById('leaveBtn'),
  leaveHeader:      document.getElementById('leaveHeader'),
  backToRegions:    document.getElementById('backToRegions'),
  toast:            document.getElementById('toast'),
  toastText:        document.getElementById('toastText'),
  banner:           document.getElementById('banner'),
  centerVisual:     document.getElementById('centerVisual'),
  langSwitch:       document.getElementById('langSwitch'),
  langPill:         document.getElementById('langPill'),
};

// ============================================================
//  UI HELPERS
// ============================================================
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

function showBanner(text, isError) {
  el.banner.textContent = text;
  el.banner.className = 'banner show' + (isError ? ' error' : '');
}
function hideBanner() {
  el.banner.className = 'banner';
}

let toastTimer = null;
function showToast(msg, isError) {
  clearTimeout(toastTimer);
  el.toastText.textContent = msg;
  el.toast.className = 'toast show' + (isError ? ' error' : '');
  toastTimer = setTimeout(() => {
    el.toast.className = 'toast' + (isError ? ' error' : '');
  }, 3000);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function plural(n, one, few, many) {
  const mod = n % 10;
  if (n % 100 >= 11 && n % 100 <= 19) return many;
  if (mod === 1) return one;
  if (mod >= 2 && mod <= 4) return few;
  return many;
}

// ============================================================
//  ЯЗЫК
// ============================================================
function updateLangPill() {
  const activeBtn = el.langSwitch.querySelector('.lang-btn.active');
  if (!activeBtn || !el.langPill) return;
  const btnRect = activeBtn.getBoundingClientRect();
  const parentRect = el.langSwitch.getBoundingClientRect();
  const offsetLeft = btnRect.left - parentRect.left;
  el.langPill.style.left = offsetLeft + 'px';
  el.langPill.style.width = btnRect.width + 'px';
}

function setLang(lang) {
  currentLang = lang;
  try { localStorage.setItem('vf_lang', lang); } catch (e) {}

  // Активация кнопки
  el.langSwitch.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  setTimeout(updateLangPill, 10);

  // Обновляем все data-i18n
  document.querySelectorAll('[data-i18n]').forEach(node => {
    const key = node.getAttribute('data-i18n');
    node.textContent = t(key);
  });

  document.documentElement.lang = lang;

  // Перерисовываем текущий контент
  if (state.region) {
    el.regionTitle.textContent = tRegion(state.region.id) + ' ' + state.region.flag;
  }
  renderRegions();
  if (state.region) renderRooms();
  if (state.room) {
    el.voiceRoomTitle.textContent = tRoom(state.room);
  }

  // Уведомляем остальных об изменении языка (не критично)
  updateParticipantsUI();

  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.selectionChanged(); } catch (e) {}
  }
}

el.langSwitch.addEventListener('click', (e) => {
  const btn = e.target.closest('.lang-btn');
  if (!btn) return;
  setLang(btn.dataset.lang);
});

// ============================================================
//  ВИЗУАЛЬНЫЕ ВОЛНЫ В ЦЕНТРЕ
// ============================================================
function buildCenterVisual() {
  el.centerVisual.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.animationDelay = (i * 0.07) + 's';
    bar.style.animationDuration = (1.2 + Math.random() * 0.6) + 's';
    el.centerVisual.appendChild(bar);
  }
}

// ============================================================
//  ЭКРАН 1: РЕГИОНЫ
// ============================================================
function renderRegions() {
  el.regionList.innerHTML = '';

  CONFIG.REGIONS.forEach((r, i) => {
    const item = document.createElement('div');
    item.className = 'list-item';
    item.style.animationDelay = (i * 0.05) + 's';
    item.innerHTML =
      '<div class="list-icon">' + r.flag + '</div>' +
      '<div class="list-info">' +
        '<div class="list-title">' + escapeHtml(tRegion(r.id)) + '</div>' +
        '<div class="list-subtitle">' +
          '<span class="online-dot"></span>' +
          '<span>' + r.rooms.length + ' ' + plural(r.rooms.length, t('room'), t('rooms'), t('roomsMany')) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="list-arrow">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">' +
          '<path d="M9 18l6-6-6-6"/>' +
        '</svg>' +
      '</div>';
    item.addEventListener('click', () => selectRegion(r));
    el.regionList.appendChild(item);
  });
}

function selectRegion(r) {
  state.region = r;
  el.regionTitle.textContent = tRegion(r.id) + ' ' + r.flag;
  renderRooms();
  showScreen('rooms');
}

// ============================================================
//  ЭКРАН 2: КОМНАТЫ
// ============================================================
function renderRooms() {
  el.roomList.innerHTML = '';

  state.region.rooms.forEach((roomName, i) => {
    const item = document.createElement('div');
    item.className = 'list-item';
    item.style.animationDelay = (i * 0.05) + 's';
    item.innerHTML =
      '<div class="list-icon hashtag">#</div>' +
      '<div class="list-info">' +
        '<div class="list-title">' + escapeHtml(tRoom(roomName)) + '</div>' +
        '<div class="list-subtitle">' +
          '<span class="online-dot"></span>' +
          '<span>' + t('joinRoom') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="list-arrow">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">' +
          '<path d="M9 18l6-6-6-6"/>' +
        '</svg>' +
      '</div>';
    item.addEventListener('click', () => joinRoom(roomName));
    el.roomList.appendChild(item);
  });
}

// ============================================================
//  ID КОМНАТЫ
// ============================================================
function makeRoomId(regionId, roomName) {
  const safe = roomName.toLowerCase().replace(/[^a-z0-9]/gi, '');
  return CONFIG.ID_PREFIX + '-' + regionId + '-' + safe;
}

// ============================================================
//  ВХОД В КОМНАТУ
// ============================================================
async function joinRoom(roomName) {
  state.room = roomName;
  el.voiceRoomTitle.textContent = tRoom(roomName);
  setVoiceStatus('connecting', t('connecting'));

  showScreen('voice');
  buildCenterVisual();
  showBanner(t('askMic'));

  try {
    state.localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false,
    });
  } catch (err) {
    console.error('Mic error:', err);
    showBanner(t('noMic'), true);
    showToast(t('allowMic'), true);
    setTimeout(leaveRoom, 2000);
    return;
  }

  showBanner(t('connectingServer'));
  setupMicMeter();

  try {
    await initPeer();
  } catch (err) {
    console.error('Peer error:', err);
    showBanner(t('connError'), true);
    showToast(t('connFailed'), true);
    setTimeout(leaveRoom, 2000);
    return;
  }

  hideBanner();
  updateParticipantsUI();

  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  }
}

// ============================================================
//  PEERJS
// ============================================================
function initPeer() {
  return new Promise((resolve, reject) => {
    const roomId = makeRoomId(state.region.id, state.room);
    const hostPeerId = roomId;
    const myPeerId = roomId + '-u-' + state.userId + '-' + Math.random().toString(36).slice(2, 6);

    const peer = new Peer(myPeerId, { config: CONFIG.ICE, debug: 1 });
    state.peer = peer;

    const timeout = setTimeout(() => {
      if (!peer.open) reject(new Error('Peer timeout'));
    }, 8000);

    peer.on('open', (id) => {
      clearTimeout(timeout);

      const conn = peer.connect(hostPeerId, {
        metadata: { userId: state.userId, name: state.userName, role: 'guest' },
        reliable: true,
      });

      let hostConnected = false;

      conn.on('open', () => {
        hostConnected = true;
        state.isHost = false;
        state.hostConn = conn;
        setVoiceStatus('online', t('connected'));

        conn.send({ type: 'hello', userId: state.userId, name: state.userName });
        resolve();
      });

      conn.on('data', (data) => handleHostMessage(data));

      conn.on('close', () => {
        if (!state.isHost && state.hostConn === conn) {
          showToast(t('hostLeft'), true);
          state.hostConn = null;
          setTimeout(() => { if (state.room) attemptReconnect(); }, 1500);
        }
      });

      conn.on('error', (err) => console.warn('Host conn error:', err));

      setTimeout(() => {
        if (!hostConnected) {
          try { conn.close(); } catch (e) {}
          peer.destroy();
          becomeHost(roomId).then(resolve).catch(reject);
        }
      }, 3000);
    });

    peer.on('error', (err) => console.warn('Peer error:', err.type, err.message));

    peer.on('connection', (conn) => {
      if (!state.isHost) return;
      handleGuestConnection(conn);
    });

    peer.on('call', (call) => handleIncomingCall(call));
  });
}

// ============================================================
//  СТАТЬ ХОСТОМ
// ============================================================
function becomeHost(hostId) {
  return new Promise((resolve, reject) => {
    const peer = new Peer(hostId, { config: CONFIG.ICE, debug: 1 });
    state.peer = peer;

    const timeout = setTimeout(() => reject(new Error('Host timeout')), 8000);

    peer.on('open', (id) => {
      clearTimeout(timeout);
      state.isHost = true;
      setVoiceStatus('online', t('connectedHost'));
      resolve();
    });

    peer.on('error', (err) => { clearTimeout(timeout); reject(err); });

    peer.on('connection', (conn) => handleGuestConnection(conn));
    peer.on('call', (call) => handleIncomingCall(call));
  });
}

// ============================================================
//  ГОСТИ (ХОСТ)
// ============================================================
function handleGuestConnection(conn) {
  let guestId = null;

  conn.on('data', (data) => {
    if (data.type === 'hello') {
      guestId = data.userId;
      state.participants[guestId] = { name: data.name || t('guest'), muted: false, conn: conn };
      state.userPeerIds[guestId] = conn.peer;

      const list = Object.keys(state.participants)
        .filter(id => id !== guestId)
        .map(id => ({ userId: id, name: state.participants[id].name }));

      conn.send({
        type: 'peers',
        peers: list,
        hostId: state.userId,
        hostName: state.userName,
      });

      Object.keys(state.participants).forEach(id => {
        if (id === guestId) return;
        const p = state.participants[id];
        if (p.conn && p.conn.open) {
          try { p.conn.send({ type: 'join', userId: guestId, name: data.name }); } catch (e) {}
        }
      });

      callUser(guestId);
      updateParticipantsUI();
      showToast(data.name + ' ' + t('joined'));
    }
  });

  conn.on('close', () => {
    if (guestId) {
      removeParticipant(guestId);
      Object.keys(state.participants).forEach(id => {
        const p = state.participants[id];
        if (p.conn && p.conn.open) {
          try { p.conn.send({ type: 'leave', userId: guestId }); } catch (e) {}
        }
      });
    }
  });
}

// ============================================================
//  СООБЩЕНИЯ ОТ ХОСТА (ГОСТЬ)
// ============================================================
function handleHostMessage(data) {
  if (data.type === 'peers') {
    state.participants[data.hostId] = { name: data.hostName || 'Host', muted: false };
    state.userPeerIds[data.hostId] = makeRoomId(state.region.id, state.room);

    data.peers.forEach(p => {
      state.participants[p.userId] = { name: p.name, muted: false };
    });

    updateParticipantsUI();
    callUser(data.hostId);
    data.peers.forEach(p => callUser(p.userId));
  }

  if (data.type === 'join') {
    state.participants[data.userId] = { name: data.name, muted: false };
    updateParticipantsUI();
    showToast(data.name + ' ' + t('joined'));
  }

  if (data.type === 'leave') removeParticipant(data.userId);

  if (data.type === 'mute') {
    if (state.participants[data.userId]) {
      state.participants[data.userId].muted = data.muted;
      updateParticipantsUI();
    }
  }
}

// ============================================================
//  ЗВОНОК
// ============================================================
function callUser(targetUserId) {
  if (!state.peer || !state.localStream) return;
  if (state.calls[targetUserId]) return;

  const targetPeerId = state.userPeerIds[targetUserId];
  if (!targetPeerId) {
    if (state.isHost) {
      const p = state.participants[targetUserId];
      if (p && p.conn) {
        try {
          const call = state.peer.call(p.conn.peer, state.localStream, {
            metadata: { userId: state.userId, name: state.userName },
          });
          setupCall(call, targetUserId);
        } catch (e) { console.error('Call error:', e); }
      }
    }
    return;
  }

  try {
    const call = state.peer.call(targetPeerId, state.localStream, {
      metadata: { userId: state.userId, name: state.userName },
    });
    setupCall(call, targetUserId);
  } catch (e) { console.error('Call error:', e); }
}

// ============================================================
//  ВХОДЯЩИЙ ЗВОНОК
// ============================================================
function handleIncomingCall(call) {
  const peerId = call.peer;
  const meta = call.metadata || {};
  const userId = meta.userId || peerId;

  state.userPeerIds[userId] = peerId;

  if (!state.participants[userId]) {
    state.participants[userId] = { name: meta.name || t('guest'), muted: false };
    updateParticipantsUI();
  }

  try {
    call.answer(state.localStream);
    setupCall(call, userId);
  } catch (e) { console.error('Answer error:', e); }
}

function setupCall(call, userId) {
  state.calls[userId] = call;

  call.on('stream', (remoteStream) => playRemoteAudio(userId, remoteStream));
  call.on('close', () => removeParticipant(userId));
  call.on('error', (err) => console.warn('Call error for', userId, err));
}

// ============================================================
//  ВОСПРОИЗВЕДЕНИЕ
// ============================================================
function playRemoteAudio(userId, stream) {
  let audioEl = document.getElementById('audio-' + userId);
  if (!audioEl) {
    audioEl = document.createElement('audio');
    audioEl.id = 'audio-' + userId;
    audioEl.autoplay = true;
    audioEl.playsInline = true;
    audioEl.style.display = 'none';
    document.body.appendChild(audioEl);
  }
  audioEl.srcObject = stream;
  startSpeakingDetection(userId, stream);
}

// ============================================================
//  ОБНАРУЖЕНИЕ РЕЧИ
// ============================================================
function startSpeakingDetection(userId, stream) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser();
    an.fftSize = 256;
    src.connect(an);

    const data = new Uint8Array(an.frequencyBinCount);

    const check = () => {
      if (!state.participants[userId]) {
        try { ctx.close(); } catch (e) {}
        return;
      }
      an.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length;

      const pEl = document.getElementById('peer-' + userId);
      if (pEl) {
        if (avg > 12) pEl.classList.add('speaking');
        else pEl.classList.remove('speaking');
      }

      state.speakingChecks[userId] = requestAnimationFrame(check);
    };
    check();
  } catch (e) { console.warn('Speaking detection error:', e); }
}

// ============================================================
//  УДАЛЕНИЕ УЧАСТНИКА
// ============================================================
function removeParticipant(userId) {
  if (state.calls[userId]) {
    try { state.calls[userId].close(); } catch (e) {}
    delete state.calls[userId];
  }

  const audioEl = document.getElementById('audio-' + userId);
  if (audioEl) { audioEl.srcObject = null; audioEl.remove(); }

  if (state.speakingChecks[userId]) {
    cancelAnimationFrame(state.speakingChecks[userId]);
    delete state.speakingChecks[userId];
  }

  if (state.participants[userId]) {
    const name = state.participants[userId].name;
    delete state.participants[userId];
    showToast(name + ' ' + t('left'));
  }

  updateParticipantsUI();
}

// ============================================================
//  UI УЧАСТНИКОВ
// ============================================================
function updateParticipantsUI() {
  const ids = Object.keys(state.participants);
  const total = ids.length + 1;

  el.participantsCount.textContent = total;

  el.participantsList.innerHTML = '';

  // Мы
  const meEl = document.createElement('div');
  meEl.className = 'participant me';
  meEl.id = 'peer-me';
  meEl.innerHTML =
    '<div class="participant-avatar ' + (state.muted ? 'muted' : '') + '">' +
      escapeHtml(state.userInitial) +
    '</div>' +
    '<div class="participant-name">' + escapeHtml(state.userName) + '</div>' +
    '<div class="participant-you">' + t('you') + '</div>';
  el.participantsList.appendChild(meEl);

  // Остальные
  ids.forEach((id, i) => {
    const p = state.participants[id];
    const initial = (p.name || '?').charAt(0).toUpperCase();

    const item = document.createElement('div');
    item.className = 'participant';
    item.id = 'peer-' + id;
    item.style.animationDelay = (i * 0.05) + 's';
    item.innerHTML =
      '<div class="participant-avatar ' + (p.muted ? 'muted' : '') + '">' +
        escapeHtml(initial) +
      '</div>' +
      '<div class="participant-name">' + escapeHtml(p.name || t('guest')) + '</div>' +
      '<div class="sound-wave">' +
        '<span></span><span></span><span></span><span></span>' +
      '</div>';
    el.participantsList.appendChild(item);
  });
}

function setVoiceStatus(kind, text) {
  el.voiceRoomSub.className = 'voice-header-sub';
  if (kind === 'connecting') el.voiceRoomSub.classList.add('connecting');
  if (kind === 'error') el.voiceRoomSub.classList.add('error');
  el.voiceRoomSub.innerHTML = '<span class="online-dot"></span><span>' + escapeHtml(text) + '</span>';
}

// ============================================================
//  MIC METER
// ============================================================
function setupMicMeter() {
  try {
    state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const src = state.audioContext.createMediaStreamSource(state.localStream);
    state.analyser = state.audioContext.createAnalyser();
    state.analyser.fftSize = 256;
    src.connect(state.analyser);

    const data = new Uint8Array(state.analyser.frequencyBinCount);

    const tick = () => {
      if (!state.analyser) return;
      state.analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length;

      let percent = Math.min(100, avg * 1.8);
      if (state.muted) percent = 0;

      el.micBar.style.width = percent + '%';
      state.meterRAF = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { console.warn('Mic meter error:', e); }
}

// ============================================================
//  MUTE
// ============================================================
el.muteBtn.addEventListener('click', (e) => {
  addRipple(e, el.muteBtn);

  state.muted = !state.muted;
  if (state.localStream) {
    state.localStream.getAudioTracks().forEach(t => { t.enabled = !state.muted; });
  }
  el.muteBtn.classList.toggle('active', state.muted);

  const msg = { type: 'mute', userId: state.userId, muted: state.muted };
  if (state.isHost) {
    Object.keys(state.participants).forEach(id => {
      const p = state.participants[id];
      if (p.conn && p.conn.open) { try { p.conn.send(msg); } catch (e) {} }
    });
  } else if (state.hostConn && state.hostConn.open) {
    try { state.hostConn.send(msg); } catch (e) {}
  }

  const meAvatar = document.querySelector('#peer-me .participant-avatar');
  if (meAvatar) meAvatar.classList.toggle('muted', state.muted);

  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  }
});

// ============================================================
//  RIPPLE
// ============================================================
function addRipple(e, btn) {
  const rect = btn.getBoundingClientRect();
  const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
  const y = (e.clientY || rect.top + rect.height / 2) - rect.top;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 700);
}

// ============================================================
//  ПЕРЕПОДКЛЮЧЕНИЕ
// ============================================================
function attemptReconnect() {
  if (!state.room) return;

  Object.keys(state.calls).forEach(id => { try { state.calls[id].close(); } catch (e) {} });
  state.calls = {};
  state.participants = {};

  if (state.peer) { try { state.peer.destroy(); } catch (e) {} state.peer = null; }
  state.hostConn = null;
  state.isHost = false;

  initPeer().then(() => {
    updateParticipantsUI();
    setVoiceStatus('online', t('reconnected'));
  }).catch(err => {
    console.error('Reconnect failed:', err);
    showBanner(t('reconnFailed'), true);
  });
}

// ============================================================
//  ВЫХОД
// ============================================================
function leaveRoom() {
  Object.keys(state.calls).forEach(id => { try { state.calls[id].close(); } catch (e) {} });
  state.calls = {};

  if (state.hostConn) { try { state.hostConn.close(); } catch (e) {} state.hostConn = null; }

  Object.keys(state.participants).forEach(id => {
    const p = state.participants[id];
    if (p.conn) { try { p.conn.close(); } catch (e) {} }
  });
  state.participants = {};

  if (state.meterRAF) { cancelAnimationFrame(state.meterRAF); state.meterRAF = null; }
  Object.keys(state.speakingChecks).forEach(id => cancelAnimationFrame(state.speakingChecks[id]));
  state.speakingChecks = {};

  document.querySelectorAll('audio[id^="audio-"]').forEach(a => {
    a.srcObject = null; a.remove();
  });

  if (state.audioContext) { try { state.audioContext.close(); } catch (e) {} state.audioContext = null; }
  state.analyser = null;

  if (state.peer) { try { state.peer.destroy(); } catch (e) {} state.peer = null; }

  if (state.localStream) {
    state.localStream.getTracks().forEach(t => t.stop());
    state.localStream = null;
  }

  state.room = null;
  state.muted = false;
  el.muteBtn.classList.remove('active');
  el.micBar.style.width = '0';

  hideBanner();
  showScreen('rooms');

  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  }
}

// ============================================================
//  КНОПКИ
// ============================================================
el.leaveBtn.addEventListener('click', (e) => { addRipple(e, el.leaveBtn); setTimeout(leaveRoom, 120); });
el.leaveHeader.addEventListener('click', leaveRoom);

el.backToRegions.addEventListener('click', () => {
  showScreen('region');
});

// ============================================================
//  PREVENT DOUBLE TAP ZOOM
// ============================================================
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// ============================================================
//  СТАРТ
// ============================================================
// Установить язык из настроек
setLang(currentLang);

// Пересчёт pill при resize
window.addEventListener('resize', () => setTimeout(updateLangPill, 100));
setTimeout(updateLangPill, 300);

console.log('Voicefriend v2 loaded · User:', state.userId, state.userName, '· Lang:', currentLang);
</script>
