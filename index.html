<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Voicefriend</title>
<!-- Подключаем LiveKit Client SDK -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ... Стили остаются почти без изменений, чтобы не загромождать ответ. 
     Скопируй их из предыдущего сообщения (v4). Единственное, что можно убрать — 
     анимацию "voice-center-visual", так как в LiveKit визуализация встроена. 
     Я оставил её для красоты. ... */
</style>
</head>
<body>

<!-- ... Вся HTML-разметка (экраны, кнопки) остаётся как в v4 ... -->

<script>
/* ============================================================
   VOICEFRIEND v5 — на LiveKit (стабильный вариант)
============================================================ */

/* ============================================================
   🔑 ВСТАВЬ СЮДА СВОИ ДАННЫЕ ИЗ LIVEOIT CLOUD
============================================================ */
const LIVEKIT_URL = 'wss://ТВОЙ-ПРОЕКТ.livekit.cloud'; 
const LIVEKIT_TOKEN_SERVER_ID = 'ТВОЙ_TOKEN_SERVER_ID';
/* ============================================================ */


/* --- Остальные настройки (языки, регионы) --- */
const I18N = {
  ru: {
    title: 'Voicefriend', chooseRegion: 'Выбери регион, чтобы начать общение',
    chooseRoom: 'Выбери голосовую комнату', participants: 'Участники',
    yourMic: 'Твой микрофон', connecting: 'Подключение...',
    connected: 'Подключено', waiting: 'Ожидаем других',
    leave: 'Выйти', you: 'Вы', guest: 'Гость',
    joinRoom: 'Войти в комнату', noOneYet: 'Пока никого нет',
    askMic: 'Запрос доступа к микрофону...',
    noMic: 'Нет доступа к микрофону', allowMic: 'Разреши доступ к микрофону',
    connError: 'Не удалось подключиться', connFailed: 'Ошибка соединения',
    joined: 'присоединился', left: 'отключился',
    room: 'комната', rooms: 'комнаты', roomsMany: 'комнат',
    participant: 'участник', participantsFew: 'участника', participantsMany: 'участников',
    regions: { eu: 'Европа', ru: 'Россия', asia: 'Азия', us: 'Америка', other: 'Другое' },
    roomNames: { 'Общий': 'Общий', 'Музыка': 'Музыка', 'Игры': 'Игры', 'Чилл': 'Чилл', 'Мемы': 'Мемы', 'Аниме': 'Аниме' },
  },
  en: { /* ... английский перевод ... */ },
};

let currentLang = 'ru';
try { currentLang = localStorage.getItem('vf_lang') || 'ru'; } catch (e) {}

function t(key) { return I18N[currentLang][key] || I18N.ru[key] || key; }
function tRoom(name) { return I18N[currentLang].roomNames[name] || name; }
function tRegion(id) { return I18N[currentLang].regions[id] || id; }

const CONFIG = {
  REGIONS: [
    { id: 'eu',    flag: '🇪🇺', rooms: ['Общий', 'Музыка', 'Игры'] },
    { id: 'ru',    flag: '🇷🇺', rooms: ['Общий', 'Чилл', 'Мемы'] },
    { id: 'asia',  flag: '🌏', rooms: ['Общий', 'Аниме', 'Игры'] },
    { id: 'us',    flag: '🇺🇸', rooms: ['Общий', 'Музыка', 'Чилл'] },
    { id: 'other', flag: '🌐', rooms: ['Общий'] },
  ],
};

/* --- Telegram --- */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try {
    if (tg.setHeaderColor) tg.setHeaderColor('#0b0f1a');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#0b0f1a');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  } catch (e) {}
}

/* --- Состояние --- */
const state = {
  userId: null, userName: 'Гость', userInitial: 'Г',
  region: null, room: null,
  roomInstance: null, // LiveKit Room
  localStream: null, // LiveKit будет управлять сам, но оставим для getUserMedia
  isMuted: false,
  participants: {}, // id -> { name, isMuted }
  audioElements: {}, // id -> HTMLAudioElement
};

(function initUser() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const u = tg.initDataUnsafe.user;
    state.userId = 'tg' + u.id;
    state.userName = ((u.first_name || 'Гость') + (u.last_name ? ' ' + u.last_name : '')).trim();
  } else {
    let saved = null;
    try { saved = localStorage.getItem('vf_userId'); } catch (e) {}
    state.userId = saved || ('guest' + Math.random().toString(36).slice(2, 8));
    try { localStorage.setItem('vf_userId', state.userId); } catch (e) {}
    state.userName = 'Гость';
  }
  state.userInitial = (state.userName.charAt(0) || '?').toUpperCase();
})();

/* --- Элементы UI (как в v4) --- */
const el = { /* ... */ };
/* ... */


/* ============================================================
   🚀 ЗАПУСК ГОЛОСОВОГО ЧАТА (LIVEKIT)
============================================================ */

async function joinRoom(roomName) {
  state.room = roomName;
  el.voiceRoomTitle.textContent = tRoom(roomName);
  setVoiceStatus('connecting', t('searching'));
  showScreen('voice');
  buildCenterVisual();
  showBanner(t('askMic'));

  try {
    // 1. Получаем токен от Token Server LiveKit
    const response = await fetch(`https://cloud-api.livekit.io/api/v2/sandbox/connection-details`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        room_name: `vf-${state.region.id}-${roomName}`,
        participant_identity: state.userId,
        participant_name: state.userName,
        sandbox_id: LIVEKIT_TOKEN_SERVER_ID
      })
    });

    if (!response.ok) throw new Error('Не удалось получить токен');
    const { token, server_url } = await response.json();

    // 2. Создаём комнату LiveKit
    const room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true,
    });
    state.roomInstance = room;

    // 3. Обработчики событий LiveKit
    room.on(LivekitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, handleTrackUnsubscribed);
    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, handleActiveSpeakerChange);
    room.on(LivekitClient.RoomEvent.ParticipantConnected, handleParticipantConnected);
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, handleParticipantDisconnected);
    room.on(LivekitClient.RoomEvent.Disconnected, handleDisconnect);
    room.on(LivekitClient.RoomEvent.LocalTrackPublished, handleLocalTrackPublished);

    // 4. Подключаемся
    await room.connect(server_url, token);
    console.log('✅ Connected to LiveKit room');

    // 5. Включаем микрофон
    await room.localParticipant.setMicrophoneEnabled(true);

    hideBanner();
    updateParticipantsUI();
    updateVoiceStatus();

    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} }

  } catch (err) {
    console.error('❌ LiveKit connection error:', err);
    showBanner(t('connError'), true);
    showToast(t('connFailed'), true);
    state.status = 'error';
    updateVoiceStatus();
  }
}


/* ============================================================
   ОБРАБОТЧИКИ СОБЫТИЙ LIVEKIT
============================================================ */

function handleTrackSubscribed(track, publication, participant) {
  if (track.kind === 'audio') {
    const audioEl = track.attach();
    audioEl.id = `audio-${participant.identity}`;
    audioEl.autoplay = true;
    audioEl.playsInline = true;
    audioEl.style.display = 'none';
    document.body.appendChild(audioEl);
    state.audioElements[participant.identity] = audioEl;

    state.participants[participant.identity] = {
      name: participant.name || t('guest'),
      isMuted: !participant.isMicrophoneEnabled,
    };
    updateParticipantsUI();
    updateVoiceStatus();
  }
}

function handleTrackUnsubscribed(track, publication, participant) {
  track.detach();
  const audioEl = state.audioElements[participant.identity];
  if (audioEl) {
    audioEl.remove();
    delete state.audioElements[participant.identity];
  }
}

function handleActiveSpeakerChange(speakers) {
  document.querySelectorAll('.participant').forEach(el => el.classList.remove('speaking'));
  speakers.forEach(speaker => {
    const el = document.getElementById(`peer-${speaker.identity}`);
    if (el) el.classList.add('speaking');
  });
}

function handleParticipantConnected(participant) {
  state.participants[participant.identity] = {
    name: participant.name || t('guest'),
    isMuted: !participant.isMicrophoneEnabled,
  };
  updateParticipantsUI();
  updateVoiceStatus();
  showToast(participant.name + ' ' + t('joined'));
}

function handleParticipantDisconnected(participant) {
  if (state.participants[participant.identity]) {
    const name = state.participants[participant.identity].name;
    delete state.participants[participant.identity];
    showToast(name + ' ' + t('left'));
  }
  updateParticipantsUI();
  updateVoiceStatus();
}

function handleDisconnect() {
  console.log('Disconnected from LiveKit room');
  showToast(t('hostLeft'), true);
  leaveRoom();
}

function handleLocalTrackPublished(publication) {
  if (publication.kind === 'audio') {
    // Микрофон включен
  }
}


/* ============================================================
   УПРАВЛЕНИЕ МИКРОФОНОМ (MUTE)
============================================================ */

el.muteBtn.addEventListener('click', async (e) => {
  addRipple(e, el.muteBtn);
  if (!state.roomInstance) return;

  state.isMuted = !state.isMuted;
  await state.roomInstance.localParticipant.setMicrophoneEnabled(!state.isMuted);
  el.muteBtn.classList.toggle('active', state.isMuted);

  // Обновляем свой аватар
  const meAvatar = document.querySelector('#peer-me .participant-avatar');
  if (meAvatar) meAvatar.classList.toggle('muted', state.isMuted);

  // Отправляем данные всем (опционально)
  const data = new TextEncoder().encode(JSON.stringify({ type: 'mute', isMuted: state.isMuted }));
  await state.roomInstance.localParticipant.publishData(data, { reliable: true });

  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
});


/* ============================================================
   ВЫХОД ИЗ КОМНАТЫ
============================================================ */

function leaveRoom() {
  if (state.roomInstance) {
    state.roomInstance.disconnect();
    state.roomInstance = null;
  }

  // Удаляем все аудио-элементы
  Object.values(state.audioElements).forEach(a => a.remove());
  state.audioElements = {};
  state.participants = {};

  state.room = null;
  state.isMuted = false;
  el.muteBtn.classList.remove('active');
  el.micBar.style.width = '0';

  hideBanner();
  showScreen('rooms');
  updateParticipantsUI();

  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
}


/* ============================================================
   ОСТАЛЬНЫЕ ФУНКЦИИ (UI, язык, рендеринг) — как в v4
============================================================ */

/* ... */

// Запуск
setLang(currentLang);
setTimeout(updateLangPill, 300);
</script>
</body>
</html>
