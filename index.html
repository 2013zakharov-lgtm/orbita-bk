<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Orbita AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--accent:#2563eb;--accent-dark:#1d4ed8;--accent-deep:#1e40af;--accent-light:#dbeafe;--accent-soft:#eff6ff;--accent-mid:#93c5fd;--ink:#0f172a;--ink-soft:#334155;--bg:#ffffff;--surface:#f8fafc;--border:#e2e8f0;--muted:#64748b;--danger:#ef4444;--danger-soft:#fef2f2;--white:#ffffff;--overlay:rgba(15,23,42,.45)}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
  body{position:fixed;inset:0}
  body.locked{overflow:hidden}
  .app{height:100%;display:flex;flex-direction:column;background:var(--bg)}

  .header{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
  .icon-btn:active{background:var(--accent-soft)}
  .icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .header-brand{flex:1;display:flex;align-items:center;gap:8px;min-width:0;justify-content:center}
  .brand-mark{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand-mark svg{width:24px;height:24px}
  .brand-text{display:flex;flex-direction:column;min-width:0}
  .brand-name{font-size:15px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
  .brand-sub{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px}

  .chat{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:22px;scroll-behavior:smooth;justify-content:flex-end}
  .chat::-webkit-scrollbar{width:0}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px;text-align:center;width:100%}
  .empty-planet{width:100px;height:100px;margin-bottom:20px;animation:floatY 5s ease-in-out infinite}
  @keyframes floatY{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  .empty-title{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:8px}
  .empty-sub{font-size:14px;color:var(--muted);line-height:1.5;max-width:300px;margin-bottom:24px}
  .empty-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px}
  .empty-chip{padding:9px 14px;background:var(--white);border:1.5px solid var(--accent);border-radius:100px;font-size:13px;font-weight:600;color:var(--accent-deep);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
  .empty-chip:active{background:var(--accent-soft);transform:scale(.97)}
  .empty-chip .dot{width:6px;height:6px;background:var(--accent);border-radius:50%}

  .msg{display:flex;gap:10px;max-width:100%;animation:msgIn .3s cubic-bezier(.22,1,.36,1)}
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{justify-content:flex-end;flex-direction:column;align-items:flex-end}
  .msg.ai .avatar{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .msg.ai .avatar svg{width:20px;height:20px}
  .msg.ai .body{flex:1;min-width:0}
  .msg.ai .name{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:5px}
  .msg.ai .name::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
  .msg.ai .text{font-size:15px;line-height:1.58;color:var(--ink-soft);word-wrap:break-word}
  .msg.ai .text strong{font-weight:700;color:var(--ink)}
  .msg.ai .text a{color:var(--accent);text-decoration:underline}
  .msg.ai .source{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 11px;background:var(--accent-soft);border:1px solid var(--accent-light);border-radius:8px;font-size:12px;font-weight:600;color:var(--accent-deep);text-decoration:none}
  .msg.user .bubble{max-width:82%;padding:10px 14px;background:var(--white);color:var(--accent-deep);border:1.5px solid var(--accent);border-radius:20px;border-bottom-right-radius:6px;font-size:15px;line-height:1.45;word-wrap:break-word;font-weight:500}
  .msg-edit-btn{font-size:11.5px;color:var(--muted);background:none;border:none;cursor:pointer;margin-top:4px;margin-right:4px;font-family:inherit;padding:3px 8px;border-radius:6px}
  .msg-edit-btn:active{background:var(--accent-soft);color:var(--accent)}

  .msg-actions{display:flex;gap:4px;margin-top:8px;margin-left:-4px;flex-wrap:wrap}
  .msg-act{width:30px;height:30px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
  .msg-act:active{background:var(--accent-soft);color:var(--accent)}
  .msg-act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .msg-act.active-up{color:var(--accent);background:var(--accent-soft)}
  .msg-act.active-down{color:var(--danger);background:var(--danger-soft)}

  .typing{display:none;gap:10px}
  .typing.active{display:flex}
  .typing .avatar{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
  .typing .avatar svg{width:20px;height:20px;animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .typing .dots{display:flex;gap:4px;align-items:center;height:30px;padding-top:6px}
  .typing .dots span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dotWave 1.5s infinite}
  .typing .dots span:nth-child(2){animation-delay:.18s}
  .typing .dots span:nth-child(3){animation-delay:.36s}
  @keyframes dotWave{0%,60%,100%{transform:translateY(0) scale(.85);opacity:.4}30%{transform:translateY(-5px) scale(1);opacity:1}}
  .cursor{display:inline-block;width:2px;height:15px;background:var(--accent);vertical-align:text-bottom;margin-left:1px;animation:blink 1s steps(2,start) infinite}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

  .bottom-bar{display:flex;align-items:center;gap:8px;padding:6px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg);flex-shrink:0}
  .menu-fab{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 4px 14px rgba(37,99,235,.28)}
  .menu-fab:active{background:var(--accent-dark);transform:scale(.93)}
  .menu-fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
  .input-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:2px;background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:3px 3px 3px 14px}
  .input-wrap:focus-within{border-color:var(--accent)}
  .input-wrap.cooldown{border-color:var(--accent-mid);background:var(--accent-soft)}
  .input-wrap input{flex:1;min-width:0;padding:7px 0;border:none;outline:none;font-size:14.5px;background:transparent;color:var(--ink);font-family:inherit}
  .input-wrap input::placeholder{color:var(--muted)}
  .send-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative}
  .send-btn:active:not(:disabled){background:var(--accent-dark);transform:scale(.9)}
  .send-btn:disabled{opacity:.35}
  .send-btn svg{width:15px;height:15px;fill:#fff}
  .send-btn.stop{background:var(--danger)}
  .send-btn.cooldown{background:var(--accent-mid)}
  .send-btn.cooldown svg{display:none}
  .send-btn .cooldown-text{display:none;font-size:11px;font-weight:800;color:#fff}
  .send-btn.cooldown .cooldown-text{display:block}

  .gate{position:fixed;inset:0;background:var(--bg);z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
  .gate.hidden{display:none}
  .gate-icon{width:110px;height:110px;margin-bottom:24px;animation:floatY 5s ease-in-out infinite}
  .gate-title{font-size:23px;font-weight:800;color:var(--ink);margin-bottom:10px}
  .gate-sub{font-size:14.5px;color:var(--muted);line-height:1.55;max-width:320px;margin-bottom:24px}
  .gate-btn{width:100%;max-width:320px;padding:16px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
  .gate-btn:active{background:var(--accent-dark);transform:scale(.98)}
  .gate-btn:disabled{opacity:.5}
  .gate-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .gate-id{font-size:12px;color:var(--muted);margin-top:12px}
  .gate-waiting{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--surface);border-radius:100px;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:12px}
  .gate-waiting .spin{width:18px;height:18px;border:2.5px solid var(--accent-light);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

  .overlay{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:88%;max-width:360px;background:var(--bg);z-index:50;transform:translateX(-100%);transition:transform .28s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .drawer-logo{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
  .drawer-logo svg{width:24px;height:24px}
  .drawer-head-text{flex:1;min-width:0}
  .drawer-head-title{font-size:15px;font-weight:800;color:var(--ink)}
  .drawer-head-sub{font-size:11px;color:var(--muted);margin-top:1px}
  .drawer-new{margin:12px 12px 4px;padding:12px 14px;background:var(--accent);border:none;border-radius:12px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit}
  .drawer-new:active{background:var(--accent-dark)}
  .drawer-new svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round}
  .drawer-section{padding:12px 16px 6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center}
  .clear-all-btn{background:none;border:none;font-size:11px;font-weight:700;color:var(--danger);cursor:pointer;text-transform:uppercase;font-family:inherit;padding:2px 6px;border-radius:6px}
  .drawer-chats{flex:1;overflow-y:auto;padding:4px 8px 8px}
  .drawer-chats::-webkit-scrollbar{width:0}
  .chat-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;background:var(--bg);margin-bottom:2px}
  .chat-item.active{background:var(--accent-soft)}
  .chat-item:active{background:var(--surface)}
  .chat-item-icon{width:32px;height:32px;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .chat-item.active .chat-item-icon{background:var(--accent-light)}
  .chat-item-icon svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2}
  .chat-item-text{flex:1;min-width:0}
  .chat-item-title{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-item-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-item-del{width:26px;height:26px;border-radius:7px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.5}
  .chat-item-del svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
  .chat-item-del:active{background:var(--danger-soft)}
  .chat-item-del:active svg{stroke:var(--danger)}
  .drawer-foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
  .user-card{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer}
  .user-card:active{background:var(--surface)}
  .user-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
  .user-info{flex:1;min-width:0}
  .user-name{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-sub{font-size:11px;color:var(--muted);margin-top:1px}

  .modal-overlay{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .modal-overlay.open{opacity:1;pointer-events:auto}
  .modal{width:100%;max-width:480px;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s;max-height:88vh;overflow-y:auto}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal-title{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:4px}
  .modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px}
  .field{margin-bottom:14px}
  .field-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:6px;padding-left:2px}
  .field-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;color:var(--ink);background:var(--bg);outline:none}
  .field-input:focus{border-color:var(--accent)}
  .btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:8px}
  .btn-primary:active{background:var(--accent-dark)}
  .btn-ghost{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:8px}
  .btn-ghost:active{background:var(--surface)}
  .btn-danger{width:100%;padding:14px;border:1.5px solid var(--danger-soft);border-radius:12px;background:var(--bg);color:var(--danger);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
  .btn-danger:active{background:var(--danger-soft)}

  .admin-section{padding:14px 16px;border-bottom:1px solid var(--border)}
  .admin-section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .admin-user{display:flex;align-items:center;gap:10px;padding:11px;background:var(--surface);border-radius:12px;margin-bottom:8px}
  .admin-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
  .admin-info{flex:1;min-width:0}
  .admin-name{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .admin-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .admin-actions{display:flex;gap:6px;flex-shrink:0}
  .admin-btn{padding:8px 12px;border-radius:9px;border:none;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .admin-btn.approve{background:var(--accent);color:#fff}
  .admin-btn.ban{background:var(--danger-soft);color:var(--danger)}
  .admin-btn.unban{background:var(--accent-soft);color:var(--accent)}
  .admin-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}

  .toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;background:var(--accent);color:#fff;border-radius:100px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="gate" id="gate">
  <svg class="gate-icon" viewBox="0 0 100 100" fill="none">
    <circle cx="50" cy="50" r="42" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8" opacity="0.35"/>
    <ellipse cx="50" cy="50" rx="34" ry="10" transform="rotate(-20 50 50)" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="18" fill="#2563eb"/>
    <rect x="42" y="46" width="16" height="14" rx="3" fill="#fff"/>
    <path d="M45 46V43a5 5 0 0110 0v3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="gate-title" id="gateTitle">Проверка доступа…</div>
  <div class="gate-sub" id="gateSub">Пожалуйста, подождите.</div>
  <button class="gate-btn" id="gateAction" style="display:none;">
    <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    <span id="gateActionText">Отправить заявку</span>
  </button>
  <div class="gate-id" id="gateId"></div>
</div>

<div class="overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-logo"><svg viewBox="0 0 64 64" fill="none"><ellipse cx="32" cy="32" rx="26" ry="8" transform="rotate(-20 32 32)" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/><circle cx="32" cy="32" r="13" fill="#2563eb"/></svg></div>
    <div class="drawer-head-text">
      <div class="drawer-head-title">Orbita AI</div>
      <div class="drawer-head-sub">История чатов</div>
    </div>
  </div>
  <button class="drawer-new" id="newChatBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Новый чат</button>
  <div class="drawer-section"><span>Недавние</span><button class="clear-all-btn" id="clearAllChatsBtn" style="display:none;">Очистить</button></div>
  <div class="drawer-chats" id="chatsList"></div>
  <div class="drawer-foot">
    <div class="user-card" id="userCard">
      <div class="user-avatar" id="drawerAvatar">A</div>
      <div class="user-info"><div class="user-name" id="drawerName">...</div><div class="user-sub">Аккаунт · Настройки</div></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>
</aside>

<div class="modal-overlay" id="accountOverlay">
  <div class="modal">
    <div class="modal-title">Аккаунт</div>
    <div class="modal-sub">Твой профиль в Orbita AI</div>
    <div class="field"><div class="field-label">Имя</div><input type="text" class="field-input" id="accountNameInput" maxlength="24"></div>
    <button class="btn-primary" id="saveProfileBtn">Сохранить</button>
    <button class="btn-ghost" id="exportBtn">Экспорт чатов</button>
    <button class="btn-ghost" id="closeAccountBtn">Закрыть</button>
    <button class="btn-danger" id="clearDataBtn">Очистить все данные</button>
  </div>
</div>

<div class="modal-overlay" id="adminOverlay">
  <div class="modal">
    <div class="modal-title">Панель админа</div>
    <div class="modal-sub">Управление доступом</div>
    <div class="admin-section"><div class="admin-section-title">Заявки</div><div id="adminPending"></div></div>
    <div class="admin-section"><div class="admin-section-title">Одобренные</div><div id="adminApproved"></div></div>
    <div class="admin-section" style="border-bottom:none;"><div class="admin-section-title">Забаненные</div><div id="adminBanned"></div></div>
    <button class="btn-ghost" id="closeAdminBtn" style="margin-top:12px;">Закрыть</button>
  </div>
</div>

<div class="app">
  <header class="header">
    <div class="header-brand">

async function checkAccess() {

function normalizeAggressive(raw) {
  let s = String(raw).toLowerCase();
  try { s = s.normalize('NFKD'); } catch(e) {}
  s = s.replace(/[\u0300-\u036f]/g, '');
  s = s.replace(/[\u200B-\u200F\u2028-\u202F\u205F-\u206F\uFEFF\u00AD]/g, '');
  const hg = {'a':'а','e':'е','o':'о','c':'с','p':'р','x':'х','y':'у','k':'к','m':'м','t':'т','h':'н','b':'в','u':'и','n':'п','r':'г','g':'д','q':'й','i':'і','l':'і'};
  s = s.replace(/[a-z]/g, ch => hg[ch] || ch);
  s = s.replace(/0/g,'о').replace(/1/g,'и').replace(/3/g,'е').replace(/4/g,'а').replace(/5/g,'с').replace(/6/g,'б').replace(/7/g,'т').replace(/8/g,'в').replace(/9/g,'д');
  s = s.replace(/[@]/g,'а').replace(/[$]/g,'с').replace(/[!]/g,'и').replace(/[+]/g,'т');
  s = s.replace(/[^а-яёіa-z]/g, '');
  s = s.replace(/(.)\1{2,}/g, '$1');
  return s;
}

function hasProfanity(raw) {
  if (!raw || typeof raw !== 'string' || raw.length === 0) return false;
  const lower = raw.toLowerCase();
  for (const re of BAD_PATTERNS) if (re.test(lower)) return true;
  const norm = normalizeAggressive(raw);
  if (norm) for (const re of BAD_PATTERNS) if (re.test(norm)) return true;
  const tokens = raw.toLowerCase().split(/[^а-яёіa-z0-9]+/i).filter(Boolean);
  for (const tk of tokens) {
    const ntk = normalizeAggressive(tk);
    if (!ntk || WHITELIST.has(ntk)) continue;
    if (BAD_EXACT.has(ntk)) return true;
  }
  return false;
}

/* ============================================================
   MARKDOWN
   ============================================================ */
function renderText(raw) {
  let h = esc(raw);
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

function createChat() {
  const chat = { id: uid(), title: 'Новый чат', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  state.chats.unshift(chat);
  state.activeId = chat.id;
  store.saveChats(state.chats);
  store.setActive(chat.id);
  renderChatsList();
  renderActiveChat();
  return chat;
}
function getActiveChat() { return state.chats.find(c => c.id === state.activeId); }
function switchChat(id) {
  if (state.busy) return;
  state.activeId = id;
  store.setActive(id);
  renderChatsList();
  renderActiveChat();
  closeDrawer();
}
async function deleteChat(id) {
  if (state.busy) return;
  const chat = state.chats.find(c => c.id === id);
  if (!chat) return;
  const ok = tg?.showConfirm
    ? await new Promise(r => tg.showConfirm(`Удалить «${chat.title}»?`, res => r(res)))
    : confirm(`Удалить «${chat.title}»?`);
  if (!ok) return;
  state.chats = state.chats.filter(c => c.id !== id);
  store.saveChats(state.chats);
  if (state.activeId === id) {
    state.activeId = state.chats[0]?.id || null;
    if (!state.activeId) createChat();
    else store.setActive(state.activeId);
  }
  renderChatsList();
  renderActiveChat();
  showToast('Чат удалён');
  haptic('success');
}
function ensureChat() {
  if (!state.activeId || !getActiveChat()) {
    if (state.chats.length > 0) { state.activeId = state.chats[0].id; store.setActive(state.activeId); }
    else createChat();
  }
}
function autoTitle(chat, text) {
  if (chat.title && chat.title !== 'Новый чат') return;
  let t = text.trim().replace(/\s+/g, ' ');
  t = t.replace(/^(расскажи|скажи|что такое|кто такой|найди|поищи)\s+/i, '');
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (t.length > 40) t = t.slice(0,40) + '…';
  chat.title = t || 'Новый чат';
}

function renderChatsList() {

  $('clearAllChatsBtn').style.display = state.chats.length > 1 ? 'block' : 'none';
  const sorted = [...state.chats].sort((a,b) => b.updatedAt - a.updatedAt);

    item.innerHTML = `

function editUserMessage(idx) {
  const chat = getActiveChat();

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); showToast('Скопировано'); haptic('success'); }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('Скопировано'); } catch(_) {}
    document.body.removeChild(ta);
  }
}
function shareText(text) {
  try {
    if (tg?.switchInlineQuery) { tg.switchInlineQuery(text, ['users','groups']); return; }
    const url = `https://t.me/share/url?url=https://t.me&text=${encodeURIComponent(text)}`;
    tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, '_blank');
  } catch(e) {}
}

async function regenerate(idx) {
  if (state.busy) return;
  const chat = getActiveChat();
  if (!chat || idx < 0) return;
  let userIdx = -1;
  for (let i = idx - 1; i >= 0; i--) if (chat.messages[i].role === 'user') { userIdx = i; break; }
  if (userIdx < 0) return;
  const wait = checkLimit();
  if (wait > 0) { showToast(`Подожди ${Math.ceil(wait/1000)} сек…`); return; }
  const q = chat.messages[userIdx].text;
  chat.messages = chat.messages.slice(0, userIdx);
  store.saveChats(state.chats);
  renderActiveChat();
  await handleSend(q);
}

async function typeText(el, text) {
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.after(cursor);
  const delay = Math.min(1800, Math.max(400, text.length * 12)) / text.length;
  let buf = '';
  for (let i = 0; i < text.length; i++) {
    if (state.abortRequested) { el.innerHTML = renderText(text); cursor.remove(); return; }
    buf += text[i];
    el.innerHTML = renderText(buf);
    if (i % 5 === 0) scrollDown();
    await sleep(delay);
  }
  cursor.remove();
  scrollDown();
}

function cleanQuery(q) {
  return q.replace(/^(что такое|что значит|кто такой|кто такая|кто такие|расскажи про|расскажи о|расскажи|поясни|объясни|найди|поищи|где находится|где|когда|почему|зачем|как|what is|who is)\s+/i, '')
    .replace(/^про\s+/i, '').replace(/[?!.]+$/g, '').trim();
}

async function wikiSearch(query, lang = 'ru') {
  const q = query.trim(); if (!q) return null;
  try {
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*&srlimit=1`;
    const res = await fetch(url); if (!res.ok) return null;
    const data = await res.json();
    const hit = data?.query?.search?.[0]; if (!hit) return null;
    const sres = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(hit.title)}`);
    if (!sres.ok) return null;
    const sd = await sres.json();
    const ex = sd.extract; if (!ex || ex.length < 30) return null;
    let short = ex;
    const sents = ex.split(/(?<=[.!?])\s+/);
    if (sents.length > 4) short = sents.slice(0, 4).join(' ');
    if (short.length > 700) short = short.slice(0, 700).replace(/\s+\S*$/, '') + '...';
    return { text: short, source: { title: sd.title, url: sd.content_urls?.mobile?.page || sd.content_urls?.desktop?.page || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(sd.title)}` } };
  } catch(e) { return null; }
}

async function ddgSearch(query) {
  try {
    const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_redirect=1&no_html=1`);
    if (!res.ok) return null;
    const d = await res.json();
    if (d.AbstractText && d.AbstractText.length > 40) return { text: d.AbstractText, source: d.AbstractURL ? { title: d.AbstractSource || 'DDG', url: d.AbstractURL } : null };
    if (d.Answer) return { text: `**${d.Answer}**` };
    return null;
  } catch(e) { return null; }
}

async function searchInternet(query) {
  if (!navigator.onLine) throw new Error('OFFLINE');
  const cleaned = cleanQuery(query) || query;
  let r = await wikiSearch(cleaned, 'ru'); if (r) return r;
  r = await wikiSearch(cleaned, 'en'); if (r) { r.text += '\n\n(из англоязычной Wikipedia)'; return r; }
  r = await ddgSearch(cleaned); if (r) return r;
  return await wikiSearch(query, 'ru');
}

function matchDialog(q) {
  const x = q.trim().toLowerCase();
  const name = state.user?.name?.split(' ')[0] || '';
  if (/^(привет|прив|здравствуй|хай|hi|hello|hey|добрый)/i.test(x)) return name ? `Привет, ${name}! Чем помочь?` : 'Привет! Чем помочь?';
  if (/как\s+(у\s+тебя\s+)?дела|как\s+ты/i.test(x)) return name ? `Всё отлично, ${name}. А у тебя?` : 'Всё отлично. А у тебя?';
  if (/^(пока|до свидания|бай|bye)/i.test(x)) return name ? `До встречи, ${name}!` : 'До встречи!';
  if (/спасибо|thanks/i.test(x)) return 'Пожалуйста!';
  if (/кто\s+ты|как\s+тебя\s+зовут/i.test(x)) return 'Я Orbita AI. Ищу информацию в интернете.';
  if (/который\s+час/i.test(x)) return `Сейчас ${new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}.`;
  const mm = x.match(/^(-?\d+(?:[.,]\d+)?)\s*([+\-*/x×÷])\s*(-?\d+(?:[.,]\d+)?)$/);
  if (mm) {
    const a = parseFloat(mm[1].replace(',','.')), b = parseFloat(mm[3].replace(',','.')), op = mm[2];
    let r;
    switch(op) {
      case '+': r=a+b; break;
      case '-': r=a-b; break;
      case '*': case 'x': case '×': r=a*b; break;
      case '/': case '÷': if(b===0) return 'На ноль делить нельзя.'; r=a/b; break;
    }
    return `${a} ${op} ${b} = **${Math.round(r*1000000)/1000000}**`;
  }
  return null;
}

async function generateAnswer(query) {
  if (hasProfanity(query)) return { text: 'Извини, на такие вопросы я не отвечаю. Давай поговорим на другие темы.', _isBlocked: true };
  const dialog = matchDialog(query);
  if (dialog) { await sleep(400); return { text: dialog, _isDialog: true }; }
  const search = await searchInternet(query);
  if (search) {
    if (hasProfanity(search.text)) return { text: 'Извини, на такие вопросы я не отвечаю.', _isBlocked: true };
    return search;
  }
  return { text: `К сожалению, я не нашёл ответа на «${query}».\n\nПопробуй переформулировать.` };
}

   ============================================================ */
function updateSendBtn() {
  if (state.busy) {
    sendBtn.disabled = false;
    sendBtn.classList.add('stop');
    sendBtn.classList.remove('cooldown');
    sendIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
    return;
  }
  if (state.rateLimit) {
    sendBtn.disabled = true;
    sendBtn.classList.remove('stop');
    sendBtn.classList.add('cooldown');
    return;
  }
  sendBtn.classList.remove('stop', 'cooldown');
  sendIcon.innerHTML = '<path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a1 1 0 00-1.4.92V9.5c0 .5.37.92.87.98L15 12 2.87 13.52c-.5.06-.87.48-.87.98v4.98a1 1 0 001.4.92z"/>';
  sendBtn.disabled = inputEl.value.trim().length === 0;
}

async function handleSend(textOverride) {
  const text = (textOverride ?? inputEl.value).trim();
  if (!text) { if (state.busy) { state.abortRequested = true; haptic('medium'); } return; }
  if (state.busy) return;

  const wait = checkLimit();
  if (wait > 0) { showToast(`Подожди ${Math.ceil(wait/1000)} сек…`); haptic('warning'); return; }

  // Запрещённые слова
  if (hasProfanity(text)) {
    markReq(); startCooldown();
    sendLog(text);
    ensureChat();
    const chat = getActiveChat();
    const empty = chatEl.querySelector('.empty'); if (empty) empty.remove();
    const ts = Date.now();
    chat.messages.push({ role: 'user', text, ts });
    chat.updatedAt = ts;
    store.saveChats(state.chats);
    appendUserMessage(text, true, chat.messages.length - 1);
    await sleep(300);
    const refuse = { role: 'ai', text: 'Извини, на такие вопросы я не отвечаю. Давай поговорим на другие темы.', ts: Date.now()+1, _blocked: true };
    chat.messages.push(refuse);
    store.saveChats(state.chats);
    appendAIMessage(refuse, false, chat.messages.length - 1);
    inputEl.value = '';
    localStorage.removeItem(KEYS.DRAFT);
    updateSendBtn();
    renderChatsList();
    haptic('error');
    return;
  }

  markReq(); startCooldown();
  sendLog(text);
  ensureChat();
  const chat = getActiveChat();
  if (!chat) return;
  state.busy = true;
  state.abortRequested = false;
  inputEl.value = '';
  localStorage.removeItem(KEYS.DRAFT);
  updateSendBtn();
  haptic('light');

  const empty = chatEl.querySelector('.empty'); if (empty) empty.remove();
  const ts = Date.now();
  chat.messages.push({ role: 'user', text, ts });
  autoTitle(chat, text);
  chat.updatedAt = ts;
  store.saveChats(state.chats);
  appendUserMessage(text, true, chat.messages.length - 1);
  renderChatsList();
  showTyping();

  let result;
  try { result = await generateAnswer(text); }
  catch(e) {
    hideTyping();
    state.busy = false;
    updateSendBtn();
    showToast(e.message === 'OFFLINE' ? 'Нет интернета' : 'Ошибка');
    haptic('error');
    return;
  }

  hideTyping();
  const aiMsg = { role: 'ai', text: result.text, source: result.source, ts: Date.now(), reaction: null, _blocked: result._isBlocked };
  chat.messages.push(aiMsg);
  chat.updatedAt = Date.now();
  store.saveChats(state.chats);

  if (result._isBlocked) {
    appendAIMessage(aiMsg, false, chat.messages.length - 1);
    state.busy = false;
    updateSendBtn();
    haptic('error');
    return;
  }

  const typeEl = appendAIMessage(aiMsg, true, chat.messages.length - 1);
  if (state.abortRequested) {
    typeEl.innerHTML = renderText(result.text);
    const c = typeEl.parentElement.querySelector('.cursor'); if (c) c.remove();
  } else {
    await typeText(typeEl, result.text);
  }

  const lastAi = chatEl.lastElementChild;
  if (lastAi?.classList.contains('ai')) {
    const body = lastAi.querySelector('.body');
    if (body && !body.querySelector('.msg-actions')) {
      appendActions(body, aiMsg, chat.messages.length - 1);
    }
  }

  state.busy = false;
  state.abortRequested = false;
  updateSendBtn();
  haptic('success');
}

/* ============================================================
   DRAWER
   ============================================================ */
function openDrawer() {
  $('drawer').classList.add('open');
  $('drawerOverlay').classList.add('open');
  lockScroll(true);
  showBackButton(closeDrawer);
}
function closeDrawer() {
  $('drawer').classList.remove('open');
  $('drawerOverlay').classList.remove('open');
  lockScroll(false);
  hideBackButton();
}

/* ============================================================
   ACCOUNT
   ============================================================ */
function openAccount() {
  closeDrawer();
  if (!state.user) return;
  $('accountNameInput').value = state.user.name || '';
  $('drawerAvatar').textContent = initials(state.user.name);
  $('drawerName').textContent = state.user.name || '—';
  $('accountOverlay').classList.add('open');
  lockScroll(true);
  showBackButton(closeAccount);
}
function closeAccount() {
  $('accountOverlay').classList.remove('open');
  lockScroll(false);
  hideBackButton();
}

function saveProfile() {
  const name = $('accountNameInput').value.replace(/[<>"'`]/g, '').trim().slice(0, 24);
  if (!name) { showToast('Введи имя'); return; }
  state.user.name = name;
  store.saveUser(state.user);
  $('drawerAvatar').textContent = initials(name);
  $('drawerName').textContent = name;
  if (getActiveChat()?.messages.length === 0) renderEmptyState();
  showToast('Сохранено');
  haptic('success');
  closeAccount();
}

async function clearAllData() {
  const ok = tg?.showConfirm
    ? await new Promise(r => tg.showConfirm('Очистить все данные?', res => r(res)))
    : confirm('Очистить все данные?');
  if (!ok) return;
  store.clear();
  state.user = null;
  state.chats = [];
  state.activeId = null;
  closeAccount();
  location.reload();
}

function exportChats() {
  const data = { version: 1, exportedAt: Date.now(), user: state.user, chats: state.chats };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `orbita-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Файл сохранён');
  haptic('success');
}

/* ============================================================
   INIT APP
   ============================================================ */
function initApp() {
  state.chats = store.getChats();
  state.activeId = store.getActive();
  ensureChat();
  renderChatsList();
  renderActiveChat();
  updateSendBtn();

  const elapsed = Date.now() - getLastReq();
  if (elapsed < RATE_MS) startCooldown();

  if (!state.user) {
    const tgName = tg?.initDataUnsafe?.user?.first_name || 'User';
    state.user = { name: tgName, joinedAt: Date.now() };
    store.saveUser(state.user);
  }
  $('drawerAvatar').textContent = initials(state.user.name);
  $('drawerName').textContent = state.user.name;
}

/* ============================================================
   EVENTS
   ============================================================ */
inputEl.addEventListener('input', () => {
  updateSendBtn();
  localStorage.setItem(KEYS.DRAFT, inputEl.value);
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
sendBtn.addEventListener('click', () => {
  if (state.busy) { state.abortRequested = true; return; }
  handleSend();
});

$('menuBtn').addEventListener('click', openDrawer);
$('newChatBtn').addEventListener('click', () => { if (!state.busy) { createChat(); closeDrawer(); } });
$('clearAllChatsBtn').addEventListener('click', async () => {
  const ok = tg?.showConfirm
    ? await new Promise(r => tg.showConfirm('Удалить все чаты?', res => r(res)))
    : confirm('Удалить все чаты?');
  if (!ok) return;
  state.chats = [];
  state.activeId = null;
  store.saveChats(state.chats);
  store.setActive('');
  createChat();
  showToast('Все чаты удалены');
});

$('drawerOverlay').addEventListener('click', closeDrawer);
$('userCard').addEventListener('click', openAccount);
$('saveProfileBtn').addEventListener('click', saveProfile);
$('closeAccountBtn').addEventListener('click', closeAccount);
$('clearDataBtn').addEventListener('click', clearAllData);
$('exportBtn').addEventListener('click', exportChats);
$('accountOverlay').addEventListener('click', e => {
  if (e.target === $('accountOverlay')) closeAccount();
});
$('closeAdminBtn').addEventListener('click', closeAdminPanel);
$('adminOverlay').addEventListener('click', e => {
  if (e.target === $('adminOverlay')) closeAdminPanel();
});
$('gateAction').addEventListener('click', sendAccessRequest);

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('load', async () => {
  const draft = localStorage.getItem(KEYS.DRAFT);
  if (draft) { inputEl.value = draft; updateSendBtn(); }

  await checkAccess();

  if (gateState === 'approved') {
    state.user = store.getUser() || {
      name: tg?.initDataUnsafe?.user?.first_name || 'User',
      joinedAt: Date.now()
    };
    store.saveUser(state.user);
    initApp();

    const uId = tg?.initDataUnsafe?.user?.id;
    if (uId === ADMIN_TG_ID) {
      const btn = document.createElement('button');
      btn.className = 'icon-btn';
      btn.style.cssText = 'position:fixed;right:12px;top:calc(14px + env(safe-area-inset-top));z-index:30;background:var(--danger);color:#fff';
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/></svg>';
      btn.onclick = openAdminPanel;
      document.body.appendChild(btn);
    }
  }
});
</script>
</body>
</html>
